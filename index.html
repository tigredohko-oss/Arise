function aplicarImport(){
  if(!impRes||!impRes.days.length) return;
  if(!confirm("¿Reemplazar tu rutina actual por la importada?\n\n"+impRes.stats.dias+" días · "+
    impRes.stats.ejercicios+" ejercicios.\n\nSe respalda antes. El XP se conserva y los records migran "+
    "cuando el nombre coincide.")) return;
  flushNow(); backup("pre-import-rutina",S);
  const byName={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{
    if(S.allTimeWeights[e.uid]!==undefined) byName[e.n]={best:S.allTimeWeights[e.uid],hist:S.weightHistory[e.uid]};
  }));
  S.xpBase=(S.xpBase||0)+weekXP(S.checked);
  const cruda={name:"IMPORTADA · "+impRes.stats.dias+" DÍAS",
    meta:{fase:"Importada",rir:"La que traiga tu rutina",descanso:"Heredado de la base cuando el ejercicio coincide",
          progresion:"Doble progresión: sube reps dentro del rango; al tope en todas, sube el peso",
          deload:"Cada 6-8 semanas o al estancarte 2 semanas",
          recorte:"Si vas corto de tiempo: último ejercicio → penúltimo → nunca el BOSS"},
    days:impRes.days.map(d=>({n:d.n,c:d.c,stat:d.stat,cardio:d.cardio,
      ex:d.ex.map(e=>({n:e.n,s:e.s,boss:!!e.boss,note:e.note||"",rest:e.rest||undefined,ref:e.match||undefined}))}))};
  S.routine=sanitizeRoutine(cruda);
  const nAT={},nWH={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{ const m=priorRecord(byName,e.n);
    if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; } }));
  S.allTimeWeights=nAT; S.weightHistory=nWH;
  S.checked={}; S.weights={}; S.sets={}; S.lastWeights={}; S.active=1;
  S.impLast=impTexto.slice(0,20000); S.proposal=null; S.xp=totalXP();
  save(); closeGen(); toast("RUTINA IMPORTADA · "+S.routine.days.length+" DÍAS");
}

  const pr=S.proposal; if(!pr||!pr.rutina) return;
  if(!confirm("¿Reemplazar tu rutina actual por la generada?\n\nSe respalda antes. El XP se conserva "+
    "y los records migran cuando el nombre del ejercicio coincide.")) return;
  flushNow(); backup("pre-generador",S);
  const byName={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{
    if(S.allTimeWeights[e.uid]!==undefined) byName[e.n]={best:S.allTimeWeights[e.uid],hist:S.weightHistory[e.uid]};
  }));
  S.xpBase=(S.xpBase||0)+weekXP(S.checked);
  /* misma frontera de confianza que el import: se reconstruye y se regeneran los uid */
  const limpia=sanitizeRoutine(pr.rutina);
  S.routine=limpia;
  const nAT={},nWH={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{ const m=priorRecord(byName,e.n);
    if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; } }));
  S.allTimeWeights=nAT; S.weightHistory=nWH;
  S.checked={}; S.weights={}; S.sets={}; S.lastWeights={}; S.active=1;
  S.proposal=null; S.xp=totalXP();
  save(); closeGen(); toast("RUTINA APLICADA · "+S.routine.days.length+" DÍAS");
}

         esc(err.message)+'<br><br>Tus datos siguen guardados. Ve a <b>DATA</b> y restaura un respaldo.</div></div>';

document.addEventListener("click",e=>{
  const t=e.target;
  const nav=t.closest("nav button");        if(nav){ flushNow(); TAB=nav.dataset.t; render(); return; }
  const go=t.closest("[data-go]");          if(go){ flushNow(); TAB=go.dataset.go; render(); return; }
  const dayb=t.closest(".days button");     if(dayb){ flushNow(); S.active=+dayb.dataset.d; save(); render(); syncWake(); return; }

  const chk=t.closest("[data-chk]");
  if(chk){ flushNow(); const id=chk.dataset.chk;
    const nowOn=!S.checked[id];
    if(nowOn) S.checked[id]=true; else delete S.checked[id];
    save(); render(); buzz([12]);
    if(nowOn){
      const f=findEx(id);                       // null si es el cardio
      if(f) startRest(restFor(f.e),f.e.n); else stopRest(false);
      acquireWake();
    }
    syncWake();
    return; }

  const pm=t.closest("[data-pm]");
  if(pm){ progMetric=pm.dataset.pm; render(); return; }

  const tech=t.closest("[data-tech]");
  if(tech){ const k=tech.dataset.tech; if(openTech[k]) delete openTech[k]; else openTech[k]=1; render(); return; }

  /* ---- generador ---- */
  if(t.id==="glosBtn"){ flushNow(); $("#gen").classList.add("on"); $("#genBar").classList.add("on");
    document.body.style.overflow="hidden"; renderGloss(); return; }
  const gl=t.closest("[data-gl]");
  if(gl){ const g=glosaDe(gl.dataset.gl); if(g) toast(g.k+" = "+g.t); return; }

  if(idel&&impRes){ const [di,ei]=idel.dataset.iedel.split("-").map(Number);
    const d=impRes.days[di]; if(!d) return;
    d.ex.splice(ei,1);
    if(!d.ex.length) impRes.days.splice(di,1);
    else if(!d.ex.some(x=>x.boss)) d.ex[0].boss=true;
    impRes.stats.dias=impRes.days.length;
    impRes.stats.ejercicios=impRes.days.reduce((a,x)=>a+x.ex.length,0);
    impRes.stats.series=impRes.days.reduce((a,x)=>a+x.ex.reduce((b,e)=>b+(e.sets||0),0),0);
    renderImpRev(); return; }
  if(t.id==="openGen"){ flushNow(); openGen(); return; }
  if(t.id==="openPain"){ flushNow(); $("#gen").classList.add("on"); $("#genBar").classList.add("on");
    document.body.style.overflow="hidden"; renderPain(); return; }
  if(t.id==="genCancel"){ closeGen(); return; }
  if(t.id==="genBack"){ S.proposal=null; save(); renderGen(); return; }
  if(t.id==="genApply"){ aplicarPropuesta(); return; }
  if(t.id==="genRun"){
    const inp=Object.assign({},genForm,{dolor:genForm.pain});
    S.gen={edad:inp.edad,sexo:inp.sexo,peso:inp.peso,altura:inp.altura,anios:inp.anios,dias:+inp.dias,
           minutos:inp.minutos,cardio:inp.cardio,objetivo:inp.objetivo,cintura:inp.cintura,
           equipo:inp.equipo.slice(),prioridad:inp.prioridad.slice(),excluirTags:inp.excluirTags.slice(),
           favoritos:(inp.favoritos||[]).slice()};
    S.pain=JSON.parse(JSON.stringify(genForm.pain));
    let res;
    try{ res=generar(GENDB,inp); }
    catch(err){ toast("ERROR AL GENERAR: "+err.message); return; }
    S.proposal=res.bloqueo?null:{rutina:res.rutina,audit:res.audit,avisos:res.avisos};
    save(); renderPropuesta(res);
    return;
  }
  const geq=t.closest("[data-geq]");
  if(geq&&genForm){ const k=geq.dataset.geq, i=genForm.equipo.indexOf(k);
    if(i>=0) genForm.equipo.splice(i,1); else genForm.equipo.push(k); renderGen(); return; }
  const gpr=t.closest("[data-gpr]");
  if(gpr&&genForm){ const k=gpr.dataset.gpr, i=genForm.prioridad.indexOf(k);
    if(i>=0) genForm.prioridad.splice(i,1);
    else { if(genForm.prioridad.length>=2){ toast("MÁXIMO 2 PRIORIDADES"); return; } genForm.prioridad.push(k); }
    renderGen(); return; }
  const gtag=t.closest("[data-gtag]");
  if(gtag&&genForm){ const k=gtag.dataset.gtag, i=genForm.excluirTags.indexOf(k);
    if(i>=0) genForm.excluirTags.splice(i,1); else genForm.excluirTags.push(k); renderGen(); return; }
  const gz=t.closest("[data-gz]");
  if(gz&&genForm){ const z=gz.dataset.gz, v=+gz.dataset.sev;
    if(v===0) delete genForm.pain.zonas[z]; else genForm.pain.zonas[z]={sev:v};
    renderGen(); return; }
  const gfav=t.closest("[data-gfav]");
  if(gfav&&genForm){ const k=gfav.dataset.gfav; genForm.favoritos=genForm.favoritos||[];
    const i=genForm.favoritos.indexOf(k);
    if(i>=0) genForm.favoritos.splice(i,1); else genForm.favoritos.push(k);
    renderGen(); return; }
  const gfl=t.closest("[data-gfl]");
  if(gfl&&genForm){ const k=gfl.dataset.gfl;
    if(genForm.pain.banderas[k]) delete genForm.pain.banderas[k]; else genForm.pain.banderas[k]=true;
    renderGen(); return; }
  const pchk=t.closest("[data-paincheck]");
  if(pchk){ pedirDolor(pchk.dataset.paincheck); return; }

  if(t.id==="rbAdd"){ if(restRunning()){ rest.end+=30000; rest.total+=30; tickRest(); toast("+30 s"); } return; }
  if(t.id==="rbSkip"){ stopRest(false); toast("DESCANSO SALTADO"); return; }

  const ts=t.closest("[data-ts]");
  if(ts){ S.settings.ts=ts.dataset.ts; save(); aplicarEscala(); render(); return; }
  const fs2=t.closest("[data-fase]");
  if(fs2){ S.settings.fase=fs2.dataset.fase; save(); render(); toast("FASE: "+FASE_ES[fs2.dataset.fase]); return; }

  const tg=t.closest("[data-set]");
  if(tg){ const k=tg.dataset.set;
    S.settings[k]=!setOf(k); save(); render();
    if(k==="wake") syncWake();
    if(k==="timer"&&!S.settings.timer) stopRest(false);
    if(k==="sound"&&S.settings.sound) beep(880,0.14);
    if(k==="vibrate"&&S.settings.vibrate) buzz([40]);
    return; }

  if(t.id==="closeWeek"){ closeWeek(); return; }
  if(t.id==="saveM"){ saveMeasurement(); return; }

  const del=t.closest("[data-del]");
  if(del){ const d=del.dataset.del;
    if(confirm("¿Borrar la medición del "+d+"?")){ S.measurements=S.measurements.filter(m=>m.date!==d); save(); render(); toast("MEDICIÓN BORRADA"); }
    return; }

  /* ---- editor de rutina ---- */
  const dmv=t.closest("[data-dmv]");
  if(dmv){ flushNow(); const ds=S.routine.days, i=ds.findIndex(d=>d.uid===dmv.dataset.dmv), j=i+ +dmv.dataset.dir;
    if(j>=0&&j<ds.length){ const cur=ds[S.active-1]; ds.splice(j,0,ds.splice(i,1)[0]);
      S.active=ds.indexOf(cur)+1||1; save(); render(); } return; }
  const ddel=t.closest("[data-ddel]");
  if(ddel){ const d=findDay(ddel.dataset.ddel); if(!d) return;
    if(!confirm('¿Borrar el día "'+d.n+'" y sus '+d.ex.length+' ejercicios?\n\nLos records all-time se conservan.')) return;
    purge("c_"+d.uid); d.ex.forEach(e=>purge(e.uid));
    S.routine.days=S.routine.days.filter(x=>x.uid!==d.uid);
    if(S.active>S.routine.days.length) S.active=Math.max(1,S.routine.days.length);
    save(); render(); toast("DÍA ELIMINADO"); return; }
  if(t.id==="addDay"){ flushNow();
    S.routine.days.push({uid:uid("d_"),n:"NUEVO DÍA",c:COLORS[S.routine.days.length%COLORS.length],
      stat:"STR",cardio:CARDIO_DEF,ex:[]});
    save(); render(); toast("DÍA AGREGADO"); return; }

  const sw=t.closest("[data-dc]");
  if(sw){ const d=findDay(sw.dataset.dc); if(d){ d.c=sw.dataset.col; save(); render(); } return; }

  const eadd=t.closest("[data-eadd]");
  if(eadd){ flushNow(); const d=findDay(eadd.dataset.eadd); if(!d) return;
    d.ex.push({uid:uid("x_"),n:"Nuevo ejercicio",s:"3×10",boss:false,note:""}); save(); render(); return; }
  const emv=t.closest("[data-emv]");
  if(emv){ flushNow(); const f=findEx(emv.dataset.emv); if(!f) return;
    const i=f.d.ex.indexOf(f.e), j=i+ +emv.dataset.dir;
    if(j>=0&&j<f.d.ex.length){ f.d.ex.splice(j,0,f.d.ex.splice(i,1)[0]); save(); render(); } return; }
  const edel=t.closest("[data-edel]");
  if(edel){ const f=findEx(edel.dataset.edel); if(!f) return;
    if(!confirm('¿Borrar "'+f.e.n+'"?')) return;
    purge(f.e.uid); f.d.ex=f.d.ex.filter(x=>x.uid!==f.e.uid); save(); render(); return; }
  const eb=t.closest("[data-eboss]");
  if(eb){ const f=findEx(eb.dataset.eboss); if(f){ f.e.boss=!f.e.boss; save(); render(); } return; }

  const pr=t.closest("[data-preset]");
  if(pr){ loadPreset(pr.dataset.preset); return; }
});

/* ---- inputs ---- */
document.addEventListener("input",e=>{
  const el=e.target, d=el.dataset; if(!d) return;
  let hit=true;
  if(d.w!==undefined) S.weights[d.w]=el.value;
  else if(d.s!==undefined) S.sets[d.s]=el.value;
  else if(d.rn!==undefined) S.routine.name=el.value;
  else if(d.dn!==undefined){ const x=findDay(d.dn); if(x) x.n=el.value; }
  else if(d.dcard!==undefined){ const x=findDay(d.dcard); if(x) x.cardio=el.value; }
  else if(d.ds!==undefined){ const x=findDay(d.ds); if(x) x.stat=el.value; }
  else if(d.en!==undefined){ const f=findEx(d.en); if(f) f.e.n=el.value; }
  else if(d.es!==undefined){ const f=findEx(d.es); if(f) f.e.s=el.value; }
  else if(d.g!==undefined&&genForm){ genForm[d.g]=el.value; hit=false; }
  else if(d.idn!==undefined&&impRes){ const x=impRes.days[+d.idn]; if(x) x.n=el.value; hit=false; }
  else if(d.ien!==undefined&&impRes){ const [a,b]=d.ien.split("-").map(Number);
    const x=impRes.days[a]&&impRes.days[a].ex[b]; if(x) x.n=el.value; hit=false; }
  else if(d.ies!==undefined&&impRes){ const [a,b]=d.ies.split("-").map(Number);
    const x=impRes.days[a]&&impRes.days[a].ex[b]; if(x) x.s=el.value; hit=false; }
  else if(d.ienote!==undefined&&impRes){ const [a,b]=d.ienote.split("-").map(Number);
    const x=impRes.days[a]&&impRes.days[a].ex[b]; if(x) x.note=el.value; hit=false; }
  else if(d.enote!==undefined){ const f=findEx(d.enote); if(f) f.e.note=el.value; }
  else if(d.erest!==undefined){ const f=findEx(d.erest);
    if(f){ const v=parseInt(el.value,10);
      if(isFinite(v)&&v>=10&&v<=900) f.e.rest=v; else delete f.e.rest; } }
  else hit=false;
  if(hit){ pulse(el); queueSave(); }
});
document.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d&&d.g!==undefined&&genForm){ genForm[d.g]=e.target.value; return; }
  if(d&&d.ds!==undefined){ const x=findDay(d.ds); if(x){ x.stat=e.target.value; save(); } }
});
document.addEventListener("blur",e=>{
  const id=e.target&&e.target.dataset?e.target.dataset.w:null;
  if(id==null) return;
  flushNow();
  const n=parseFloat(String(e.target.value).replace(",","."));
  if(!isNaN(n)&&n>0){
    const best=S.allTimeWeights[id];
    (S.weightHistory[id]=S.weightHistory[id]||[]).push({w:n,d:today()});
    if(S.weightHistory[id].length>200) S.weightHistory[id]=S.weightHistory[id].slice(-200);
    if(best===undefined||n>best){ S.allTimeWeights[id]=n; save();
      e.target.classList.add("pr"); setTimeout(()=>e.target.classList.remove("pr"),1600);
      const f=findEx(id);
      prPop(f?f.e.n:"", n);                      // feedback inmediato, no solo el toast
    } else save();
  }
},true);

function closeWeek(){
  const nd=S.routine.days.length, cleared=S.routine.days.filter(questDone).length, full=nd>0&&cleared===nd;
  if(!confirm("Cerrar semana "+S.week+"?\n\nQuests completadas: "+cleared+"/"+nd+
    (full?"\nBono de semana completa: +"+XP_WEEK_CLEAR+" XP":"")+
    "\n\nSe borran checks y pesos de la semana. Records e historial se conservan.")) return;
  flushNow(); backup("cierre semana "+S.week,S);
  stopRest(false); releaseWake();
  const ganado=weekXP(S.checked)+(full?XP_WEEK_CLEAR:0);
  S.weekLog=(S.weekLog||[]).concat([{w:S.week||1,d:today(),q:cleared,nd:nd,xp:ganado,full:full}]).slice(-200);
  S.xpBase=(S.xpBase||0)+ganado;
  S.lastWeights=Object.assign({},S.weights);
  S.prev=Object.assign({},S.prev);                 // la carga de esta semana pasa a ser "la última vez"
  const hoy=today();
  Object.keys(S.weights).forEach(k=>{ if(S.weights[k]) S.prev[k]={w:String(S.weights[k]),r:String(S.sets[k]||""),d:hoy}; });
  S.checked={}; S.weights={}; S.sets={}; S.weekBonus=full;
  S.week=(S.week||1)+1; S.active=1; S.xp=totalXP();
  save(); render();
  toast(full?"SEMANA COMPLETA · +"+XP_WEEK_CLEAR+" XP":"SEMANA "+S.week+" INICIADA");
}
function loadPreset(key){
  const P = key==="ul5"?PRESET_UL5:PRESET_C5;
  if(!confirm('¿Reemplazar la rutina actual por "'+P.name+'"?\n\nSe respalda antes. Los records se conservan cuando el nombre coincide.')) return;
  flushNow(); backup("pre-preset "+key,S);
  const byName={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{
    if(S.allTimeWeights[e.uid]!==undefined) byName[e.n]={best:S.allTimeWeights[e.uid],hist:S.weightHistory[e.uid]};
  }));
  S.xpBase=(S.xpBase||0)+weekXP(S.checked);
  S.routine=buildRoutine(P);
  const nAT={},nWH={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{ const m=priorRecord(byName,e.n); if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; } }));
  S.allTimeWeights=nAT; S.weightHistory=nWH;
  S.checked={}; S.weights={}; S.sets={}; S.lastWeights={}; S.active=1; S.xp=totalXP();
  save(); render(); toast("RUTINA CARGADA · "+P.days.length+" DÍAS");
}
function saveMeasurement(){
  const date=$("#m_date").value||today(), wk=parseInt($("#m_week").value,10), label=($("#m_label").value||"").trim();
  const m={date:date,week:isNaN(wk)?S.week:wk}; if(label) m.label=label;
  let any=false;
  MFIELDS.forEach(f=>{ const v=parseFloat(String(document.querySelector('[data-m="'+f.k+'"]').value).replace(",","."));
    if(!isNaN(v)){ m[f.k]=v; any=true; } });
  if(!any){ toast("SIN DATOS QUE GUARDAR"); return; }
  S.measurements=S.measurements.filter(x=>x.date!==date);
  S.measurements.push(m); S.measurements.sort((a,b)=>a.date<b.date?-1:1);
  save(); render(); toast("MEDICIÓN SEMANA "+m.week+" GUARDADA");
}
function wireData(){
  $("#btnCopy").onclick=async()=>{ const txt=exportBundle();
    try{ await navigator.clipboard.writeText(txt); toast("COPIADO AL PORTAPAPELES"); }
    catch(e){ const b=$("#expBox"); b.focus(); b.select(); document.execCommand("copy"); toast("COPIADO"); } };
  $("#btnDl").onclick=()=>{ const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([exportBundle()],{type:"application/json"}));
    a.download="arise-"+profile+"-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast("DESCARGANDO"); };
  $("#btnShare").onclick=async()=>{ if(navigator.share){ try{ await navigator.share({title:"ARISE backup",text:exportBundle()}) }catch(e){} } else toast("COMPARTIR NO DISPONIBLE"); };
  $("#btnImp").onclick=()=>{
    const txt=$("#impBox").value.trim(); if(!txt){ toast("PEGA EL JSON PRIMERO"); return; }
    let p; try{ p=parseImport(txt); }catch(e){ toast("ERROR: "+e.message); return; }
    const snapshot=JSON.parse(JSON.stringify(S));
    let inc;
    try{ inc=upgrade(sanitizeState(p.state)); }          // saneado en la frontera
    catch(err){ S=snapshot; toast("IMPORT INVÁLIDO: "+err.message); return; }
    finally{ S=snapshot; }                              // upgrade reasigna S; restaurar siempre
    if(!confirm("Importar y reemplazar el perfil actual?\n\nEntrante: "+inc.xp+" XP · semana "+inc.week+
      " · "+inc.measurements.length+" mediciones\nActual: "+S.xp+" XP · semana "+S.week)) return;
    backup("auto pre-import",S);
    // los respaldos ajenos NO pisan los tuyos: solo rellenan el espacio sobrante
    if(p.backups){
      const mios=readJSON(bKey(profile))||[];
      const ajenos=p.backups.slice(0,MAX_BACKUPS).map(b=>({t:asNum(asObj(b).t,0),
        label:"[importado] "+asStr(asObj(b).label,60), schema:asNum(asObj(b).schema,1),
        app:asStr(asObj(b).app,12), data:asObj(asObj(b).data)}));
      writeJSON(bKey(profile),mios.concat(ajenos).slice(0,MAX_BACKUPS));
    }
    S=inc; lastLevel=null; lastTier=null; save(); render(); toast("IMPORTADO · "+S.xp+" XP");
  };
  $("#btnWipe").onclick=()=>{
    if(!confirm("BORRAR TODO el perfil "+profileName(profile)+"? Irreversible.")) return;
    if(confirm("¿Descargar un respaldo antes de borrar? (recomendado)")) $("#btnDl").click();
    if(!confirm("Última confirmación: se borra todo el historial de este perfil.")) return;
    localStorage.removeItem(sKey(profile)); localStorage.removeItem(bKey(profile));
    S=upgrade(blank()); lastLevel=null; lastTier=null; save(); render(); toast("PERFIL BORRADO"); };
  const addP=$("#addProfile");
  if(addP) addP.onclick=()=>{
    const name=(prompt("Nombre del perfil nuevo:","")||"").trim();
    if(!name) return;
    const list=profiles(), id=newProfileId();
    flushNow(); save();
    list.push({id:id,name:name.slice(0,40)}); saveProfiles(list);
    switchProfile(id,true);
  };
  document.querySelectorAll("[data-pgo]").forEach(b=>{ b.onclick=()=>switchProfile(b.dataset.pgo,false); });
  document.querySelectorAll("[data-pren]").forEach(b=>{ b.onclick=()=>{
    const id=b.dataset.pren, list=profiles(), cur=list.find(x=>x.id===id); if(!cur) return;
    const name=(prompt("Nuevo nombre:",cur.name)||"").trim(); if(!name) return;
    cur.name=name.slice(0,40); saveProfiles(list); render(); toast("PERFIL RENOMBRADO");
  };});
  document.querySelectorAll("[data-pdel]").forEach(b=>{ b.onclick=()=>{
    const id=b.dataset.pdel, list=profiles();
    if(list.length<2){ toast("NO PUEDES BORRAR EL ÚLTIMO PERFIL"); return; }
    const cur=list.find(x=>x.id===id);
    if(!confirm('¿Borrar el perfil "'+(cur?cur.name:id)+'" y TODO su historial?\n\nIrreversible.')) return;
    if(!confirm("Última confirmación. Se pierden su XP, cargas y medidas.")) return;
    localStorage.removeItem(sKey(id)); localStorage.removeItem(bKey(id));
    const rest=list.filter(x=>x.id!==id); saveProfiles(rest);
    if(id===profile){ switchProfile(rest[0].id,false); return; }
    render(); toast("PERFIL BORRADO");
  };});
  document.querySelectorAll("[data-rest]").forEach(b=>{ b.onclick=()=>{
    const x=(readJSON(bKey(profile))||[])[+b.dataset.rest]; if(!x) return;
    if(!confirm("Restaurar este respaldo? El estado actual se respalda antes.")) return;
    backup("auto pre-restore",S);
    const snap=JSON.parse(JSON.stringify(S));
    let rec; try{ rec=upgrade(sanitizeState(x.data)); }
    catch(err){ S=snap; toast("RESPALDO INVÁLIDO"); return; } finally{ S=snap; }
    S=rec; lastLevel=null; lastTier=null; save(); render(); toast("RESTAURADO"); }; });
}

function switchProfile(id,isNew){
  if(!PROFILE_RE.test(id)) { toast("PERFIL INVÁLIDO"); return; }
  flushNow(); save();                       // guarda el perfil que dejas
  profile=id; localStorage.setItem(K_ACTIVE,id);
  const raw=readJSON(sKey(id));
  S=upgrade(raw||blank());
  Object.keys(openTech).forEach(k=>delete openTech[k]);
  stopRest(false); releaseWake();
  lastLevel=levelFrom(totalXP()).lv;        // sin animación de level-up ni video al cambiar
  lastTier=tierOf(rankOf(lastLevel).r).t;
  S.profile=id; save(); render();
  toast(isNew?"PERFIL CREADO · "+profileName(id):"AHORA ERES "+profileName(id).toUpperCase());
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; manifest-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARISE</title>
<style>
:root{
  --bg:#05070f; --panel:#0c1222;
  --line:#1d2b47; --line2:#2a3f66;
  --cy:#4fd6ff; --vi:#8b7cff; --gd:#ffca4f;
  --tx:#e8f0ff; --dim:#a3b4d2; --dim2:#8496b8;
  --ok:#39d98a; --bad:#ff5f6d;
  --sf:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mn:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{zoom:var(--ts,1)}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sf);
  min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 50% -10%,rgba(79,214,255,.10),transparent 70%),
    radial-gradient(700px 400px at 100% 100%,rgba(139,124,255,.07),transparent 70%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(79,214,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(79,214,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 78%);
}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 14px 120px}

header{padding:18px 0 10px;text-align:center;position:relative}
.brand{font-family:var(--mn);font-size:34px;letter-spacing:.26em;font-weight:700;color:var(--cy);text-indent:.42em;
  text-shadow:0 0 12px rgba(79,214,255,.55),0 0 40px rgba(79,214,255,.22)}
.brand span{color:var(--vi);text-shadow:0 0 12px rgba(139,124,255,.6)}
.sub{font-family:var(--mn);font-size:13px;letter-spacing:.22em;color:var(--dim2);margin-top:5px;text-indent:.34em}
.vtag{position:absolute;top:20px;right:2px;font-family:var(--mn);font-size:11.5px;color:var(--dim2);
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:rgba(12,18,34,.7)}

.hcard{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--panel),rgba(8,12,24,.85));
  padding:14px;margin:6px 0 12px;position:relative;overflow:hidden}
.hrow{display:flex;align-items:center;gap:13px}
.sigil{width:62px;height:62px;flex:0 0 62px;border-radius:12px;border:1px solid var(--line2);
  background:radial-gradient(circle at 50% 40%,rgba(79,214,255,.16),rgba(5,7,15,.9) 70%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:border-color .4s,box-shadow .4s}
.sigil svg{width:40px;height:40px}
.sigil img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
#rankvid{position:fixed;inset:0;z-index:105;display:none;align-items:center;justify-content:center;background:#000}
#rankvid.on{display:flex;animation:fade .3s ease}
#rankvid video{max-width:100%;max-height:100%;height:100%;object-fit:contain;background:#000}
#rankvid button{position:absolute;bottom:24px;right:18px;z-index:2;cursor:pointer;color:#fff;
  font-family:var(--mn);font-size:12px;letter-spacing:.14em;padding:9px 15px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.4);border-radius:7px}
#rankvid button:active{transform:scale(.96)}
.hmeta{flex:1;min-width:0}
.hname{font-family:var(--mn);font-size:13.5px;letter-spacing:.16em;color:var(--dim)}
.hlvl{display:flex;align-items:baseline;gap:9px;margin-top:1px}
.hlvl b{font-family:var(--mn);font-size:25px;letter-spacing:.05em;color:var(--tx);line-height:1.1}
.rank{font-family:var(--mn);font-size:12.5px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:5px;border:1px solid currentColor}
.rtitle{font-size:12px;color:var(--dim2);margin-top:3px;font-style:italic}
.bar{height:7px;border-radius:4px;background:#0a1120;border:1px solid var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));
  box-shadow:0 0 12px rgba(79,214,255,.6);transition:width .55s cubic-bezier(.2,.9,.25,1)}
.xprow{display:flex;justify-content:space-between;font-family:var(--mn);font-size:13px;color:var(--dim2);margin-top:5px}

nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
nav button{font-family:var(--mn);font-size:12.5px;letter-spacing:.08em;padding:10px 1px;border-radius:9px;
  border:1px solid var(--line);background:rgba(12,18,34,.75);color:var(--dim);cursor:pointer;transition:.18s}
nav button.on{color:var(--cy);border-color:rgba(79,214,255,.55);background:rgba(79,214,255,.1)}

.days{display:grid;gap:6px;margin-bottom:12px}
.days button{font-family:var(--mn);font-size:12.5px;font-weight:700;padding:11px 0;border-radius:9px;
  border:1px solid var(--line);background:rgba(12,18,34,.75);color:var(--dim2);cursor:pointer;position:relative;transition:.18s}
.days button.on{color:#fff;border-color:var(--dc);background:color-mix(in srgb,var(--dc) 15%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--dc) 30%,transparent)}
.days button.done::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 7px var(--ok)}

.quest{border:1px solid var(--line);border-radius:14px;background:linear-gradient(170deg,var(--panel),rgba(8,12,24,.8));overflow:hidden}
.qhead{padding:13px 14px;border-bottom:1px solid var(--line);border-left:3px solid var(--dc);position:relative}
.qtag{font-family:var(--mn);font-size:12.5px;letter-spacing:.28em;color:var(--dc)}
.qname{font-size:17.5px;font-weight:800;letter-spacing:.03em;margin-top:2px;padding-right:44px}
.qsub{font-family:var(--mn);font-size:13px;color:var(--dim2);margin-top:4px;letter-spacing:.1em}
.qprog{position:absolute;right:14px;top:15px;font-family:var(--mn);font-size:12.5px;color:var(--dim)}

.ex{padding:11px 13px;border-bottom:1px solid rgba(29,43,71,.55);display:flex;gap:11px;align-items:flex-start}
.ex:last-child{border-bottom:none}
.ex.cardio{background:rgba(79,214,255,.045)}
.ex.done .exn{color:var(--dim2);text-decoration:line-through;text-decoration-color:rgba(127,146,181,.5)}
.chk{width:26px;height:26px;flex:0 0 26px;border-radius:7px;border:1.5px solid var(--line2);background:rgba(5,7,15,.6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;margin-top:1px}
.chk.on{background:var(--dc);border-color:var(--dc);box-shadow:0 0 14px color-mix(in srgb,var(--dc) 55%,transparent)}
.chk svg{width:14px;height:14px;stroke:#04070f;stroke-width:3.4;fill:none;opacity:0;transition:.16s}
.chk.on svg{opacity:1}
.exb{flex:1;min-width:0}
.exn{font-size:15.5px;font-weight:650;line-height:1.28}
.exs{font-family:var(--mn);font-size:12px;color:var(--dim);margin-top:3px}
.exnote{font-family:var(--sf);font-size:13px;color:var(--dim2);margin-top:3px;line-height:1.45;
  padding-left:7px;border-left:2px solid var(--line2)}
.proto{display:grid;gap:7px}
.proto div{display:flex;gap:8px;align-items:baseline}
.prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(29,43,71,.5)}
.prow:last-child{border-bottom:none}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:0 0 9px}
.prow.on .pdot{background:var(--cy);box-shadow:0 0 9px var(--cy)}
.prow .pn{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.on .pn{color:var(--cy);font-weight:650}
.info{width:24px;height:24px;flex:0 0 24px;border-radius:6px;border:1px solid var(--line2);
  background:rgba(12,18,34,.7);color:var(--dim);font-family:var(--mn);font-size:12.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:2px;padding:0}
.info.on{color:var(--cy);border-color:rgba(79,214,255,.5);background:rgba(79,214,255,.1)}
.tech{margin-top:9px;border:1px solid var(--line);border-radius:9px;background:rgba(5,7,15,.55);padding:10px 11px}
.tech .tm{font-family:var(--mn);font-size:12.5px;letter-spacing:.14em;color:var(--cy);margin-bottom:7px}
.tech ol{margin:0;padding-left:17px}
.tech li{font-family:var(--sf);font-size:13.5px;color:var(--dim);line-height:1.5;margin-bottom:4px}
.tech .tkey{font-size:12.5px;color:var(--ok);line-height:1.5;margin-top:8px}
.tech .terr{font-size:12.5px;color:#ffc9a3;line-height:1.5;margin-top:5px}
.tech .tyt{display:inline-block;margin-top:9px;font-family:var(--mn);font-size:12.5px;color:var(--cy);
  border:1px solid var(--line2);border-radius:7px;padding:7px 11px;text-decoration:none}
.improw{display:flex;gap:7px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(29,43,71,.45)}
.improw:last-child{border-bottom:none}
.improw .ic{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.improw .is{flex:0 0 84px}
.improw input{width:100%;background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:7px;
  color:var(--tx);font-family:var(--sf);font-size:13.5px;padding:8px 9px;outline:none}
.improw input.mono{font-family:var(--mn);font-size:12.5px;color:var(--dim)}
.improw input:focus{border-color:var(--cy)}
.mtag{font-family:var(--mn);font-size:11.5px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
  color:var(--dim2);white-space:nowrap}
.mtag.ok{color:var(--ok);border-color:rgba(57,217,138,.45)}
.mtag.no{color:var(--gd);border-color:rgba(255,202,79,.4)}
.sline{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(29,43,71,.4);font-size:12.5px}
.sline:last-child{border-bottom:none}
.sline .sn{flex:0 0 34px;font-family:var(--mn);font-size:11.5px;color:var(--dim2)}
.sline .st{flex:1;min-width:0;color:var(--dim);word-break:break-word}
.favg{font-family:var(--mn);font-size:12.5px;letter-spacing:.14em;color:var(--dim2);margin:12px 0 6px}
.tech .attr{font-family:var(--mn);font-size:12px;color:var(--dim2);margin-top:8px}
.proto b{font-family:var(--mn);font-size:12px;letter-spacing:.14em;color:var(--dim2);flex:0 0 74px}
.proto span{font-size:13.5px;color:var(--dim);line-height:1.45}
.boss{display:inline-block;font-family:var(--mn);font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--gd);
  border:1px solid rgba(255,202,79,.5);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:1px;background:rgba(255,202,79,.09)}
.inputs{display:flex;gap:7px;margin-top:8px}
.fld{flex:1;position:relative}
.fld label{position:absolute;top:-6px;left:8px;font-family:var(--mn);font-size:12px;letter-spacing:.14em;
  color:var(--dim2);background:var(--panel);padding:0 4px}
.fld input{width:100%;background:rgba(5,7,15,.65);border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font-family:var(--mn);font-size:14.5px;padding:8px 9px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(79,214,255,.15)}
.fld input.saved{border-color:var(--ok)!important;box-shadow:0 0 0 2px rgba(57,217,138,.2)!important}
.fld input.pr{border-color:var(--gd)!important;box-shadow:0 0 0 2px rgba(255,202,79,.28)!important}
.prbadge{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-family:var(--mn);font-size:11.5px;
  font-weight:700;letter-spacing:.1em;color:var(--gd);pointer-events:none}
.last{font-family:var(--mn);font-size:12.5px;color:var(--dim2);margin-top:5px}

.pnl{border:1px solid var(--line);border-radius:13px;background:linear-gradient(170deg,var(--panel),rgba(8,12,24,.8));padding:14px;margin-bottom:12px}
.ptit{font-family:var(--mn);font-size:12px;letter-spacing:.26em;color:var(--cy);margin-bottom:11px}
.ptit.v{color:var(--vi)}.ptit.g{color:var(--gd)}
.muted{font-family:var(--sf);font-size:14px;color:var(--dim);line-height:1.55}
.btn{font-family:var(--mn);font-size:12.5px;letter-spacing:.12em;padding:11px 12px;border-radius:9px;
  border:1px solid var(--line2);background:rgba(79,214,255,.08);color:var(--cy);cursor:pointer;transition:.16s;width:100%}
.btn:active{transform:scale(.985)}
.btn.g{background:rgba(57,217,138,.1);border-color:rgba(57,217,138,.45);color:var(--ok)}
.btn.r{background:rgba(255,95,109,.09);border-color:rgba(255,95,109,.4);color:var(--bad)}
.btn.gh{background:transparent;color:var(--dim)}
.btn.sm{padding:8px 6px;font-size:12px}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.brow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
textarea{width:100%;background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-family:var(--mn);font-size:12px;padding:10px;min-height:96px;outline:none;resize:vertical}
.note{font-family:var(--sf);font-size:12.5px;color:var(--dim2);margin-top:8px;line-height:1.5}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mgrid.f{grid-template-columns:1fr}
.mf{position:relative;margin-top:6px}
.mf label{position:absolute;top:-6px;left:8px;font-family:var(--mn);font-size:12px;letter-spacing:.13em;
  color:var(--dim2);background:var(--panel);padding:0 4px}
.mf input{width:100%;background:rgba(5,7,15,.65);border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font-family:var(--mn);font-size:16px;padding:11px 9px;outline:none}
.mf input:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(79,214,255,.15)}
.grp{font-family:var(--mn);font-size:12.5px;letter-spacing:.22em;color:var(--dim2);margin:14px 0 2px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(29,43,71,.5)}
.mrow:last-child{border-bottom:none}
.mrow .k{font-size:14px;color:var(--dim);padding-right:8px}
.mrow .v{font-family:var(--mn);font-size:15px;white-space:nowrap}
.dlt{font-family:var(--mn);font-size:12px;margin-left:7px}
.up{color:var(--ok)}.dn{color:var(--bad)}.eq{color:var(--dim2)}
.alert{border:1px solid rgba(255,202,79,.4);background:rgba(255,202,79,.08);border-radius:10px;padding:11px 12px;
  font-size:14px;color:#ffe0a3;line-height:1.5;margin-bottom:11px}
.alert.bad{border-color:rgba(255,95,109,.4);background:rgba(255,95,109,.08);color:#ffc2c7}
.alert.ok{border-color:rgba(57,217,138,.4);background:rgba(57,217,138,.08);color:#b6f2d4}
.entry{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;background:rgba(5,7,15,.4)}
.entry h4{margin:0 0 7px;font-family:var(--mn);font-size:12.5px;letter-spacing:.14em;color:var(--cy);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{font-family:var(--mn);font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 7px}
.spark{width:100%;height:52px;display:block;margin-top:6px}
.cht{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.lgd{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 4px;font-family:var(--mn);font-size:11px;color:var(--dim)}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.hero{font-family:var(--mn);font-size:30px;line-height:1.1;color:var(--tx);margin:2px 0 1px}
.hero small{font-size:12px;color:var(--dim2);letter-spacing:.1em}
.frow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(29,43,71,.5)}
.frow:last-child{border-bottom:none}
.frow .fn{flex:1;min-width:0;font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fs{width:74px;flex:none}
.frow .fv{font-family:var(--mn);font-size:12.5px;color:var(--dim);white-space:nowrap;text-align:right;min-width:62px}
.msp{width:74px;height:22px;display:block}

/* ---------- editor ---------- */
.dayed{border:1px solid var(--line);border-left:3px solid var(--dc);border-radius:11px;padding:12px;margin-bottom:10px;background:rgba(5,7,15,.42)}
.dhead{display:flex;gap:6px;align-items:center;margin-bottom:9px}
.dhead .num{font-family:var(--mn);font-size:12px;color:var(--dc);letter-spacing:.14em;flex:0 0 auto}
.mini{width:28px;height:28px;flex:0 0 28px;border-radius:7px;border:1px solid var(--line2);background:rgba(12,18,34,.8);
  color:var(--dim);font-size:14.5px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mini:active{transform:scale(.92)}
.mini.dz{color:var(--bad);border-color:rgba(255,95,109,.35)}
.mini.on{color:var(--gd);border-color:rgba(255,202,79,.55);background:rgba(255,202,79,.12)}
.ein{width:100%;background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:7px;color:var(--tx);
  font-family:var(--sf);font-size:15px;padding:8px 9px;outline:none}
.ein:focus{border-color:var(--cy)}
.ein.sm{font-family:var(--mn);font-size:12.5px;color:var(--dim);padding:7px 9px}
.ein.saved{border-color:var(--ok)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
.exed{display:flex;gap:6px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(29,43,71,.45)}
.exed:last-child{border-bottom:none}
.exed .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.exed .side{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.selbox{background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font-family:var(--mn);font-size:12.5px;padding:8px;outline:none}

#lvup{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,10,.93);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#lvup.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lvbox{text-align:center;padding:26px;animation:pop .65s cubic-bezier(.15,1.2,.35,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.lvbox .t1{font-family:var(--mn);font-size:12.5px;letter-spacing:.5em;color:var(--cy);text-indent:.5em}
.lvbox .t2{font-family:var(--mn);font-size:54px;font-weight:800;color:#fff;margin:8px 0;
  text-shadow:0 0 22px rgba(79,214,255,.85),0 0 60px rgba(139,124,255,.5)}
.lvbox .t3{font-size:15.5px;color:var(--dim);letter-spacing:.1em}
.rings{position:absolute;width:300px;height:300px;pointer-events:none}
.rings i{position:absolute;inset:0;border:1px solid rgba(79,214,255,.4);border-radius:50%;animation:rip 2.1s ease-out infinite}
.rings i:nth-child(2){animation-delay:.6s}.rings i:nth-child(3){animation-delay:1.2s}
@keyframes rip{from{transform:scale(.35);opacity:.85}to{transform:scale(1.35);opacity:0}}

/* ---------- timer de descanso ---------- */
#restbar{position:relative;border:1px solid rgba(79,214,255,.45);border-radius:12px;
  background:linear-gradient(160deg,rgba(12,24,42,.97),rgba(8,12,24,.95));

<script>

  },
  days:[
    {n:"UPPER A · PECHO + ESPALDA",c:"#3b82f6",stat:"STR",cardio:CARDIO_DEF,ex:[

      {n:"Flat / Low-Incline DB Press",s:"4×8-12",note:"RIR 1-2 · grosor pecho medio-bajo · alt: Machine Press"},
      {n:"Seated Cable Row neutro",s:"3×10-12",note:"RIR 0-1 · grosor espalda media"},

/* orden exacto de la rutina vieja, para mapear los ids d1_1 → nombre */
const LEGACY_IDS=PRESET_C5.days.map((d,i)=>({id:"d"+(i+1),ex:d.ex.map(e=>e.n)}));

/* Alias de nombres al cambiar de rutina: nombre nuevo → nombres viejos equivalentes.
   SOLO se listan casos donde la carga es realmente comparable (misma máquina, mismo implemento).
   A propósito NO se aliasean cambios de implemento (barra → mancuerna, peso corporal → lastrado):
   el número no significa lo mismo y arrastrarlo crearía un record falso. */
const ALIAS={
  "Leg Press (pies medios)":["Leg Press"],
  "Seated Cable Row neutro":["Seated Cable Row agarre neutro"],
  "Weighted Pull-up / Pulldown pesado":["Pull-up lastrado / Pulldown pesado"],
  "Low-to-High Cable Fly / Pec Deck":["Low-to-High Cable Fly"],
  "Reverse Pec Deck / Face Pull":["Face Pull ⇄ Rear Delt","Face Pull"],
  "Lying / Seated Leg Curl":["Lying Leg Curl"],
  "Cable Lateral Raise":["Lateral Raise (Cable)","Lateral Raise"],
  "Wide-Grip Lat Pulldown":["Wide-Grip Lat Pulldown"],
  "Hanging Leg Raise ⇄ Cable Crunch":["Cable Crunch ⇄ Hanging Leg Raise"]
};
function priorRecord(map,name){
  if(map[name]!==undefined) return map[name];
  const alts=ALIAS[name]||[];
  for(let i=0;i<alts.length;i++) if(map[alts[i]]!==undefined) return map[alts[i]];
  return undefined;
}

const GENTEC={"Press Banca con Barra":{"p":["Acuéstate en el banco con los ojos debajo de la barra, los pies firmes en el piso y los glúteos pegados al banco.","Toma la barra un poco más ancho que los hombros, con la muñeca recta y la barra apoyada en la base de la palma.","Junta los omóplatos hacia atrás y abajo, saca la barra del rack y llévala arriba del pecho con los brazos extendidos.","Baja la barra a la parte baja del pecho en 2 segundos, con los codos a unos 45 grados del torso, hasta rozar la playera.","Empuja la barra de regreso arriba del pecho sin despegar los omóplatos ni los glúteos del banco."],"clave":"Mantén los omóplatos juntos y fijos contra el banco toda la serie; si se sueltan, el hombro carga el trabajo y pierdes empuje.","error":"Abrir los codos a 90 grados y rebotar la barra en el pecho: castiga la parte frontal del hombro y quita tensión al pectoral."},"Press Inclinado con Mancuernas":{"p":["Ajusta el banco a unos 30 grados y siéntate con los pies planos en el piso y la espalda apoyada en el respaldo.","Sube una mancuerna a cada muslo, impúlsalas con las rodillas y colócalas arriba del pecho con las palmas al frente.","Baja las mancuernas a los lados del pecho en 2 segundos hasta que los codos queden un poco por debajo de los hombros.","Detente 1 segundo en esa posición de estiramiento, sosteniendo el peso sin dejar que las mancuernas se te vengan encima.","Empuja hacia arriba y adentro hasta casi juntar las mancuernas, sin chocarlas ni bloquear los codos de golpe."],"clave":"Cargar la posición de abajo con pausa y control es lo que hace crecer el pecho aquí; bajar rápido desperdicia la serie.","error":"Bajar solo medio recorrido para usar más peso: reduce el estímulo y suele adelantar el hombro al empujar."},"Floor Press con Mancuernas":{"p":["Acuéstate boca arriba en el piso con las rodillas flexionadas y los pies apoyados.","Sostén una mancuerna en cada mano arriba del pecho, con las palmas al frente y los omóplatos juntos.","Baja las mancuernas en 2 segundos hasta que la parte de atrás de los brazos toque el piso, con los codos a 45 grados.","Haz una pausa de 1 segundo con los codos apoyados, sin rebotar contra el piso.","Empuja las mancuernas hacia arriba hasta extender los brazos, sin bloquear los codos de golpe."],"clave":"La pausa muerta en el piso quita el rebote: cada repetición debe arrancar desde cero, sin inercia.","error":"Rebotar los codos contra el piso para subir: golpea el codo y convierte la serie en impulso en vez de trabajo."},"Press de Pecho en Máquina":{"p":["Ajusta el asiento para que las agarraderas queden a la altura de la parte media del pecho.","Siéntate con la espalda pegada al respaldo, los pies planos en el piso y los omóplatos juntos hacia atrás.","Toma las agarraderas y empuja al frente hasta extender los brazos sin bloquear los codos.","Regresa en 2 o 3 segundos hasta que las manos queden a la altura del pecho, sin soltar la tensión.","Encadena la siguiente repetición sin dejar que las placas descansen entre una y otra."],"clave":"Bajar lento y frenar antes de que las placas se toquen mantiene la tensión durante toda la serie.","error":"Despegar la espalda del respaldo para empujar más peso: cambia el trabajo del pecho por impulso del torso."},"Flexiones (Push-up)":{"p":["Colócate boca abajo con las manos un poco más anchas que los hombros y los dedos apuntando al frente.","Extiende las piernas atrás, aprieta glúteos y abdomen y forma una línea recta de la cabeza a los talones.","Baja en 2 segundos hasta que el pecho quede a un puño del piso, con los codos a 45 grados del torso.","Empuja el piso y sube hasta extender los brazos, manteniendo la cadera en la misma línea.","Reparte el peso en toda la palma y en la base de los dedos, no solo en el talón de la mano."],"clave":"El cuerpo sube y baja en bloque: si la cadera llega antes que el pecho, la repetición no cuenta.","error":"Dejar caer la cadera y abrir los codos a 90 grados: carga la muñeca y la espalda baja sin dar más estímulo al pecho."},"Fondos en Paralelas (énfasis pecho)":{"p":["Súbete a las paralelas con los brazos extendidos, el cuerpo estable y los tobillos cruzados atrás.","Inclina el torso unos 30 grados al frente y deja los codos un poco abiertos para cargar el pecho.","Baja en 2 o 3 segundos hasta que los hombros queden a la altura de los codos, sin pasar de ahí.","Sostén 1 segundo esa posición de estiramiento abajo, con el torso inclinado y los hombros lejos de las orejas.","Empuja hacia arriba hasta extender los brazos, sin encoger los hombros al final."],"clave":"Frena a la altura donde el hombro queda al nivel del codo: más abajo no agrega pecho y sí carga la articulación del hombro.","error":"Bajar hasta el fondo sin control y rebotar: es la forma más común de terminar con el hombro adolorido en este ejercicio."},"Overhead Press con Barra":{"p":["Coloca la barra en el rack a la altura de la clavícula y tómala un poco más ancha que los hombros.","Sácala apoyándola sobre la parte alta del pecho, con las muñecas rectas y los codos ligeramente adelante.","Párate con los pies al ancho de la cadera, aprieta glúteos y abdomen y mantén las costillas abajo.","Empuja la barra hacia arriba en línea recta, moviendo la cabeza un poco atrás para dejarla pasar.","Termina con la barra sobre la mitad de la cabeza y los codos extendidos, luego baja controlado a la clavícula."],"clave":"Glúteos y abdomen apretados evitan que la espalda baja se arquee para compensar; ese arqueo es lo que te frena.","error":"Empujar la barra hacia adelante y arquear la zona lumbar para sacarla: castiga la espalda baja y el hombro empuja en mala posición."},"Press de Hombro con Mancuernas Sentado":{"p":["Siéntate en un banco con respaldo casi vertical y los pies planos en el piso.","Sube las mancuernas a la altura de las orejas, con las palmas al frente y los codos ligeramente adelante del torso.","Empuja hacia arriba y un poco hacia adentro hasta casi juntar las mancuernas, sin chocarlas.","Baja en 2 segundos hasta que los codos queden al nivel de los hombros.","Mantén la espalda pegada al respaldo y las costillas abajo durante toda la serie."],"clave":"Detener el descenso cuando el codo llega a la altura del hombro mantiene la tensión sin forzar la articulación.","error":"Arquear la espalda y despegarla del respaldo para sacar las últimas repeticiones: acaba siendo un press inclinado mal hecho."},"Press de Hombro en Máquina":{"p":["Ajusta el asiento para que las agarraderas queden a la altura de los hombros.","Siéntate con la espalda completa contra el respaldo y los pies planos en el piso.","Toma las agarraderas con las muñecas rectas y empuja hacia arriba hasta extender los brazos sin bloquear los codos.","Baja en 2 o 3 segundos hasta que las manos vuelvan a la altura de los hombros.","Encadena las repeticiones sin dejar descansar las placas entre una y otra."],"clave":"Ajustar la altura del asiento define el recorrido: si arrancas demasiado abajo, el hombro trabaja apretado toda la serie.","error":"Bajar más allá de la altura del hombro buscando más rango: solo agrega molestia en el hombro sin agregar músculo."},"Landmine Press a una mano":{"p":["Mete un extremo de la barra en el soporte de landmine o en una esquina y carga discos en el otro extremo.","Párate en escuadra, con el pie contrario al brazo que trabaja adelante, y sostén el extremo de la barra a la altura del hombro.","Empuja la barra hacia arriba y al frente hasta extender el brazo, siguiendo la línea diagonal de la barra.","Regresa en 2 segundos hasta que la mano vuelva al hombro, sin girar el torso.","Completa todas las repeticiones de ese lado y luego cambia de brazo."],"clave":"El torso se queda de frente y quieto: lo único que se mueve es el brazo que empuja.","error":"Girar la cadera y aventar el cuerpo para empujar: la carga se reparte y el hombro deja de recibir el estímulo."},"Pike Push-up":{"p":["Ponte en plancha alta y camina los pies hacia las manos hasta formar una V invertida con la cadera arriba.","Coloca las manos un poco más anchas que los hombros, con los dedos al frente y la cabeza entre los brazos.","Baja en 2 segundos flexionando los codos hasta que la coronilla quede cerca del piso, adelante de las manos.","Empuja el piso hasta extender los brazos, manteniendo la cadera alta.","Si la muñeca molesta, apoya las manos sobre dos mancuernas hexagonales para reducir la extensión."],"clave":"Mantener la cadera alta dirige la carga al hombro; en cuanto baja, se convierte en una lagartija normal.","error":"Dejar caer la cadera y bajar la cabeza de golpe: el hombro pierde el estímulo y el cuello queda expuesto."},"Jalón tras Nuca":{"p":["Ajusta la almohadilla de rodillas para que las piernas queden fijas y siéntate de frente a la máquina.","Toma la barra con agarre prono, más ancho que los hombros, y mantén el torso vertical.","Baja la barra por detrás de la cabeza llevando los codos hacia abajo, sin agachar la cabeza.","Detén la barra donde tu movilidad de hombro te permita mantener el cuello neutro, aunque sea poco recorrido.","Sube en 2 o 3 segundos controlando la barra hasta extender los brazos."],"clave":"Haz este ejercicio solo si puedes llevar los brazos arriba sin adelantar la cabeza: el rango lo marca tu hombro, no la máquina.","error":"Agachar el cuello para que pase la barra y bajarla hasta la espalda: fuerza el hombro en rotación extrema y carga el cuello."},"Dominadas (Pull-up)":{"p":["Toma la barra con agarre prono un poco más ancho que los hombros y cuélgate con los brazos extendidos.","Desde el cuelgue, baja los hombros alejándolos de las orejas y aprieta glúteos para no balancearte.","Jala los codos hacia abajo y atrás hasta que la barbilla pase la barra.","Baja en 2 o 3 segundos hasta extender los brazos y sostén 1 segundo esa posición de estiramiento.","Si no logras el rango completo, usa banda o máquina de asistencia en vez de acortar el recorrido."],"clave":"Cada repetición empieza desde el cuelgue con los brazos extendidos y termina con la barbilla arriba de la barra.","error":"Impulsarse con las piernas y cortar el recorrido abajo: entrenas la mitad del movimiento y el hombro recibe tirones."},"Jalón al Pecho en Polea":{"p":["Ajusta la almohadilla para que las rodillas queden bien sujetas y siéntate con los pies planos en el piso.","Toma la barra con agarre prono un poco más ancho que los hombros y estira los brazos por completo hacia arriba.","Inclina el torso unos 15 grados hacia atrás y mantenlo fijo en ese ángulo toda la serie.","Jala la barra hasta la parte alta del pecho, llevando los codos hacia abajo y atrás.","Sube en 2 o 3 segundos y deja que los hombros suban al final para cargar el estiramiento de arriba."],"clave":"El torso no se mece: si el ángulo cambia entre repeticiones, estás usando el peso del cuerpo en vez de la espalda.","error":"Jalar con los brazos y balancear el tronco hacia atrás: la espalda apenas trabaja y el recorrido se acorta."},"Jalón con Banda (anclaje alto)":{"p":["Ancla una banda en un punto alto y firme y arrodíllate o siéntate lo bastante lejos para que ya haya tensión.","Toma los extremos de la banda con los brazos extendidos arriba y el torso ligeramente inclinado atrás.","Jala llevando los codos hacia abajo y atrás hasta que las manos lleguen a la altura del pecho.","Sostén 1 segundo con los codos atrás, donde la banda está más tensa.","Regresa en 2 o 3 segundos hasta extender los brazos, sin dejar que la banda te jale de golpe."],"clave":"La banda pega más fuerte al final del jalón: la pausa con los codos atrás es donde está el trabajo real.","error":"Dejar que la banda regrese sola: pierdes la fase de frenado, que es la mitad del estímulo de la serie."},"Pullover con Mancuerna":{"p":["Acuéstate a lo largo de un banco plano con los pies apoyados en el piso.","Sostén una mancuerna con ambas manos por debajo del disco superior, con los brazos extendidos sobre el pecho.","Lleva la mancuerna atrás de la cabeza en 3 segundos, con los codos casi rectos, hasta sentir el estiramiento en el costado.","Detente donde el hombro se mueva cómodo, sin arquear la espalda baja para bajar más.","Regresa la mancuerna hasta arriba del pecho manteniendo los brazos igual de extendidos."],"clave":"El rango lo marca hasta dónde llega tu hombro estirado, no qué tanto puedas arquear la espalda.","error":"Arquear la espalda y doblar los codos para llevar la mancuerna más atrás: el hombro queda forzado sin ganar estímulo."},"Remo con Barra":{"p":["Párate con los pies al ancho de la cadera y toma la barra con agarre prono un poco más ancho que los hombros.","Manda la cadera atrás y baja el torso hasta unos 45 grados, con la espalda recta y las rodillas apenas flexionadas.","Deja la barra colgando con los brazos extendidos y aprieta el abdomen antes de la primera repetición.","Jala la barra hacia el ombligo llevando los codos atrás, sin subir el torso.","Baja en 2 segundos hasta extender los brazos, manteniendo el mismo ángulo del torso."],"clave":"El ángulo del torso y la espalda recta se mantienen idénticos de la primera a la última repetición.","error":"Redondear la espalda baja o levantar el torso en cada jalón: la columna toma la carga y la espalda alta deja de trabajar."},"Remo en T Agarre Ancho (T-Bar Row)":{"p":["Colócate sobre la plataforma con los pies firmes y los agarres anchos al alcance.","Manda la cadera atrás y baja el torso a unos 45 grados, con la espalda recta y el pecho abierto.","Toma los agarres anchos con los brazos extendidos y aprieta el abdomen.","Jala llevando los codos hacia afuera y atrás hasta que las manos lleguen a la parte baja del pecho.","Baja en 2 segundos hasta extender los brazos, sin dejar que el torso se levante."],"clave":"Con agarre ancho los codos van abiertos y el jalón termina en el pecho, no en el ombligo.","error":"Enderezar el torso y jalar con la espalda baja para mover más peso: la zona lumbar se lleva la carga y el trabajo se pierde."},"Remo con Mancuerna a una Mano":{"p":["Apoya la rodilla y la mano del mismo lado en un banco, con la espalda plana y paralela al piso.","Toma la mancuerna con el brazo libre extendido, dejando que el hombro baje hacia el piso.","Sostén 1 segundo esa posición larga de abajo antes de jalar, sin girar el torso.","Jala la mancuerna hacia la cadera llevando el codo atrás y pegado al cuerpo.","Baja en 2 o 3 segundos hasta el estiramiento completo y termina todas las repeticiones de ese lado antes de cambiar."],"clave":"Dejar que el hombro baje del todo abajo y jalar desde ahí es lo que da el recorrido completo.","error":"Girar el torso para subir la mancuerna: mueves más peso, pero el lado que trabaja recorre la mitad del camino."},"Remo Sentado en Polea":{"p":["Siéntate con los pies planos en los apoyos y las rodillas ligeramente flexionadas.","Toma el agarre con los brazos extendidos y el torso vertical, sin dejar que la espalda se redondee.","Deja que los omóplatos se separen al frente al inicio, cargando esa posición de estiramiento.","Jala el agarre hacia el abdomen llevando los codos atrás y juntando los omóplatos.","Regresa en 2 o 3 segundos hasta extender los brazos, manteniendo el torso quieto."],"clave":"Permitir que los omóplatos se separen al frente y se junten atrás da todo el rango; si el torso se mece, ese rango se pierde.","error":"Mecer el tronco atrás y adelante como remo de canoa: la cadera hace el trabajo y la espalda alta apenas participa."},"Remo Sentado con Banda":{"p":["Siéntate en el piso con las piernas extendidas y pasa la banda por las plantas de los pies.","Toma un extremo en cada mano con los brazos extendidos y el torso vertical.","Acorta la banda o aléjate lo suficiente para que ya haya tensión antes de empezar.","Jala los extremos hacia el abdomen llevando los codos pegados al cuerpo y juntando los omóplatos.","Regresa en 2 o 3 segundos hasta extender los brazos, sin dejar que la banda te gane."],"clave":"La banda solo aprieta al final del recorrido: sostén 1 segundo con los codos atrás en cada repetición.","error":"Inclinar el torso atrás para vencer la banda: el tronco hace el trabajo y la espalda recibe muy poco."},"Remo con Apoyo en Pecho Agarre Ancho":{"p":["Ajusta la altura del asiento para que el pecho quede apoyado y los agarres a la altura del pecho.","Siéntate con el pecho contra la almohadilla y los pies planos en la plataforma.","Toma los agarres anchos con agarre prono y los brazos extendidos.","Jala llevando los codos hacia afuera y atrás hasta que las manos lleguen cerca del pecho.","Regresa en 2 o 3 segundos hasta extender los brazos, sin despegar el pecho de la almohadilla."],"clave":"El pecho pegado a la almohadilla obliga a que jale la espalda y no el impulso del cuerpo.","error":"Despegar el pecho del respaldo para jalar más peso: se vuelve un remo libre mal hecho y pierde el punto del ejercicio."},"Remo Invertido":{"p":["Coloca una barra en un rack a la altura de la cadera o usa anillas ajustadas a esa altura.","Métete debajo y toma la barra con agarre prono un poco más ancho que los hombros.","Extiende las piernas, aprieta glúteos y abdomen y forma una línea recta de la cabeza a los talones.","Jala el pecho hacia la barra llevando los codos atrás, hasta tocarla o quedar a un puño de ella.","Baja en 2 o 3 segundos hasta extender los brazos, sin que la cadera se hunda."],"clave":"Entre más horizontal quede tu cuerpo, más pesa: ajusta la altura de la barra en vez de cortar el recorrido.","error":"Dejar que la cadera se hunda y llegar con la barbilla antes que el pecho: el jalón se acorta y el cuerpo pierde la línea."},"Face Pull en Polea":{"p":["Coloca una cuerda en la polea a la altura de la cara y toma cada punta con las palmas enfrentadas.","Da dos pasos atrás hasta que haya tensión y párate con un pie ligeramente adelante.","Jala la cuerda hacia la frente separando las manos y llevando los codos altos y atrás.","Termina con las manos a los lados de la cabeza y los antebrazos apuntando hacia arriba.","Regresa en 2 o 3 segundos dejando que los brazos se estiren al frente, sin encoger los hombros."],"clave":"Los codos suben a la altura de los hombros y las manos se separan al final; ahí trabaja la parte de atrás del hombro.","error":"Jalar la cuerda al pecho con los codos abajo y peso de más: se convierte en un remo y el deltoides posterior casi no participa."},"Back Squat (Sentadilla Trasera)":{"p":["Coloca la barra sobre la parte alta de la espalda, apoyada en el músculo y no sobre el hueso del cuello.","Sácala del rack, da dos pasos atrás y separa los pies al ancho de los hombros, con las puntas algo abiertas.","Toma aire, aprieta el abdomen y baja mandando cadera y rodillas al mismo tiempo.","Baja hasta que el pliegue de la cadera pase la rodilla, o hasta donde llegues sin que la espalda baja se redondee.","Empuja el piso con todo el pie y sube manteniendo el pecho y la cadera al mismo ritmo."],"clave":"La espalda conserva su curva natural y las rodillas siguen la línea de los pies durante toda la bajada.","error":"Buscar rango profundo hasta que la pelvis se mete y la columna lumbar se redondea: ahí es donde la espalda y la rodilla se llevan la peor parte."},"Front Squat (Sentadilla Frontal)":{"p":["Coloca la barra sobre la parte alta del pecho y los hombros, con los codos apuntando bien al frente.","Sujétala con dos o tres dedos y las muñecas relajadas, o cruza los brazos si la muñeca te molesta.","Saca la barra, da dos pasos atrás y separa los pies al ancho de los hombros con las puntas algo abiertas.","Baja con el torso lo más vertical posible hasta que los muslos pasen la paralela, sin bajar los codos.","Empuja el piso y sube manteniendo los codos altos hasta quedar de pie por completo."],"clave":"Los codos altos sostienen la barra: en cuanto bajan, el torso se va al frente y la barra se te cae adelante.","error":"Perder los codos y redondear la espalda al llegar abajo: la columna y las rodillas absorben la carga en el rango profundo."},"Hack Squat en Máquina":{"p":["Colócate en la máquina con la espalda y los hombros bien apoyados en las almohadillas.","Pon los pies al ancho de los hombros a media plataforma, con las puntas ligeramente abiertas.","Quita los seguros y baja en 3 segundos hasta que los muslos pasen la paralela.","Sostén 1 segundo abajo, en la posición de mayor estiramiento, sin dejar que la cadera se despegue del respaldo.","Empuja con todo el pie hasta casi extender las piernas, sin bloquear las rodillas de golpe."],"clave":"Bajar controlado y sostener abajo con la cadera pegada al respaldo es lo que hace productivo este ejercicio.","error":"Buscar rango profundo despegando la cadera del respaldo o rebotando: la rodilla recibe todo el golpe en su peor posición."},"Leg Press 45°":{"p":["Siéntate con la espalda y la cadera completamente apoyadas en el respaldo.","Coloca los pies al ancho de los hombros a media plataforma, con las puntas ligeramente abiertas.","Quita los seguros y baja la plataforma en 3 segundos, acercando las rodillas al pecho.","Detente justo antes de que la cadera se despegue del respaldo y sostén 1 segundo esa posición de estiramiento.","Empuja con todo el pie hasta casi extender las piernas, sin bloquear las rodillas."],"clave":"El punto donde la cadera empieza a despegarse del respaldo marca tu tope: ahí termina el rango útil.","error":"Forzar el rango profundo hasta que la cadera se levanta y la espalda baja se redondea: la rodilla queda muy comprimida y la columna sin apoyo."},"Sentadilla Goblet con Mancuerna":{"p":["Sostén una mancuerna en vertical contra el pecho, tomándola por el disco superior con ambas manos.","Separa los pies al ancho de los hombros, con las puntas ligeramente abiertas.","Baja en 2 o 3 segundos entre las rodillas, con el pecho arriba y los codos por dentro de las piernas.","Llega hasta que los muslos pasen la paralela, sin que los talones se despeguen del piso.","Empuja el piso y sube hasta quedar de pie, apretando los glúteos arriba."],"clave":"La mancuerna al pecho funciona como contrapeso: si la separas del cuerpo, el torso se va al frente y pierdes la posición.","error":"Forzar el rango profundo levantando los talones o metiendo las rodillas hacia adentro: mucha carga en la rodilla y poco control."},"Sentadilla Búlgara":{"p":["Coloca el empeine del pie trasero sobre un banco y da un paso largo con el pie delantero.","Sostén una mancuerna en cada mano y mantén el torso ligeramente inclinado al frente.","Baja en 2 o 3 segundos hasta que el muslo delantero quede paralelo al piso y la pierna de atrás se estire.","Sostén 1 segundo abajo con el peso repartido en todo el pie delantero, sin apoyar la rodilla trasera.","Empuja con el talón delantero para subir y completa todas las repeticiones de ese lado antes de cambiar de pierna."],"clave":"El pie de adelante debe quedar lo bastante lejos del banco para que la rodilla no rebase mucho la punta del pie.","error":"Poner el pie delantero muy cerca del banco: la rodilla se va demasiado al frente y carga todo el rango profundo."},"Zancada Inversa":{"p":["Párate derecho con los pies juntos, con una mancuerna en cada mano o solo con el peso del cuerpo.","Da un paso largo hacia atrás y apoya la punta de ese pie en el piso.","Baja en 2 segundos hasta que la rodilla trasera quede a un puño del piso, con el torso vertical.","Empuja con el talón del pie delantero para regresar a la posición inicial.","Haz todas las repeticiones con la misma pierna adelante y luego cambia de lado."],"clave":"Al dar el paso atrás el peso se queda en la pierna de adelante: esa es la que sube el cuerpo.","error":"Impulsarse con la pierna de atrás y azotar la rodilla contra el piso: reparte el trabajo y golpea la rodilla."},"Extensión de Cuádriceps (rango medio)":{"p":["Ajusta el respaldo para que la rodilla quede alineada con el eje de giro de la máquina.","Siéntate con la espalda apoyada y coloca el rodillo justo arriba del empeine.","Sujeta las agarraderas y extiende las piernas hasta casi bloquear las rodillas.","Sostén 1 segundo arriba con los muslos apretados.","Baja en 3 segundos hasta unos 90 grados de flexión, sin dejar que las placas se toquen."],"clave":"La serie vive entre los 90 grados y la extensión; no hace falta arrancar desde más atrás para que funcione.","error":"Aventar el peso y dejarlo caer al final: la rodilla recibe el jalón sin que el músculo esté controlando el movimiento."},"Peso Muerto Convencional":{"p":["Párate con la barra sobre la mitad del pie y los pies al ancho de la cadera.","Manda la cadera atrás, flexiona las rodillas y toma la barra justo por fuera de las piernas.","Baja el pecho, sube la cadera hasta tensar la barra y aprieta el abdomen antes de jalar.","Empuja el piso con las piernas y sube la barra pegada a las espinillas hasta quedar de pie.","Baja mandando primero la cadera atrás y luego flexionando rodillas, con la barra cerca del cuerpo."],"clave":"La espalda mantiene la misma posición del inicio al final; si se redondea al despegar la barra, baja el peso.","error":"Jalar con la columna lumbar redondeada y la barra separada del cuerpo: la espalda baja recibe una carga que no le toca."},"Romanian Deadlift (Barra)":{"p":["Toma la barra con agarre prono al ancho de los hombros y párate derecho con las rodillas apenas flexionadas.","Manda la cadera hacia atrás y baja la barra pegada a los muslos, sin flexionar más las rodillas.","Baja en 3 segundos hasta sentir el estiramiento atrás del muslo, normalmente a media espinilla.","Detente en cuanto la espalda baja quiera redondearse: ese es tu tope de recorrido.","Empuja la cadera al frente para volver arriba, apretando los glúteos sin arquear la espalda."],"clave":"El recorrido lo marca hasta dónde llegas con la espalda recta, no hasta dónde llega la barra.","error":"Seguir bajando con la columna lumbar redondeada para tocar el piso: la espalda baja carga lo que deberían cargar las piernas."},"Romanian Deadlift con Mancuernas":{"p":["Sostén una mancuerna en cada mano frente a los muslos, de pie con los pies al ancho de la cadera.","Flexiona apenas las rodillas y manda la cadera hacia atrás, manteniendo la espalda recta.","Baja las mancuernas pegadas a las piernas en 3 segundos, hasta sentir el estiramiento atrás del muslo.","Detén la bajada en cuanto la espalda baja pierda su posición, aunque las mancuernas queden altas.","Empuja la cadera al frente para subir y termina de pie apretando los glúteos."],"clave":"El movimiento es de cadera hacia atrás, no de espalda hacia abajo, y las mancuernas nunca se separan de las piernas.","error":"Doblar más las rodillas y convertirlo en sentadilla: se pierde el estiramiento del femoral y la espalda baja compensa."},"Curl Femoral Tumbado":{"p":["Acuéstate boca abajo con las caderas planas contra la almohadilla y las piernas extendidas.","Ajusta el rodillo para que quede justo arriba de los talones, no sobre el tendón.","Sujeta las agarraderas y flexiona las rodillas llevando los talones hacia los glúteos.","Sostén 1 segundo arriba sin despegar la cadera de la almohadilla.","Baja en 3 segundos hasta casi extender las piernas, sin dejar que las placas se toquen."],"clave":"La cadera pegada a la almohadilla toda la serie es lo que obliga a trabajar a la parte de atrás del muslo.","error":"Levantar la cadera y aventar el peso para cerrar más: acorta el trabajo real y arquea la espalda baja."},"Curl Femoral Sentado":{"p":["Siéntate con la espalda apoyada y ajusta la almohadilla para que quede firme sobre la parte baja de los muslos.","Coloca el rodillo justo arriba de los talones, con las piernas extendidas al frente.","Flexiona las rodillas llevando los talones hacia abajo y atrás lo más que puedas.","Sostén 1 segundo en la contracción y regresa en 3 segundos hasta que las piernas queden casi rectas.","Detente antes de que las placas se toquen para mantener cargada la posición de estiramiento."],"clave":"Con la cadera flexionada el estiramiento es mayor: la última parte del regreso, con la pierna casi recta, es la más valiosa.","error":"Soltar el peso de golpe al final: pierdes justo la parte estirada, que es la que más aporta en esta versión."},"Nordic Ham Curl":{"p":["Arrodíllate sobre una superficie acolchada y fija los tobillos bajo una barra, un banco o con ayuda de alguien.","Mantén el cuerpo recto de las rodillas a la cabeza, con glúteos y abdomen apretados.","Baja el torso hacia el piso lo más lento que puedas, resistiendo con la parte de atrás de los muslos.","Aguanta la posición estirada hasta donde logres frenar y recibe el peso con las manos en el piso.","Empuja con las manos lo mínimo necesario para regresar arriba y repite."],"clave":"El valor está en cuántos segundos logras frenar la bajada; si te caes de golpe, esa repetición no cuenta.","error":"Romper la cadera hacia adelante para bajar más fácil: el muslo deja de resistir y la rodilla aguanta el peso sola."},"Hip Thrust con Barra":{"p":["Siéntate en el piso con la parte baja de los omóplatos apoyada en el borde de un banco.","Rueda la barra sobre la cadera con una almohadilla y coloca los pies al ancho de la cadera.","Acomoda los pies de modo que al subir las espinillas queden verticales.","Mete un poco la pelvis, empuja con los talones y sube hasta que el torso quede paralelo al piso.","Sostén 1 segundo arriba apretando los glúteos y baja en 2 segundos sin soltar la barra."],"clave":"Arriba el torso queda paralelo al piso y las costillas abajo: la altura viene del glúteo, no de arquear la espalda.","error":"Subir arqueando la espalda baja en vez de extender la cadera: el glúteo recibe menos y la zona lumbar se sobrecarga."},"Puente de Glúteo con Banda":{"p":["Acuéstate boca arriba con las rodillas flexionadas y los pies planos al ancho de la cadera.","Coloca una banda alrededor de los muslos, justo arriba de las rodillas.","Empuja con los talones y sube la cadera hasta alinear rodillas, cadera y hombros.","Abre un poco las rodillas contra la banda mientras estás arriba y sostén 2 segundos.","Baja en 2 segundos hasta casi tocar el piso y encadena la siguiente repetición."],"clave":"La cadera sube por extensión del glúteo con las costillas abajo; no hace falta llegar más alto arqueando.","error":"Empujar con la punta de los pies y arquear la espalda para subir más: se siente en la espalda baja y menos en el glúteo."},"Hiperextensión 45°":{"p":["Ajusta la almohadilla para que el borde quede justo debajo del hueso de la cadera.","Súbete al aparato con los pies firmes, el cuerpo alineado y los brazos cruzados al pecho.","Baja doblando desde la cadera en 2 o 3 segundos, con la espalda recta, hasta formar unos 90 grados.","Sube empujando la cadera contra la almohadilla hasta que el cuerpo quede en línea recta.","Detente en esa línea recta, sin pasarte hacia atrás."],"clave":"El movimiento sale de la cadera, no de la espalda: el torso conserva su forma y solo cambia el ángulo de la cadera.","error":"Subir de más y terminar arqueado hacia atrás: comprime la zona lumbar sin ningún beneficio extra."},"Curl Inclinado con Mancuernas":{"p":["Ajusta un banco a unos 45 grados y siéntate con la espalda apoyada en el respaldo.","Deja los brazos colgando a los lados, con una mancuerna en cada mano y las palmas al frente.","Con los codos quietos y detrás de la línea del torso, sube las mancuernas hacia los hombros.","Sostén 1 segundo arriba y baja en 3 segundos hasta extender por completo los brazos.","Aguanta 1 segundo esa posición de estiramiento, con el hombro atrás, antes de la siguiente repetición."],"clave":"Los codos se quedan atrás del torso toda la serie; esa es la razón de hacerlo en banco inclinado.","error":"Adelantar los codos o no extender los brazos abajo: pierdes justo la parte estirada que distingue a este curl."},"Curl Martillo":{"p":["Párate derecho con una mancuerna en cada mano y las palmas mirando hacia el cuerpo.","Pega los codos a los costados y mantén los hombros atrás.","Sube las mancuernas hacia los hombros sin girar las muñecas, con las palmas siempre enfrentadas.","Sostén 1 segundo arriba y baja en 3 segundos hasta extender los brazos.","Si alternas brazos, completa el mismo número de repeticiones con cada uno."],"clave":"Las palmas se mantienen enfrentadas de principio a fin; si giran, ya estás haciendo otro curl.","error":"Balancear el torso y mover los codos al frente: el peso sube por impulso y el brazo trabaja mucho menos."},"Curl de Bíceps con Banda":{"p":["Párate sobre el centro de la banda con los pies al ancho de la cadera.","Toma un extremo en cada mano con las palmas al frente y los brazos extendidos.","Pega los codos a los costados y sube las manos hacia los hombros.","Sostén 1 segundo arriba, donde la banda está más tensa.","Baja en 3 segundos frenando la banda y separa más los pies si quieres más resistencia."],"clave":"La banda aprieta más arriba, así que la pausa en la contracción es lo que hace útil la serie.","error":"Dejar que la banda regrese sola y mover los codos: se pierde la bajada, que es la mitad del trabajo."},"Press Francés con Barra Z":{"p":["Acuéstate en un banco plano con los pies apoyados y toma la barra Z por las curvas internas.","Extiende los brazos y llévalos un poco hacia atrás, de modo que la barra quede sobre la frente y no sobre el pecho.","Baja la barra en 2 o 3 segundos hacia la frente o un poco atrás de la cabeza, doblando solo los codos.","Sostén 1 segundo en la posición estirada, con los codos apuntando al frente y sin abrirlos.","Extiende los codos hasta arriba sin bloquearlos de golpe y sin mover los brazos hacia adelante."],"clave":"Los brazos se quedan inclinados hacia atrás y quietos: lo único que se abre y cierra son los codos.","error":"Abrir los codos hacia los lados y bajar rápido: es la forma más común de terminar con el codo molesto en este ejercicio."},"Extensión de Tríceps sobre la Cabeza con Mancuerna":{"p":["Siéntate en un banco con respaldo o párate derecho con los pies al ancho de la cadera.","Sostén una mancuerna con ambas manos por el disco superior y súbela arriba de la cabeza con los brazos extendidos.","Baja la mancuerna atrás de la cabeza en 3 segundos, doblando solo los codos y manteniéndolos apuntando arriba.","Detente donde sientas el estiramiento completo atrás del brazo, sin que los codos se abran ni el hombro moleste.","Extiende los codos hasta arriba manteniendo las costillas abajo, sin arquear la espalda."],"clave":"Los codos apuntan al techo y no se abren: esa posición es la que carga el estiramiento del tríceps.","error":"Abrir los codos y arquear la espalda para mover más peso: el hombro queda en mala posición y el brazo trabaja menos."},"Extensión de Tríceps en Polea (Pushdown)":{"p":["Coloca una barra o cuerda en la polea alta y párate a un paso, con un pie ligeramente adelante.","Toma el agarre y pega los codos a los costados, con los antebrazos a unos 90 grados.","Empuja hacia abajo hasta extender los codos por completo, abriendo la cuerda al final si la usas.","Sostén 1 segundo abajo con los brazos rectos.","Regresa en 3 segundos hasta que las manos vuelvan a la altura del pecho, sin despegar los codos."],"clave":"Los codos quedan pegados al torso todo el tiempo; si viajan hacia atrás, el pecho y la espalda empiezan a ayudar.","error":"Inclinar el cuerpo sobre la barra para empujar con el peso corporal: mueves más placas y el tríceps recibe menos."},"Extensión de Tríceps con Banda":{"p":["Ancla la banda en un punto alto y firme y párate a un paso de distancia.","Toma los extremos con las palmas hacia abajo y pega los codos a los costados.","Extiende los codos hacia abajo hasta que los brazos queden rectos.","Sostén 1 segundo abajo, donde la banda está más tensa.","Regresa en 3 segundos hasta que las manos lleguen a la altura del pecho, sin mover los codos."],"clave":"Aléjate del anclaje hasta que la banda ya tenga tensión con los brazos doblados; si empieza floja, media serie no cuenta.","error":"Dejar que la banda jale los brazos de regreso sin frenarla: se pierde la bajada, que es la mitad del estímulo."},"Elevación Lateral con Mancuernas":{"p":["Párate con los pies al ancho de la cadera y una mancuerna en cada mano a los costados.","Inclina el torso un poco al frente y deja los codos apenas flexionados y fijos.","Sube las mancuernas hacia los lados hasta que los brazos queden a la altura de los hombros.","Mantén el meñique un poco más alto que el pulgar y no encojas los hombros hacia las orejas.","Baja en 3 segundos hasta que las mancuernas vuelvan a los costados, sin dejarlas caer."],"clave":"Parar a la altura del hombro y bajar lento es lo que hace trabajar al deltoides lateral; más arriba entra el trapecio.","error":"Aventar las mancuernas con impulso de cadera y encoger los hombros: el trabajo se va al cuello y el hombro solo recibe el tirón."},"Elevación Lateral en Polea":{"p":["Coloca la polea en el punto más bajo y párate de lado, con el brazo que trabaja del lado contrario a la máquina.","Pasa el cable por delante del cuerpo y toma el agarre con el brazo cruzado al frente.","Sube el brazo hacia el lado hasta la altura del hombro, con el codo apenas flexionado.","Baja en 3 segundos hasta que la mano cruce otra vez frente al cuerpo, cargando esa posición de estiramiento.","Completa todas las repeticiones de ese brazo y luego cambia de lado."],"clave":"Cruzar el cable por delante mantiene tensión abajo, que es justo lo que no da la mancuerna.","error":"Quedarte muy cerca de la polea o soltar el brazo al final: la parte baja del recorrido queda sin carga y se pierde la ventaja del cable."},"Elevación Lateral con Banda":{"p":["Párate sobre el centro de la banda con los pies juntos y toma un extremo en cada mano.","Deja los brazos a los costados con los codos apenas flexionados.","Sube los brazos hacia los lados hasta la altura de los hombros, contra la resistencia de la banda.","Sostén 1 segundo arriba sin encoger los hombros hacia las orejas.","Baja en 3 segundos frenando la banda hasta volver a los costados."],"clave":"La banda pesa más arriba: la pausa a la altura del hombro es donde está el trabajo real.","error":"Dejar que la banda te regrese los brazos de golpe: se pierde la bajada, que es donde más se gana."},"Pájaros con Mancuernas (Rear Delt Fly)":{"p":["Párate con los pies al ancho de la cadera y una mancuerna en cada mano.","Manda la cadera atrás y baja el torso hasta quedar casi paralelo al piso, con la espalda recta.","Deja los brazos colgando bajo el pecho, con los codos apenas flexionados.","Abre los brazos hacia los lados hasta la altura de los hombros, llevando las manos atrás.","Baja en 3 segundos hasta que las mancuernas vuelvan a quedar bajo el pecho."],"clave":"El torso se queda inclinado y quieto: si te enderezas al abrir, el peso deja de caer sobre la parte trasera del hombro.","error":"Doblar los codos y jalar hacia atrás como si fuera remo: se vuelve trabajo de espalda alta y el deltoides posterior se queda fuera."},"Pec Deck Inverso":{"p":["Ajusta el asiento para que las agarraderas queden a la altura de los hombros.","Siéntate con el pecho contra la almohadilla y los pies planos en el piso.","Toma las agarraderas con los codos apenas flexionados y los brazos al frente.","Abre los brazos hacia atrás y afuera hasta que queden alineados con el torso.","Sostén 1 segundo y regresa en 3 segundos hasta que las manos casi se junten al frente."],"clave":"Los brazos se abren casi rectos: si doblas mucho los codos, el movimiento se convierte en un remo.","error":"Poner peso de más y buscar juntar los omóplatos con fuerza: el trabajo se va a la espalda media y el hombro trasero apenas participa."},"Aperturas con Mancuernas":{"p":["Acuéstate en un banco plano con los pies apoyados y una mancuerna en cada mano arriba del pecho.","Junta los omóplatos contra el banco y deja los codos flexionados unos 15 grados, fijos así toda la serie.","Abre los brazos hacia los lados en 3 segundos, hasta que las manos queden a la altura del pecho.","Detente en cuanto sientas el estiramiento del pecho, sin que los codos bajen del nivel del hombro.","Cierra los brazos siguiendo el mismo arco hasta que las mancuernas casi se toquen arriba."],"clave":"El codo se queda fijo y el recorrido termina donde el hombro sigue cómodo, no donde llega la mancuerna.","error":"Bajar los brazos más allá de la línea del hombro con mucho peso: es la manera más rápida de acabar con el hombro adolorido."},"Cruce de Poleas de Arriba Abajo (pectoral inferior)":{"p":["Coloca las dos poleas en la posición alta y toma un agarre en cada mano.","Da un paso al frente con un pie y deja el torso ligeramente inclinado adelante.","Empieza con los brazos abiertos arriba y los codos apenas flexionados y fijos.","Lleva las manos hacia abajo y adentro hasta cruzarlas a la altura del abdomen.","Regresa en 3 segundos siguiendo el mismo arco, sin dejar que los hombros se vayan al frente."],"clave":"El recorrido va en diagonal de arriba abajo y termina cruzado abajo; ahí es donde trabaja la parte baja del pecho.","error":"Doblar y estirar los codos como si fuera un pushdown: deja de ser apertura y el hombro carga el cambio de dirección."},"Contractor de Pecho (Pec Deck)":{"p":["Ajusta el asiento para que las agarraderas queden a la altura de la mitad del pecho.","Siéntate con la espalda pegada al respaldo y los pies planos en el piso.","Coloca los antebrazos o las manos en las almohadillas, con los codos a la altura de los hombros.","Junta los brazos al frente hasta que las almohadillas casi se toquen y sostén 1 segundo.","Abre en 3 segundos hasta sentir tensión en el pecho, sin dejar que las placas se toquen."],"clave":"Los codos se quedan a la altura del pecho todo el recorrido; si suben, el hombro toma el trabajo.","error":"Abrir de más con peso alto buscando estiramiento extra: el hombro se lleva la carga y el pecho pierde tensión."},"Encogimientos de Hombros con Mancuernas":{"p":["Párate derecho con una mancuerna en cada mano a los costados y los brazos extendidos.","Mantén la cabeza en línea con el torso y la mirada al frente.","Sube los hombros en línea recta hacia las orejas, sin doblar los codos.","Sostén 1 o 2 segundos en el punto más alto que alcances.","Baja en 3 segundos hasta que los hombros queden abajo del todo."],"clave":"El movimiento es recto hacia arriba y abajo; una pausa corta arriba vale más que subir con impulso.","error":"Rodar los hombros o estirar el cuello hacia adelante para llegar más alto: carga el cuello sin sumar recorrido."},"Plancha (Plank)":{"p":["Apoya los antebrazos en el piso con los codos justo debajo de los hombros.","Extiende las piernas atrás y apóyate en la punta de los pies.","Aprieta glúteos y abdomen y mete un poco la pelvis para que la espalda baja quede plana.","Forma una línea recta de la cabeza a los talones, con la mirada al piso.","Sostén el tiempo indicado y termina la serie en cuanto la cadera empiece a caer."],"clave":"La cadera ni sube ni baja: cuando se hunde, la serie ya terminó aunque queden segundos en el reloj.","error":"Aguantar más tiempo con la cadera hundida: deja de ser trabajo de abdomen y la espalda baja se lleva la tensión."},"Dead Bug":{"p":["Acuéstate boca arriba con los brazos apuntando al techo y las piernas en 90 grados de cadera y rodilla.","Presiona la espalda baja contra el piso y mantén ese contacto durante todo el ejercicio.","Baja al mismo tiempo un brazo por atrás de la cabeza y la pierna contraria hasta cerca del piso.","Regresa a la posición inicial sin perder el contacto de la espalda con el piso.","Alterna lados y cuenta una repetición cada vez que completes los dos."],"clave":"La espalda baja pegada al piso es la única señal que importa: si se despega, acorta el recorrido.","error":"Bajar el brazo y la pierna tan lejos que la espalda se arquea: el abdomen deja de sostener y el ejercicio pierde sentido."},"Crunch en Polea Arrodillado":{"p":["Coloca una cuerda en la polea alta y arrodíllate de espaldas a la máquina, a un paso de distancia.","Sujeta las puntas de la cuerda a los lados de la cabeza y flexiona un poco la cadera hacia adelante.","Deja la cadera fija y baja el pecho hacia los muslos, cerrando solo la parte alta del tronco.","Sostén 1 segundo en el punto más cerrado, con el abdomen apretado.","Sube en 3 segundos hasta la posición inicial, sin dejar que el peso te jale."],"clave":"La cadera no se mueve: el recorrido sale de acercar las costillas a la pelvis, no de sentarse hacia atrás.","error":"Redondear con fuerza la espalda baja y usar mucho peso: es carga en flexión sobre la zona lumbar sin más beneficio para el abdomen."},"Elevación de Piernas Colgado":{"p":["Cuélgate de una barra con agarre prono al ancho de los hombros y los brazos extendidos.","Baja los hombros alejándolos de las orejas y deja de balancearte antes de empezar.","Sube las piernas al frente metiendo un poco la pelvis, hasta que queden al menos paralelas al piso.","Sostén 1 segundo arriba, sin usar impulso.","Baja en 3 segundos hasta quedar colgado y estable antes de la siguiente repetición."],"clave":"Meter la pelvis al subir es lo que mete al abdomen; sin eso solo trabaja el flexor de la cadera.","error":"Balancearse para aventar las piernas: la zona lumbar recibe tirones en flexión y el abdomen apenas participa."},"Elevación de Talones de Pie en Smith":{"p":["Coloca un escalón o disco bajo la barra del Smith y párate con la punta de los pies encima y los talones al aire.","Apoya la barra sobre la parte alta de la espalda y quita los seguros con el cuerpo derecho.","Baja los talones en 3 segundos lo más que puedas, hasta sentir el estiramiento de la pantorrilla.","Sostén 1 segundo abajo, en esa posición estirada, sin rebotar.","Sube hasta la punta de los pies y aguanta 1 segundo arriba con las rodillas rectas."],"clave":"La pausa abajo, con el talón por debajo del escalón, es lo que separa este ejercicio de un rebote.","error":"Rebotar abajo con la barra cargada sobre la espalda: pierdes el estímulo y sumas compresión a la columna sin razón."},"Elevación de Talones de Pie en Máquina":{"p":["Ajusta las almohadillas a tu altura y coloca los hombros debajo de ellas.","Pon la punta de los pies en la plataforma, con los talones fuera del borde.","Baja los talones en 3 segundos hasta sentir el estiramiento completo de la pantorrilla.","Sostén 1 segundo abajo, en esa posición larga, sin rebotar.","Sube hasta la punta de los pies con las rodillas rectas y aguanta 1 segundo arriba."],"clave":"Rango completo: talón bien abajo y punta bien arriba, con una pausa en cada extremo.","error":"Hacer repeticiones cortas y rápidas con mucho peso: la pantorrilla casi no cambia de longitud y el estímulo se pierde."},"Elevación de Talones Sentado (sóleo)":{"p":["Siéntate y ajusta la almohadilla para que quede firme sobre la parte baja de los muslos.","Coloca la punta de los pies en la plataforma, con los talones colgando fuera del borde.","Baja los talones en 3 segundos hasta el estiramiento completo y sostén 1 segundo ahí.","Empuja con la punta de los pies y sube los talones lo más alto que puedas.","Aguanta 1 segundo arriba antes de volver a bajar controlado."],"clave":"Con la rodilla doblada el trabajo cae en el sóleo: las pausas arriba y abajo importan más que el peso.","error":"Rebotar el peso con medio recorrido: la pantorrilla se mueve poco y el tobillo aguanta el golpe."},"Elevación de Talones a una Pierna (peso corporal)":{"p":["Párate con la punta de un pie en el borde de un escalón y el talón al aire.","Apoya una mano en la pared o en un soporte solo para equilibrarte.","Cruza el otro pie por detrás y deja todo el peso en la pierna que trabaja.","Baja el talón en 3 segundos hasta el estiramiento completo y sostén 1 segundo abajo.","Sube hasta la punta del pie, aguanta 1 segundo arriba y completa todas las repeticiones antes de cambiar de pierna."],"clave":"Todo el peso se queda en la pierna que trabaja: la mano es solo equilibrio, no apoyo.","error":"Ayudarse empujando con el brazo o con el otro pie: la carga baja y ya no llegas al fallo real de esa pierna."},"Abducción de Cadera en Máquina":{"p":["Siéntate con la espalda apoyada y las almohadillas por fuera de los muslos.","Ajusta el tope inicial para que las piernas empiecen juntas, sin que te apriete.","Abre las piernas hacia afuera hasta el final del recorrido de la máquina.","Sostén 1 segundo en la apertura máxima.","Cierra en 3 segundos hasta casi juntar las piernas, sin dejar que las placas se toquen."],"clave":"El torso se queda quieto contra el respaldo: si te echas atrás en cada repetición, el ejercicio cambia por completo.","error":"Aventar las piernas y dejarlas cerrar de golpe: se pierde la mitad del trabajo, que está en frenar el cierre."},"Abducción de Cadera en Polea":{"p":["Coloca la polea en el punto más bajo y pon la tobillera en la pierna de afuera.","Párate de lado a la máquina, apoyando una mano para equilibrarte.","Deja que la pierna cruce un poco por delante de la otra, en posición de estiramiento, antes de empezar.","Abre la pierna hacia afuera lo más que puedas sin inclinar el torso y sostén 1 segundo.","Regresa en 3 segundos hasta cruzar otra vez y completa todas las repeticiones antes de cambiar de lado."],"clave":"El torso se queda vertical: si te inclinas hacia la máquina, ganas rango falso y el glúteo trabaja menos.","error":"Aventar la pierna con impulso del tronco: se mueve más peso, pero la cadera casi no recorre camino real."},"Paseo Lateral con Banda":{"p":["Coloca una banda alrededor de los tobillos o justo arriba de las rodillas.","Separa un poco los pies hasta tensar la banda y flexiona ligeramente rodillas y cadera.","Da un paso lateral amplio con un pie, manteniendo la punta apuntando al frente.","Acerca el otro pie solo hasta el ancho de la cadera, sin dejar que los pies se junten.","Haz todos los pasos hacia un lado y luego regresa la misma distancia hacia el otro."],"clave":"La banda se mantiene tensa todo el tiempo: los pies nunca se juntan del todo.","error":"Caminar erguido y arrastrando los pies: la banda se afloja y el paseo se vuelve un calentamiento sin carga."},"Aducción de Cadera en Máquina":{"p":["Siéntate con la espalda apoyada y las piernas por dentro de las almohadillas.","Ajusta el tope de apertura a un punto donde sientas estiramiento en la ingle sin molestia.","Cierra las piernas juntando las almohadillas hasta el final del recorrido.","Sostén 1 segundo con las piernas juntas.","Abre en 3 segundos hasta la posición estirada, sin que las placas se toquen ni que las piernas se abran de golpe."],"clave":"Frenar la apertura y controlar la posición estirada es lo que hace crecer al aductor.","error":"Abrir el tope al máximo desde el primer día y soltar el peso: la ingle recibe un jalón brusco en el rango que menos controlas."},"Giro Ruso con Kettlebell":{"p":["Siéntate con las rodillas dobladas y los talones apoyados, sosteniendo la kettlebell contra el pecho.","Inclina el torso hacia atrás hasta unos 45 grados y mantén la espalda recta, sin encorvarte.","Gira el torso hacia un lado llevando la kettlebell junto a la cadera, sin mover las rodillas.","Regresa al centro con control y repite hacia el otro lado. Eso es una repetición.","Mantén el pecho abierto y la barbilla neutra durante todo el movimiento."],"clave":"El giro sale del torso, no de los brazos: la kettlebell solo acompaña lo que rota el tronco.","error":"Encorvar la espalda baja y tirar de los brazos. Carga la zona lumbar en flexión y quita trabajo al abdomen."},"Plancha con Arrastre de Kettlebell":{"p":["Colócate en plancha alta con las manos bajo los hombros y la kettlebell fuera, a un costado.","Abre los pies un poco más que el ancho de cadera para tener base.","Pasa una mano por debajo del cuerpo y arrastra la kettlebell hacia el lado contrario.","Vuelve a apoyar la mano y repite con el otro brazo. Alterna por lado.","Aprieta glúteos y abdomen para que la cadera no gire mientras arrastras."],"clave":"La cadera no se mueve: todo el ejercicio consiste en resistir la rotación, no en arrastrar rápido.","error":"Dejar que la cadera bascule con cada arrastre. Convierte un ejercicio antirrotación en un balanceo sin estímulo."},"Swing con Kettlebell":{"p":["Párate con los pies al ancho de hombros y la kettlebell en el piso a un palmo por delante.","Manda la cadera atrás con la espalda recta y toma la kettlebell con las dos manos.","Llévala entre las piernas cargando el estiramiento del femoral, con el pecho arriba.","Empuja la cadera hacia adelante con fuerza para que la kettlebell suba hasta la altura del pecho.","Deja que baje sola y vuelve a mandar la cadera atrás para encadenar la siguiente."],"clave":"Es un movimiento de cadera, no de hombro: la kettlebell sube por el empuje de glúteo, no porque la levantes.","error":"Convertirlo en sentadilla y levantar con los brazos. Quita el estímulo al glúteo y carga la espalda baja."}};


const MUS_ES={pectoral:"Pecho",dorsal:"Dorsal",espalda_alta:"Espalda alta",
  deltoides_ant:"Deltoide frontal",deltoides_lat:"Deltoide lateral",deltoides_post:"Deltoide posterior",
  biceps:"Bíceps",triceps:"Tríceps",cuadriceps:"Cuádriceps",femoral:"Femoral",gluteo:"Glúteo",
  pantorrilla:"Pantorrilla",abdomen:"Core",erectores:"Erectores",trapecio:"Trapecio",
  antebrazo:"Antebrazo",aductores:"Aductores",abductores:"Abductores"};

/* músculos con presupuesto auditado */
const MUS_AUDIT=["pectoral","dorsal","espalda_alta","deltoides_ant","deltoides_lat","deltoides_post",
  "biceps","triceps","cuadriceps","femoral","gluteo","pantorrilla","abdomen"];

const ZONAS=["rodilla","hombro","lumbar","codo","muneca","cadera","cuello","tobillo"];
const ZONA_ES={rodilla:"Rodilla",hombro:"Hombro",lumbar:"Espalda baja",codo:"Codo",
  muneca:"Muñeca",cadera:"Cadera",cuello:"Cuello",tobillo:"Tobillo"};

/* accesorio compensatorio por zona (regla e del módulo de dolor) */
const COMPENSA={rodilla:"abductores",hombro:"deltoides_post",lumbar:"abdomen",
  cadera:"abductores",tobillo:"pantorrilla"};

/* banderas rojas → el generador se niega */
const BANDERAS=[
  {k:"agudo",     t:"Dolor agudo o de inicio reciente"},
  {k:"inflamacion",t:"Inflamación visible"},
  {k:"bloqueo",   t:"Bloqueo o fallo articular"},
  {k:"nocturno",  t:"Dolor nocturno que despierta"},
  {k:"trauma",    t:"Dolor tras golpe o caída"}
];

/* ---------- etapa 2: derivar ---------- */
const MEV={novato:8,intermedio:9,avanzado:11};
const MAV=20;
const PISO_DEFICIT=10;          // piso duro en objetivo grasa

function nivelDe(anios){ const a=+anios||0; return a<1?"novato":a<4?"intermedio":"avanzado"; }
function factorEdad(edad){
  const e=+edad||30;
  if(e<40) return 1.0;
  if(e<50) return 0.95;
  if(e<60) return 0.90;
  return 0.85;
}
function derivar(inp){
  const nivel=nivelDe(inp.anios);
  const alturaCm=(+inp.altura||0)>3?(+inp.altura):((+inp.altura||0)*100);
  const ratio=(inp.cintura&&alturaCm)?(+inp.cintura)/alturaCm:null;
  const avisos=[];
  if(ratio!==null&&ratio>0.53&&inp.objetivo==="masa"){
    avisos.push({tipo:"objetivo",nivel:"pregunta",
      txt:"Tu índice cintura/estatura es "+ratio.toFixed(3)+" (>0.53). ¿Seguro que el objetivo es masa? "+
          "Puede convenir un corte primero. Es una señal, no un veredicto: el índice no distingue grasa "+
          "visceral de estructura ancha. Coméntalo con quien te lleva la dieta."});
  }
  if(factorEdad(inp.edad)<1){
    avisos.push({tipo:"edad",nivel:"info",
      txt:"Ajuste conservador de recuperación por edad (×"+factorEdad(inp.edad).toFixed(2)+"). "+
          "No es capacidad reducida: la evidencia no muestra que la edad baje sustancialmente la respuesta "+
          "hipertrófica. Es margen, y se puede subir si te recuperas bien."});
  }
  return {nivel,ratio,alturaCm,factorEdad:factorEdad(inp.edad),avisos};
}

/* ---------- etapa 3: presupuesto de series ---------- */
function presupuesto(inp,der){
  const base=MEV[der.nivel];
  const fe=der.factorEdad;
  const prio=(inp.prioridad||[]).slice(0,2);
  const obj=inp.objetivo||"masa";
  const target={};
  MUS_AUDIT.forEach(m=>{
    let v=base*fe;
    if(prio.indexOf(m)>=0) v*=1.35;
    else if(prio.length) v*=0.80;                 // mantenimiento para que cuadre
    if(obj==="grasa") v=Math.max(v,PISO_DEFICIT); // piso duro, no negociable
    target[m]=Math.round(Math.min(v,MAV)*10)/10;
  });
  return {porMusculo:target,mev:base,mav:MAV,piso:obj==="grasa"?PISO_DEFICIT:null,prio:prio,objetivo:obj};
}

/* tiempo real de una serie, con su descanso */
function segSerie(ex){ return (ex.reps[1]*3+15)+ex.rest; }
const SEG_TRANSICION=45;

function segSesion(dia){
  let s=0;
  dia.ex.forEach(e=>{ s+=e.sets*segSerie(e.src)+SEG_TRANSICION; });
  return s;
}
function presupuestoSesionSeg(inp){
  const min=+inp.minutos||60, cardio=+inp.cardio||0;
  return Math.max(300,(min-cardio)*60);
}

/* ---------- etapa 4: split ---------- */
const P_EMPUJE=["empuje_h","empuje_v"], P_JALON=["jalon_h","jalon_v"];
const SPLITS={
  2:[{n:"FULL BODY A",c:"#3b82f6",stat:"STR",pats:["rodilla_dom","empuje_h","jalon_v","cadera_dom","aislamiento","core"]},
     {n:"FULL BODY B",c:"#f97316",stat:"AGI",pats:["cadera_dom","jalon_h","empuje_v","rodilla_dom","aislamiento","pantorrilla"]}],
  3:[{n:"FULL BODY A",c:"#3b82f6",stat:"STR",pats:["rodilla_dom","empuje_h","jalon_h","aislamiento","core"]},
     {n:"FULL BODY B",c:"#f97316",stat:"AGI",pats:["cadera_dom","jalon_v","empuje_v","aislamiento","pantorrilla"]},
     {n:"FULL BODY C",c:"#22c55e",stat:"STR",pats:["rodilla_dom","empuje_h","jalon_h","aislamiento","core"]}],
  4:[{n:"UPPER A",c:"#3b82f6",stat:"STR",pats:["empuje_h","jalon_h","empuje_h","jalon_v","aislamiento","aislamiento"]},
     {n:"LOWER A",c:"#f97316",stat:"AGI",pats:["rodilla_dom","core","rodilla_dom","cadera_dom","pantorrilla","aislamiento"]},
     {n:"UPPER B",c:"#22c55e",stat:"STR",pats:["jalon_v","empuje_h","jalon_h","empuje_v","aislamiento","aislamiento"]},
     {n:"LOWER B",c:"#ef4444",stat:"AGI",pats:["cadera_dom","core","rodilla_dom","cadera_dom","pantorrilla","aislamiento"]}],
  5:[{n:"UPPER",c:"#3b82f6",stat:"STR",pats:["empuje_h","jalon_h","empuje_v","jalon_v","aislamiento"]},
     {n:"LOWER",c:"#f97316",stat:"AGI",pats:["rodilla_dom","cadera_dom","rodilla_dom","pantorrilla","core"]},
     {n:"PUSH",c:"#a855f7",stat:"STR",pats:["empuje_h","empuje_v","empuje_h","aislamiento","aislamiento"]},
     {n:"PULL",c:"#22c55e",stat:"STR",pats:["jalon_v","jalon_h","jalon_h","aislamiento","aislamiento"]},
     {n:"LEGS",c:"#ef4444",stat:"AGI",pats:["cadera_dom","rodilla_dom","cadera_dom","pantorrilla","core"]}],
  6:[{n:"PUSH A",c:"#3b82f6",stat:"STR",pats:["empuje_h","empuje_v","empuje_h","aislamiento","aislamiento"]},
     {n:"PULL A",c:"#22c55e",stat:"STR",pats:["jalon_v","jalon_h","jalon_h","aislamiento","aislamiento"]},
     {n:"LEGS A",c:"#f97316",stat:"AGI",pats:["rodilla_dom","cadera_dom","rodilla_dom","pantorrilla","core"]},
     {n:"PUSH B",c:"#a855f7",stat:"STR",pats:["empuje_v","empuje_h","empuje_h","aislamiento","aislamiento"]},
     {n:"PULL B",c:"#06b6d4",stat:"STR",pats:["jalon_h","jalon_v","jalon_h","aislamiento","aislamiento"]},
     {n:"LEGS B",c:"#ef4444",stat:"AGI",pats:["cadera_dom","rodilla_dom","cadera_dom","pantorrilla","core"]}]
};

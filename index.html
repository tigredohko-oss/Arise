/* ============================================================
   acciones
   ============================================================ */
function closeWeek(){
  const nd=S.routine.days.length, cleared=S.routine.days.filter(questDone).length, full=nd>0&&cleared===nd;
  if(!confirm("Cerrar semana "+S.week+"?\n\nQuests completadas: "+cleared+"/"+nd+
    (full?"\nBono de semana completa: +"+XP_WEEK_CLEAR+" XP":"")+
    "\n\nSe borran checks y pesos de la semana. Records e historial se conservan.")) return;
  flushNow(); backup("cierre semana "+S.week,S);
  stopRest(false); releaseWake();
  S.xpBase=(S.xpBase||0)+weekXP(S.checked)+(full?XP_WEEK_CLEAR:0);
  S.lastWeights=Object.assign({},S.weights);
  S.prev=Object.assign({},S.prev);                 // la carga de esta semana pasa a ser "la última vez"
  const hoy=today();
  Object.keys(S.weights).forEach(k=>{ if(S.weights[k]) S.prev[k]={w:String(S.weights[k]),r:String(S.sets[k]||""),d:hoy}; });
  S.checked={}; S.weights={}; S.sets={}; S.weekBonus=full;
  S.week=(S.week||1)+1; S.active=1; S.xp=totalXP();
  save(); render();
  toast(full?"SEMANA COMPLETA · +"+XP_WEEK_CLEAR+" XP":"SEMANA "+S.week+" INICIADA");
}
function loadPreset(key){
  const P = key==="ul5"?PRESET_UL5:PRESET_C5;
  if(!confirm('¿Reemplazar la rutina actual por "'+P.name+'"?\n\nSe respalda antes. Los records se conservan cuando el nombre coincide.')) return;
  flushNow(); backup("pre-preset "+key,S);
  const byName={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{
    if(S.allTimeWeights[e.uid]!==undefined) byName[e.n]={best:S.allTimeWeights[e.uid],hist:S.weightHistory[e.uid]};
  }));
  S.xpBase=(S.xpBase||0)+weekXP(S.checked);
  S.routine=buildRoutine(P);
  const nAT={},nWH={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{ const m=priorRecord(byName,e.n); if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; } }));
  S.allTimeWeights=nAT; S.weightHistory=nWH;
  S.checked={}; S.weights={}; S.sets={}; S.lastWeights={}; S.active=1; S.xp=totalXP();
  save(); render(); toast("RUTINA CARGADA · "+P.days.length+" DÍAS");
}
function saveMeasurement(){
  const date=$("#m_date").value||today(), wk=parseInt($("#m_week").value,10), label=($("#m_label").value||"").trim();
  const m={date:date,week:isNaN(wk)?S.week:wk}; if(label) m.label=label;
  let any=false;
  MFIELDS.forEach(f=>{ const v=parseFloat(String(document.querySelector('[data-m="'+f.k+'"]').value).replace(",","."));
    if(!isNaN(v)){ m[f.k]=v; any=true; } });
  if(!any){ toast("SIN DATOS QUE GUARDAR"); return; }
  S.measurements=S.measurements.filter(x=>x.date!==date);
  S.measurements.push(m); S.measurements.sort((a,b)=>a.date<b.date?-1:1);
  save(); render(); toast("MEDICIÓN SEMANA "+m.week+" GUARDADA");
}
function wireData(){
  $("#btnCopy").onclick=async()=>{ const txt=exportBundle();
    try{ await navigator.clipboard.writeText(txt); toast("COPIADO AL PORTAPAPELES"); }
    catch(e){ const b=$("#expBox"); b.focus(); b.select(); document.execCommand("copy"); toast("COPIADO"); } };
  $("#btnDl").onclick=()=>{ const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([exportBundle()],{type:"application/json"}));
    a.download="arise-"+profile+"-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast("DESCARGANDO"); };
  $("#btnShare").onclick=async()=>{ if(navigator.share){ try{ await navigator.share({title:"ARISE backup",text:exportBundle()}) }catch(e){} } else toast("COMPARTIR NO DISPONIBLE"); };
  $("#btnImp").onclick=()=>{
    const txt=$("#impBox").value.trim(); if(!txt){ toast("PEGA EL JSON PRIMERO"); return; }
    let p; try{ p=parseImport(txt); }catch(e){ toast("ERROR: "+e.message); return; }
    const snapshot=JSON.parse(JSON.stringify(S));
    let inc;
    try{ inc=upgrade(sanitizeState(p.state)); }          // saneado en la frontera
    catch(err){ S=snapshot; toast("IMPORT INVÁLIDO: "+err.message); return; }
    finally{ S=snapshot; }                              // upgrade reasigna S; restaurar siempre
    if(!confirm("Importar y reemplazar el perfil actual?\n\nEntrante: "+inc.xp+" XP · semana "+inc.week+
      " · "+inc.measurements.length+" mediciones\nActual: "+S.xp+" XP · semana "+S.week)) return;
    backup("auto pre-import",S);
    // los respaldos ajenos NO pisan los tuyos: solo rellenan el espacio sobrante
    if(p.backups){
      const mios=readJSON(bKey(profile))||[];
      const ajenos=p.backups.slice(0,MAX_BACKUPS).map(b=>({t:asNum(asObj(b).t,0),
        label:"[importado] "+asStr(asObj(b).label,60), schema:asNum(asObj(b).schema,1),
        app:asStr(asObj(b).app,12), data:asObj(asObj(b).data)}));
      writeJSON(bKey(profile),mios.concat(ajenos).slice(0,MAX_BACKUPS));
    }
    S=inc; lastLevel=null; lastTier=null; save(); render(); toast("IMPORTADO · "+S.xp+" XP");
  };
  $("#btnWipe").onclick=()=>{
    if(!confirm("BORRAR TODO el perfil "+profileName(profile)+"? Irreversible.")) return;
    if(confirm("¿Descargar un respaldo antes de borrar? (recomendado)")) $("#btnDl").click();
    if(!confirm("Última confirmación: se borra todo el historial de este perfil.")) return;
    localStorage.removeItem(sKey(profile)); localStorage.removeItem(bKey(profile));
    S=upgrade(blank()); lastLevel=null; lastTier=null; save(); render(); toast("PERFIL BORRADO"); };
  const addP=$("#addProfile");
  if(addP) addP.onclick=()=>{
    const name=(prompt("Nombre del perfil nuevo:","")||"").trim();
    if(!name) return;
    const list=profiles(), id=newProfileId();
    flushNow(); save();
    list.push({id:id,name:name.slice(0,40)}); saveProfiles(list);
    switchProfile(id,true);
  };
  document.querySelectorAll("[data-pgo]").forEach(b=>{ b.onclick=()=>switchProfile(b.dataset.pgo,false); });
  document.querySelectorAll("[data-pren]").forEach(b=>{ b.onclick=()=>{
    const id=b.dataset.pren, list=profiles(), cur=list.find(x=>x.id===id); if(!cur) return;
    const name=(prompt("Nuevo nombre:",cur.name)||"").trim(); if(!name) return;
    cur.name=name.slice(0,40); saveProfiles(list); render(); toast("PERFIL RENOMBRADO");
  };});
  document.querySelectorAll("[data-pdel]").forEach(b=>{ b.onclick=()=>{
    const id=b.dataset.pdel, list=profiles();
    if(list.length<2){ toast("NO PUEDES BORRAR EL ÚLTIMO PERFIL"); return; }
    const cur=list.find(x=>x.id===id);
    if(!confirm('¿Borrar el perfil "'+(cur?cur.name:id)+'" y TODO su historial?\n\nIrreversible.')) return;
    if(!confirm("Última confirmación. Se pierden su XP, cargas y medidas.")) return;
    localStorage.removeItem(sKey(id)); localStorage.removeItem(bKey(id));
    const rest=list.filter(x=>x.id!==id); saveProfiles(rest);
    if(id===profile){ switchProfile(rest[0].id,false); return; }
    render(); toast("PERFIL BORRADO");
  };});
  document.querySelectorAll("[data-rest]").forEach(b=>{ b.onclick=()=>{
    const x=(readJSON(bKey(profile))||[])[+b.dataset.rest]; if(!x) return;
    if(!confirm("Restaurar este respaldo? El estado actual se respalda antes.")) return;
    backup("auto pre-restore",S);
    const snap=JSON.parse(JSON.stringify(S));
    let rec; try{ rec=upgrade(sanitizeState(x.data)); }
    catch(err){ S=snap; toast("RESPALDO INVÁLIDO"); return; } finally{ S=snap; }
    S=rec; lastLevel=null; lastTier=null; save(); render(); toast("RESTAURADO"); }; });
}

function switchProfile(id,isNew){
  if(!PROFILE_RE.test(id)) { toast("PERFIL INVÁLIDO"); return; }
  flushNow(); save();                       // guarda el perfil que dejas
  profile=id; localStorage.setItem(K_ACTIVE,id);
  const raw=readJSON(sKey(id));
  S=upgrade(raw||blank());
  Object.keys(openTech).forEach(k=>delete openTech[k]);
  stopRest(false); releaseWake();
  lastLevel=levelFrom(totalXP()).lv;        // sin animación de level-up ni video al cambiar
  lastTier=tierOf(rankOf(lastLevel).r).t;
  S.profile=id; save(); render();
  toast(isNew?"PERFIL CREADO · "+profileName(id):"AHORA ERES "+profileName(id).toUpperCase());
}

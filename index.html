/* ---------- módulo de dolor: capas 1-3 ---------- */
/* v8.2 — las banderas rojas YA NO impiden generar.
   Decirle a alguien "no entrenes" casi nunca es la respuesta correcta, y desde luego
   no es una que deba dar un algoritmo. Lo que hacen ahora es activar MODO CAUTO:
   se fuerza el mínimo impacto posible en todas las zonas marcadas y se avisa fuerte. */
function banderasActivas(dolor){
  const f=(dolor&&dolor.banderas)||{};
  return BANDERAS.filter(b=>f[b.k]).map(b=>b.t);
}
/* severidad → stress máximo tolerado en esa zona. En modo cauto, todo baja a 1. */
function maxStress(sev,cauto){ return (cauto||sev>=3)?1:2; }

function zonasMarcadas(dolor){
  const z=(dolor&&dolor.zonas)||{};
  return ZONAS.filter(k=>z[k]&&+z[k].sev>0).map(k=>({zona:k,sev:+z[k].sev}));
}
function pasaDolor(ex,marcadas,cauto){
  for(let i=0;i<marcadas.length;i++){
    const m=marcadas[i];
    if((ex.stress[m.zona]||0)>maxStress(m.sev,cauto)) return false;
  }
  return true;
}

/* ---------- etapa 5: selección ---------- */
function tieneEquipo(ex,eq){
  if(!eq||!eq.length) return true;
  return ex.eq.every(e=>eq.indexOf(e)>=0);
}
function excluido(ex,inp){
  const ex_ids=(inp.excluir||[]);
  if(ex_ids.indexOf(ex.id)>=0) return true;
  const tagsNo=(inp.excluirTags||[]);
  return ex.tags.some(t=>tagsNo.indexOf(t)>=0);
}

function candidatos(DB,inp,marcadas){
  return DB.filter(ex=>tieneEquipo(ex,inp.equipo)&&!excluido(ex,inp)&&pasaDolor(ex,marcadas,inp&&inp.cauto));
}

/* sustituto para un ejercicio que no pasa el filtro de dolor:
   mismo patrón y mismo músculo primario, el de menor stress en la zona.
   Nunca elimina el patrón. */
function sustituir(DB,ex,inp,marcadas){
  const mismo=DB.filter(c=>c.pat===ex.pat&&c.m===ex.m&&c.id!==ex.id&&
                        tieneEquipo(c,inp.equipo)&&!excluido(c,inp)&&pasaDolor(c,marcadas,inp&&inp.cauto));
  if(mismo.length) return ordenarPorStress(mismo,marcadas)[0];
  const patron=DB.filter(c=>c.pat===ex.pat&&c.id!==ex.id&&
                        tieneEquipo(c,inp.equipo)&&!excluido(c,inp)&&pasaDolor(c,marcadas,inp&&inp.cauto));
  if(patron.length) return ordenarPorStress(patron,marcadas)[0];
  return null;
}
function ordenarPorStress(list,marcadas){
  return list.slice().sort((a,b)=>{
    const sa=marcadas.reduce((s,m)=>s+(a.stress[m.zona]||0),0);
    const sb=marcadas.reduce((s,m)=>s+(b.stress[m.zona]||0),0);
    if(sa!==sb) return sa-sb;
    return (b.estirada?1:0)-(a.estirada?1:0);
  });
}

function aporte(ex,sets){
  const o={}; o[ex.m]=sets;
  ex.syn.forEach(s=>{ o[s[0]]=(o[s[0]]||0)+sets*s[1]; });
  return o;
}

function seleccionar(DB,inp,der,pre,marcadas){
  const dias=SPLITS[inp.dias]||SPLITS[4];
  const cands=candidatos(DB,inp,marcadas);
  const deficit={}; MUS_AUDIT.forEach(m=>deficit[m]=pre.porMusculo[m]);
  const usados={};
  const out=[];

  dias.forEach((plantilla,di)=>{
    const dia={n:plantilla.n,c:plantilla.c,stat:plantilla.stat,ex:[]};
    const enSesion={};
    plantilla.pats.forEach((pat,pi)=>{
      const pool=cands.filter(c=>{
        if(c.pat!==pat) return false;
        if(dia.ex.some(x=>x.src.id===c.id)) return false;
        const setsM=(enSesion[c.m]||0);
        if(setsM>=10) return false;                       // máx ~10 series/músculo/sesión
        if(pi===0&&c.tipo!=="compuesto") return false;    // el BOSS es compuesto
        return true;
      });
      if(!pool.length) return;
      const fav=(inp.favoritos||[]);
      pool.sort((a,b)=>{
        const fa=fav.indexOf(a.id)>=0?1:0, fb=fav.indexOf(b.id)>=0?1:0;
        if(fa!==fb) return fb-fa;                     // los favoritos ganan el slot
        const da=(deficit[a.m]||0)-(usados[a.id]||0)*2;
        const db_=(deficit[b.m]||0)-(usados[b.id]||0)*2;
        if(Math.abs(da-db_)>0.01) return db_-da;
        if(a.estirada!==b.estirada) return (b.estirada?1:0)-(a.estirada?1:0);
        return marcadas.reduce((s,m)=>s+(a.stress[m.zona]||0),0)-
               marcadas.reduce((s,m)=>s+(b.stress[m.zona]||0),0);
      });
      const pick=pool[0];
      const sets=pi===0?4:3;
      dia.ex.push({src:pick,sets:sets,boss:pi===0});
      usados[pick.id]=(usados[pick.id]||0)+1;
      enSesion[pick.m]=(enSesion[pick.m]||0)+sets;
      const ap=aporte(pick,sets);
      for(const m in ap) if(deficit[m]!==undefined) deficit[m]-=ap[m];
    });
    out.push(dia);
  });

  /* regla (e): accesorio compensatorio por zona marcada */
  marcadas.forEach(m=>{
    const musc=COMPENSA[m.zona]; if(!musc) return;
    const ya=out.some(d=>d.ex.some(x=>x.src.m===musc));
    if(ya) return;
    const acc=cands.filter(c=>c.m===musc);
    if(!acc.length) return;
    const dia=out.reduce((a,b)=>segSesion(a)<=segSesion(b)?a:b);
    dia.ex.push({src:ordenarPorStress(acc,marcadas)[0],sets:3,boss:false,compensa:m.zona});
  });
  return out;
}

/* ---------- volumen fraccional ---------- */
function volumen(dias){
  const v={}; MUS_AUDIT.forEach(m=>v[m]=0);
  dias.forEach(d=>d.ex.forEach(e=>{
    const ap=aporte(e.src,e.sets);
    for(const m in ap) if(v[m]!==undefined) v[m]+=ap[m];
  }));
  for(const m in v) v[m]=Math.round(v[m]*10)/10;
  return v;
}

/* ---------- auditoría + reasignación ---------- */
function auditar(dias,pre,inp){
  const vol=volumen(dias);
  const capSeg=presupuestoSesionSeg(inp);
  const sesiones=dias.map(d=>({n:d.n,seg:segSesion(d),cap:capSeg,ok:segSesion(d)<=capSeg,
                               series:d.ex.reduce((a,e)=>a+e.sets,0)}));
  const musculos=MUS_AUDIT.map(m=>{
    const t=pre.porMusculo[m], v=vol[m];
    let estado="ok";
    if(v<t-1.5) estado="bajo"; else if(v>MAV) estado="alto";
    return {m:m,label:MUS_ES[m],vol:v,target:t,mav:MAV,estado:estado};
  });
  return {musculos:musculos,sesiones:sesiones,
          ok:musculos.every(x=>x.estado==="ok")&&sesiones.every(s=>s.ok),
          volTotal:Math.round(dias.reduce((a,d)=>a+d.ex.reduce((b,e)=>b+e.sets,0),0))};
}

function reasignar(dias,pre,inp,DB,marcadas){
  const capSeg=presupuestoSesionSeg(inp);
  const relDef=()=>{ const v=volumen(dias),o={};
    MUS_AUDIT.forEach(m=>o[m]=(pre.porMusculo[m]-v[m])/Math.max(1,pre.porMusculo[m])); return o; };
  const patCount=d=>{ const c={}; d.ex.forEach(e=>c[e.src.pat]=(c[e.src.pat]||0)+1); return c; };

  for(let iter=0;iter<60;iter++){
    let cambio=false;

    /* 1. el tiempo manda: recorta del músculo MENOS deficitario, no del último de la lista.
       Nunca borra el único ejercicio de un patrón: eso dejaría el patrón sin cubrir
       (así es como el core se quedaba en 0). */
    dias.forEach(d=>{
      let guard=0;
      while(segSesion(d)>capSeg&&guard++<40){
        const rd=relDef();
        const cand=d.ex.filter(e=>!e.boss&&!e.compensa);
        if(!cand.length) break;
        cand.sort((a,b)=>(rd[a.src.m]||0)-(rd[b.src.m]||0));   // menos deficitario primero
        const victima=cand.find(e=>e.sets>2)||cand[0];
        if(victima.sets>2){ victima.sets--; }
        else{
          const pc=patCount(d);
          const noUnico=cand.filter(e=>pc[e.src.pat]>1);
          if(noUnico.length){
            noUnico.sort((a,b)=>(rd[a.src.m]||0)-(rd[b.src.m]||0));
            d.ex.splice(d.ex.indexOf(noUnico[0]),1);
          } else if(d.ex.length>3){
            /* el tiempo manda sobre la cobertura de patrones: si no cabe, un patrón se cae */
            d.ex.splice(d.ex.indexOf(victima),1);
          } else if(victima.sets>1){ victima.sets--; }
          else {
            const boss=d.ex.find(e=>e.boss);
            if(boss&&boss.sets>2){ boss.sets--; }
            else if(d.ex.length>1){ d.ex.splice(d.ex.indexOf(victima),1); }
            else if(boss&&boss.sets>1){ boss.sets--; }
            else break;
          }
        }
        cambio=true;
      }
    });

    /* 2. rellena mientras quede tiempo, recorriendo TODOS los déficits
       (antes cortaba tras el primero y el recorte le ganaba siempre) */
    const rd=relDef();
    const sub=MUS_AUDIT.filter(m=>rd[m]>0.12).sort((a,b)=>rd[b]-rd[a]);
    for(let i=0;i<sub.length;i++){
      const m=sub[i];
      let hecho=false;
      const orden=dias.slice().sort((a,b)=>segSesion(a)-segSesion(b));
      for(let k=0;k<orden.length&&!hecho;k++){
        const d=orden[k];
        const enSesion=d.ex.filter(e=>e.src.m===m).reduce((a,e)=>a+e.sets,0);
        if(enSesion>=10) continue;
        const cand=d.ex.filter(e=>e.src.m===m&&e.sets<5);
        for(let j=0;j<cand.length&&!hecho;j++){
          cand[j].sets++;
          if(segSesion(d)<=capSeg){ hecho=true; cambio=true; }
          else cand[j].sets--;
        }
      }
      if(hecho) continue;
    }

    /* 3. nada puede pasar de MAV */
    MUS_AUDIT.forEach(m=>{
      let guard=0;
      while(volumen(dias)[m]>MAV&&guard++<20){
        let mayor=null;
        dias.forEach(d=>d.ex.forEach(e=>{
          if(e.src.m===m&&!e.boss&&e.sets>2&&(!mayor||e.sets>mayor.sets)) mayor=e;
        }));
        if(!mayor) break;
        mayor.sets--; cambio=true;
      }
    });
    if(!cambio) break;
  }
  return dias;
}

/* ---------- etapa 6: prescripción ---------- */
function notaDe(ex,marcadas,ajuste){
  const rir=ex.rir[0]===ex.rir[1]?("RIR "+ex.rir[0]):("RIR "+ex.rir[0]+"-"+ex.rir[1]);
  const bits=[rir];
  if(ex.estirada) bits.push("carga en estiramiento");
  if(ajuste&&ajuste.rango) bits.push("rango recortado en el extremo doloroso");
  if(ajuste&&ajuste.sustituido) bits.push("sustituido por "+ZONA_ES[ajuste.zona].toLowerCase());
  if(ex.tags.indexOf("unilateral")>=0) bits.push("por lado");
  return bits.join(" · ");
}
function prescribir(dias,inp,der,marcadas){
  return dias.map((d,i)=>({
    n:d.n, c:d.c, stat:d.stat,
    cardio:(+inp.cardio>0)?((+inp.cardio)+" min remadora o escaleras"):"",
    ex:d.ex.map(e=>{
      const src=e.src;
      /* regla (c): patrón con articulación marcada va a 12-20 @ RIR 1-2 */
      const tocado=marcadas.some(m=>(src.stress[m.zona]||0)>=1);
      const reps=tocado?[12,20]:src.reps;
      const rirX=tocado?{rir:[1,2]}:{};
      const conRir=Object.assign({},src,rirX);
      return {
        n:src.n,
        s:e.sets+"×"+(reps[0]===reps[1]?reps[0]:reps[0]+"-"+reps[1]),
        boss:!!e.boss,
        note:notaDe(conRir,marcadas,tocado?{rango:true}:null)+(e.compensa?" · accesorio compensatorio":""),
        rest:src.rest,
        _id:src.id, _m:src.m, _sets:e.sets
      };
    })
  }));
}

function rutinaPats(dias){ const o=[]; dias.forEach(d=>d.ex.forEach(e=>{if(o.indexOf(e.src.pat)<0)o.push(e.src.pat)})); return o; }

/* ---------- entrada principal ---------- */
function generar(DB,inp){
  const rojas=banderasActivas(inp.dolor);
  inp=Object.assign({},inp,{cauto:rojas.length>0||!!inp.cauto});

  const der=derivar(inp);
  const pre=presupuesto(inp,der);
  const marcadas=zonasMarcadas(inp.dolor);
  let dias=seleccionar(DB,inp,der,pre,marcadas);
  dias=reasignar(dias,pre,inp,DB,marcadas);
  let audit=auditar(dias,pre,inp);

  const avisos=der.avisos.slice();
  if(rojas.length){
    avisos.unshift({tipo:"cauto",nivel:"aviso",
      txt:"MODO CAUTO. Marcaste: "+rojas.join(" · ")+". La rutina se generó igual, con el mínimo "+
          "impacto posible en las zonas que señalaste — entrenar suele ser parte de la solución, no lo contrario. "+
          "Dicho eso: esas señales son de las que conviene que vea alguien en persona, y ninguna app "+
          "puede valorarlas. Si algo duele DURANTE la serie, para esa serie. Cargar con dolor agudo "+
          "no construye nada."});
  }
  const favs=(inp.favoritos||[]);
  if(favs.length){
    const puestos=[]; dias.forEach(d=>d.ex.forEach(e=>puestos.push(e.src.id)));
    const fuera=favs.filter(f=>puestos.indexOf(f)<0);
    if(fuera.length){
      const noms=fuera.map(f=>{const x=DB.find(y=>y.id===f);return x?x.n:f;});
      avisos.push({tipo:"favoritos",nivel:"info",
        txt:"No cupieron estos favoritos: "+noms.join(", ")+". Suele ser porque su patrón no está en "+
            "este split, porque el equipo no está marcado, o porque el presupuesto de tiempo se llenó. "+
            "Puedes agregarlos a mano en el editor después de aplicar."});
    } else {
      avisos.push({tipo:"favoritos",nivel:"ok",
        txt:"Tus "+favs.length+" ejercicios favoritos quedaron todos dentro."});
    }
  }
  if(marcadas.length){
    avisos.push({tipo:"dolor",nivel:"info",
      txt:"Zonas marcadas: "+marcadas.map(m=>ZONA_ES[m.zona]).join(", ")+
          ". Se sustituyeron ejercicios por variantes de menor carga en esa articulación, "+
          "sin quitar ningún patrón de movimiento ni bajar el volumen del músculo. "+
          "Esto es un filtro de selección de ejercicios, no un diagnóstico."});
  }
  const bajos=audit.musculos.filter(x=>x.estado==="bajo");
  if(bajos.length&&pre.objetivo==="grasa"){
    avisos.push({tipo:"conflicto",nivel:"aviso",
      txt:"CONFLICTO: en déficit el piso es "+PISO_DEFICIT+" series por músculo, porque el error "+
          "clásico es recortar entrenamiento cuando lo que se recorta es comida. Pero con "+inp.minutos+
          " min × "+inp.dias+" días no caben. El generador NO bajó el objetivo para que la auditoría "+
          "saliera limpia: te lo deja en rojo. La salida es más días o más minutos, no menos series."});
  }
  if(bajos.length){
    avisos.push({tipo:"volumen",nivel:"aviso",
      txt:"El presupuesto de tiempo no da para el volumen objetivo en: "+
          bajos.map(x=>MUS_ES[x.m]+" ("+x.vol+"/"+x.target+")").join(", ")+
          ". No es un error del plan: con "+inp.minutos+" min × "+inp.dias+
          " días no caben más series. Para cerrar el hueco tienes que subir minutos, subir días, "+
          "o bajar la lista de prioridades. Los músculos chicos reciben además volumen indirecto "+
          "que esta cuenta ya incluye a media serie."});
  }
  const patsPlan={},patsReal={};
  (SPLITS[inp.dias]||SPLITS[4]).forEach(p=>p.pats.forEach(x=>patsPlan[x]=1));
  rutinaPats(dias).forEach(x=>patsReal[x]=1);
  const faltan=Object.keys(patsPlan).filter(p=>!patsReal[p]);
  if(faltan.length){
    avisos.push({tipo:"patron",nivel:"aviso",
      txt:"El presupuesto de tiempo dejó fuera estos patrones: "+faltan.join(", ")+
          ". Son los primeros que deberías recuperar si consigues más minutos."});
  }
  audit.musculos.filter(x=>x.estado==="alto").forEach(x=>{
    avisos.push({tipo:"volumen",nivel:"aviso",txt:MUS_ES[x.m]+" queda en "+x.vol+" series, por encima del techo de "+MAV+"."});
  });

  const rutina={
    name:"GENERADA · "+inp.dias+" DÍAS · "+
         (inp.objetivo==="grasa"?"DÉFICIT":inp.objetivo==="mantener"?"MANTENIMIENTO":"HIPERTROFIA"),
    meta:{
      fase:inp.objetivo==="grasa"?"Déficit — el volumen se protege, se recorta comida":"Hipertrofia",
      rir:"Compuestos 1-3 RIR · aislamientos 0-1 RIR",
      descanso:"Compuestos 2-3 min · aislamientos 60-90 s",
      progresion:"Doble progresión: sube reps dentro del rango; al tope en todas las series, sube el peso",
      deload:"Cada 6-8 semanas, o al estancarte 2 semanas, o si molestan las articulaciones",
      recorte:"Si vas corto de tiempo: último ejercicio → penúltimo → nunca el BOSS"
    },
    days:prescribir(dias,inp,der,marcadas)
  };
  return {rutina:rutina,audit:audit,avisos:avisos,derivado:der,presupuesto:pre,bloqueo:null,cauto:inp.cauto};
}


/* ============================================================
   estado
   ============================================================ */
let profile="default", S=null, dirty=false, saveTimer=null;

/* ---------- saneamiento (frontera de confianza) ---------- */
const COLOR_RE=/^#[0-9a-fA-F]{3,8}$/;
const PROFILE_RE=/^(default|p_[0-9]{1,12})$/;
const SAFEKEY_RE=/^[A-Za-z0-9_]{1,40}$/;
const safeColor=c=>COLOR_RE.test(String(c||""))?String(c):COLORS[0];
const asObj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
const asArr=v=>Array.isArray(v)?v:[];
const asStr=(v,m)=>typeof v==="string"?v.slice(0,m):"";
const asNum=(v,d)=>{const n=typeof v==="number"?v:parseFloat(v);return isFinite(n)?n:d;};

/* Reconstruye un estado entrante campo por campo. Regenera todos los uid:
   mata la inyección en atributos y conserva la integridad referencial. */
/* Frontera de confianza compartida: la usan el import, el restore de respaldo
   y el generador. Una sola ruta de saneamiento, no dos que se desincronizan. */
function sanitizeRoutine(raw,seq,map){
  seq=seq||{n:0}; map=map||Object.create(null);
  const R=asObj(raw), M=asObj(R.meta);
  return {
    name:asStr(R.name,120)||"RUTINA",
    meta:R.meta?{fase:asStr(M.fase,120),rir:asStr(M.rir,200),descanso:asStr(M.descanso,200),
                 progresion:asStr(M.progresion,300),deload:asStr(M.deload,300),recorte:asStr(M.recorte,300)}:null,
    days:asArr(R.days).slice(0,20).map(d=>{ d=asObj(d);
      const du="d_"+(++seq.n);
      if(typeof d.uid==="string") map["c_"+d.uid]="c_"+du;
      return {uid:du, n:asStr(d.n,120)||"DÍA", c:safeColor(d.c),
        stat:STATS.indexOf(d.stat)>=0?d.stat:"STR", cardio:asStr(d.cardio,200),
        ex:asArr(d.ex).slice(0,40).map(e=>{ e=asObj(e);
          const xu="x_"+(++seq.n); if(typeof e.uid==="string") map[e.uid]=xu;
          const o={uid:xu,n:asStr(e.n,120)||"Ejercicio",s:asStr(e.s,60),boss:!!e.boss,note:asStr(e.note,300)};
          const rs=asNum(e.rest,0); if(rs>=10&&rs<=900) o.rest=Math.round(rs);
          const rf=asStr(e.ref,120); if(rf) o.ref=rf;     // enlace con la base para la ficha de técnica
          return o;
        })};
    })};
}

function sanitizeState(raw){
  const s=asObj(raw), out=blank(), map=Object.create(null), seq={n:0};
  out.schema=asNum(s.schema,1);
  out.week=Math.max(1,Math.round(asNum(s.week,1)));
  out.active=Math.max(1,Math.round(asNum(s.active,1)));
  out.xp=asNum(s.xp,0);
  out.xpBase=(typeof s.xpBase==="number"&&isFinite(s.xpBase))?s.xpBase:null;
  out.weekBonus=!!s.weekBonus;
  out.baselineSeeded=!!s.baselineSeeded;
  const R=sanitizeRoutine(s.routine,seq,map);
  out.routine=R; out.uidSeq=seq.n;
  /* remapea al uid nuevo; si no hay rutina (import legacy) conserva las claves
     con forma segura para que la migración de records por nombre siga funcionando */
  const remap=(src,f)=>{const o={},v=asObj(src);
    for(const k in v){ if(!Object.prototype.hasOwnProperty.call(v,k)) continue;
      const nk=map[k]||(SAFEKEY_RE.test(k)?k:null); if(nk) o[nk]=f(v[k]); }
    return o;};
  out.checked        = remap(s.checked,       v=>!!v);
  out.weights        = remap(s.weights,       v=>asStr(String(v),20));
  out.sets           = remap(s.sets,          v=>asStr(String(v),40));
  out.lastWeights    = remap(s.lastWeights,   v=>asStr(String(v),20));
  out.allTimeWeights = remap(s.allTimeWeights,v=>asNum(v,0));
  out.weightHistory  = remap(s.weightHistory, v=>asArr(v).slice(-200)
                        .map(h=>({w:asNum(asObj(h).w,0),d:asStr(asObj(h).d,10)})));
  out.prev = remap(s.prev, v=>({w:asStr(String(asObj(v).w||""),20),
                                r:asStr(String(asObj(v).r||""),40),
                                d:asStr(String(asObj(v).d||""),10)}));
  const sgen=asObj(s.gen);
  out.gen = Object.keys(sgen).length?{
    edad:asNum(sgen.edad,30), sexo:asStr(sgen.sexo,10), peso:asNum(sgen.peso,0),
    altura:asNum(sgen.altura,0), anios:asNum(sgen.anios,0), dias:asNum(sgen.dias,4),
    minutos:asNum(sgen.minutos,60), cardio:asNum(sgen.cardio,10),
    objetivo:["masa","grasa","mantener"].indexOf(sgen.objetivo)>=0?sgen.objetivo:"masa",
    cintura:asNum(sgen.cintura,0),
    equipo:asArr(sgen.equipo).filter(x=>typeof x==="string").slice(0,20),
    prioridad:asArr(sgen.prioridad).filter(x=>MUS_AUDIT.indexOf(x)>=0).slice(0,2),
    excluirTags:asArr(sgen.excluirTags).filter(x=>typeof x==="string").slice(0,20),
    favoritos:asArr(sgen.favoritos).filter(x=>typeof x==="string").slice(0,40)
  }:null;
  out.impLast=asStr(s.impLast,20000);
  out.proposal=null;                       // una propuesta nunca sobrevive a un import
  const sp=asObj(s.pain), spz=asObj(sp.zonas), spb=asObj(sp.banderas);
  out.pain={zonas:{},banderas:{}};
  ZONAS.forEach(z=>{ const sev=Math.round(asNum(asObj(spz[z]).sev,0));
    if(sev>=1&&sev<=4) out.pain.zonas[z]={sev:sev}; });
  BANDERAS.forEach(b=>{ if(spb[b.k]) out.pain.banderas[b.k]=true; });
  out.painLog=asArr(s.painLog).slice(-200).map(x=>{ x=asObj(x);
    return {d:asStr(x.d,10), z:ZONAS.indexOf(x.z)>=0?x.z:"", dur:asNum(x.dur,0), man:asNum(x.man,0)};
  }).filter(x=>x.z&&/^\d{4}-\d{2}-\d{2}$/.test(x.d));
  /* bitácora de semanas cerradas. Puramente aditiva: si no existe queda vacía y
     el panel de adherencia simplemente no se dibuja. Nunca se reconstruye hacia
     atrás — la historia arranca en la primera semana que se cierre con v8.5. */
  out.weekLog=asArr(s.weekLog).slice(-200).map(x=>{ x=asObj(x);
    return {w:Math.max(0,Math.round(asNum(x.w,0))), d:asStr(x.d,10),
            q:Math.max(0,Math.round(asNum(x.q,0))), nd:Math.max(0,Math.round(asNum(x.nd,0))),
            xp:Math.max(0,Math.round(asNum(x.xp,0))), full:!!x.full};
  }).filter(x=>x.nd>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.d));
  const sg=asObj(s.settings);
  out.settings={timer:sg.timer!==false,sound:sg.sound!==false,
                vibrate:sg.vibrate!==false,wake:sg.wake!==false};
  if(["corte","volumen","mantener"].indexOf(sg.fase)>=0) out.settings.fase=sg.fase;
  if(["1","1.12","1.25"].indexOf(String(sg.ts))>=0) out.settings.ts=String(sg.ts);
  out.measurements = asArr(s.measurements).slice(0,500).map(m=>{ m=asObj(m);
      const o={date:asStr(m.date,10),week:Math.round(asNum(m.week,0))};
      const lb=asStr(m.label,80); if(lb) o.label=lb;
      MFIELDS.forEach(f=>{const n=asNum(m[f.k],null); if(n!==null) o[f.k]=n;});
      return o;
    }).filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date));
  return out;
}

function profiles(){
  let list=readJSON(K_PROFILES);
  if(!Array.isArray(list)||!list.length) list=[{id:"default",name:"Dave"}];
  list=list.filter(p=>p&&PROFILE_RE.test(p.id))
           .map(p=>({id:p.id,name:asStr(p.name,40)||p.id}));
  if(!list.length) list=[{id:"default",name:"Dave"}];
  return list;
}
function saveProfiles(l){ writeJSON(K_PROFILES,l); }
function profileName(id){ const p=profiles().find(x=>x.id===id); return p?p.name:id; }
function newProfileId(){
  const used=profiles().map(p=>p.id);
  let n=1; while(used.indexOf("p_"+n)>=0) n++;
  return "p_"+n;
}

function blank(){
  return {schema:SCHEMA,app:APP_VERSION,profile:"default",uidSeq:0,routine:null,
    checked:{},weights:{},sets:{},lastWeights:{},allTimeWeights:{},weightHistory:{},
    measurements:[],photos:[],xp:0,xpBase:0,week:1,active:1,weekBonus:false,
    prev:{}, settings:{timer:true,sound:true,vibrate:true,wake:true}, impLast:"",
    gen:null, proposal:null, pain:{zonas:{},banderas:{}}, painLog:[], weekLog:[],
    baselineSeeded:false,lastBackup:null};
}
function uid(pfx){ S.uidSeq=(S.uidSeq||0)+1; return pfx+S.uidSeq; }
function buildRoutine(preset){
  return {name:preset.name, meta:preset.meta?Object.assign({},preset.meta):null,
    days:preset.days.map(d=>({
      uid:uid("d_"), n:d.n, c:d.c, stat:d.stat, cardio:d.cardio||"",
      ex:d.ex.map(e=>{const o={uid:uid("x_"),n:e.n,s:e.s,boss:!!e.boss,note:e.note||""};
                      if(e.rest) o.rest=e.rest; return o;})
    }))};
}
const readJSON=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("ERROR AL GUARDAR: "+e.name);return false}};

function upgrade(st){
  st=Object.assign(blank(),st||{});
  const from=st.schema||1;
  if(from<2){ st.allTimeWeights=st.allTimeWeights||{}; st.weightHistory=st.weightHistory||{};
    st.measurements=st.measurements||[]; st.photos=st.photos||[]; }
  if(from<3 || typeof st.xpBase!=="number"){
    st.xpBase=null; // se resuelve más abajo
  }
  st.settings=Object.assign({timer:true,sound:true,vibrate:true,wake:true},asObj(st.settings));
  /* schema 7→8: campos del generador. Puramente aditivo — nada existente cambia de forma. */
  if(!st.gen) st.gen=null;
  if(!st.proposal) st.proposal=null;
  if(typeof st.impLast!=="string") st.impLast="";
  st.pain=Object.assign({zonas:{},banderas:{}},asObj(st.pain));
  st.pain.zonas=asObj(st.pain.zonas); st.pain.banderas=asObj(st.pain.banderas);
  if(!Array.isArray(st.painLog)) st.painLog=[];
  if(!Array.isArray(st.weekLog)) st.weekLog=[];   // 8→8.5: aditivo, sin migración
  st.prev=asObj(st.prev);
  if(from<7){   // arrastra la carga de la semana pasada al formato nuevo {peso, reps}
    const lw=asObj(st.lastWeights);
    for(const k in lw) if(Object.prototype.hasOwnProperty.call(lw,k) && lw[k] && !st.prev[k])
      st.prev[k]={w:String(lw[k]),r:"",d:""};
  }
  if(!st.baselineSeeded && (!st.measurements||!st.measurements.length)){
    st.measurements=[Object.assign({},BASELINE)]; st.baselineSeeded=true;
  }
  const prevS=S; S=st; // uid() necesita S
  if(from<4 || !st.routine || !st.routine.days || !st.routine.days.length){
    // XP viejo se calculaba con los ids d<i>_<j>; consolidarlo antes de cambiar de rutina
    const oldXP = (typeof st.xp==="number"?st.xp:0);
    st.xpBase = oldXP;
    // rescatar records por NOMBRE de ejercicio antes de tirar los ids viejos
    const byName={};
    LEGACY_IDS.forEach(d=>d.ex.forEach((nm,j)=>{
      const oid=d.id+"_"+(j+1);
      if(st.allTimeWeights&&st.allTimeWeights[oid]!==undefined) byName[nm]={best:st.allTimeWeights[oid],hist:(st.weightHistory||{})[oid]};
    }));
    st.routine=buildRoutine(PRESET_UL5);
    const nAT={},nWH={};
    st.routine.days.forEach(d=>d.ex.forEach(e=>{
      const m=priorRecord(byName,e.n); if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; }
    }));
    st.allTimeWeights=nAT; st.weightHistory=nWH;
    st.checked={}; st.weights={}; st.sets={}; st.lastWeights={};
    st.active=1;
    window.__routineReset=(from<4);
  }
  if(typeof st.xpBase!=="number"||st.xpBase===null) st.xpBase=Math.max(0,(st.xp||0)-weekXP(st.checked||{},st.routine));
  st.schema=SCHEMA; st.app=APP_VERSION; st.profile=profile;
  if(prevS===null){} // no-op
  return st;
}
function backup(label,data){
  const list=readJSON(bKey(profile))||[];
  list.unshift({t:Date.now(),label:label,schema:data.schema||1,app:data.app||"?",data:JSON.parse(JSON.stringify(data))});
  writeJSON(bKey(profile),list.slice(0,MAX_BACKUPS));
}
function load(){
  const list=profiles(); saveProfiles(list);
  const want=localStorage.getItem(K_ACTIVE);
  profile=(want&&PROFILE_RE.test(want)&&list.some(p=>p.id===want))?want:list[0].id;
  localStorage.setItem(K_ACTIVE,profile);
  let raw=readJSON(sKey(profile));
  if(!raw){
    const legacy=readJSON(LEGACY_STATE);
    if(legacy){
      const lb=readJSON(LEGACY_BACKUPS);
      if(lb&&lb.length) writeJSON(bKey(profile),lb.slice(0,MAX_BACKUPS));
      S=blank(); backup("auto pre-v4.0 (migración)",legacy);
      raw=legacy; window.__migrated=true;
    }
  }
  if(raw && (raw.schema||1)<SCHEMA){ S=blank(); backup("auto pre-schema"+SCHEMA,raw); }
  S=upgrade(raw||blank());
  save();
}
function save(){
  S.app=APP_VERSION; S.schema=SCHEMA; S.profile=profile;
  if(S.routine) S.xp=totalXP();   // xp es derivado: recalcularlo siempre antes de persistir
  dirty = !writeJSON(sKey(profile),S);   // si el guardado falla, sigue sucio
}
function queueSave(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(()=>{saveTimer=null;save();},300); }
function flushNow(){ if(dirty||saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(); } }

/* ============================================================
   XP / niveles
   ============================================================ */
function weekXP(ch,rt){
  rt=rt||(S&&S.routine); if(!rt||!rt.days) return 0;
  let xp=0;
  rt.days.forEach(d=>{
    let all=true;
    if(d.cardio){ if(ch["c_"+d.uid]) xp+=XP_EXERCISE; else all=false; }
    d.ex.forEach(e=>{ if(ch[e.uid]) xp+=(e.boss?XP_BOSS:XP_EXERCISE); else all=false; });
    if(all && (d.ex.length||d.cardio)) xp+=XP_QUEST_CLEAR;
  });
  return xp;
}
const totalXP=()=>(S.xpBase||0)+weekXP(S.checked);
function levelFrom(xp){
  let lv=1,need=BASE_NEED,rem=xp;
  while(rem>=Math.round(need)){ rem-=Math.round(need); lv++; need*=NEED_MULT; if(lv>200)break; }
  return {lv:lv,cur:rem,need:Math.round(need)};
}
const rankOf=lv=>RANKS.find(r=>lv>=r.lv)||RANKS[RANKS.length-1];
function questDone(d){
  if(d.cardio && !S.checked["c_"+d.uid]) return false;
  if(!d.ex.length && !d.cardio) return false;
  return d.ex.every(e=>S.checked[e.uid]);
}

/* Pinta el avatar del tier. Si el PNG no carga (assets/ no subido, offline la primera vez),
   cae al sigilo hexagonal de v6 en vez de dejar un ícono roto. */
function paintAvatar(R){
  const T=tierOf(R.r), sig=$("#sigil");
  if(sig.dataset.tier!==String(T.t)){
    sig.dataset.tier=String(T.t); delete sig.dataset.fallback;
    sig.innerHTML="";
    const img=document.createElement("img");
    img.alt=T.label; img.loading="lazy";
    img.onerror=()=>{ sig.dataset.fallback="1"; sig.innerHTML=sigilSVG(R.r,safeColor(R.c)); };
    img.src=T.img;
    sig.appendChild(img);
  } else if(sig.dataset.fallback==="1"){
    sig.innerHTML=sigilSVG(R.r,safeColor(R.c));      // el rango cambió dentro del mismo tier
  }
  sig.style.borderColor=safeColor(R.c);
  sig.style.boxShadow="0 0 16px "+safeColor(R.c)+"55, inset 0 0 20px "+safeColor(R.c)+"22";
  return T;
}

/* Video de ascenso de tier. Si el archivo no existe o tarda demasiado,
   cierra solo y sigue con el LEVEL UP normal. */
function canPlayMp4(){
  try{
    const v=document.createElement("video");
    return !!(v.canPlayType('video/mp4; codecs="avc1.42E01E"')||v.canPlayType('video/mp4; codecs="avc1.4D401E"'));
  }catch(e){ return false; }
}
function playRankTransition(T,lv,R){
  const wrap=$("#rankvid"), vid=$("#rankvidEl");
  document.dispatchEvent(new CustomEvent("arise:transition",{detail:{tier:T.t,vid:T.vid||null,lv:lv}}));
  // Sin soporte de H.264 no tiene caso pintar la pantalla en negro para nada
  if(!T.vid||!wrap||!vid||!canPlayMp4()){ levelUp(lv,R); return; }
  let done=false;
  const finish=()=>{
    if(done) return; done=true;
    clearTimeout(vid.__to);
    wrap.classList.remove("on");
    try{ vid.pause(); }catch(e){}
    vid.onended=null; vid.onerror=null; vid.removeAttribute("src");
    levelUp(lv,R);
  };
  vid.onended=finish; vid.onerror=finish;
  $("#rankvidSkip").onclick=finish;
  vid.__to=setTimeout(finish,15000);        // red de seguridad
  vid.src=T.vid; wrap.classList.add("on");
  vid.muted=false;
  try{ vid.currentTime=0; }catch(e){}
  /* Las políticas de autoplay pueden rechazar el play() si no hay gesto reciente.
     Reintentar en silencio antes de rendirse: mejor el video mudo que ningún video. */
  const pr=vid.play();
  if(pr&&pr.catch) pr.catch(()=>{
    vid.muted=true;
    const pr2=vid.play();
    if(pr2&&pr2.catch) pr2.catch(()=>finish());
  });
  buzz([20,40,20,40,120]);
}

let lastLevel=null, lastTier=null;
function renderHeader(){
  const xp=totalXP(); S.xp=xp;
  const L=levelFrom(xp), R=rankOf(L.lv);
  $("#lvtxt").textContent="LV "+L.lv;
  const rk=$("#ranktxt"); rk.textContent=R.r; rk.style.color=R.c;
  rk.style.background="color-mix(in srgb,"+R.c+" 12%,transparent)";
  $("#rtitle").textContent='"'+R.t+'"';
  const T=paintAvatar(R);
  $("#xpbar").style.width=Math.min(100,(L.cur/L.need)*100)+"%";
  $("#xptxt").textContent=L.cur+" / "+L.need+" XP · TOTAL "+xp;
  $("#wktxt").textContent="SEMANA "+S.week;
  $("#hname").textContent="HUNTER · "+profileName(profile).toUpperCase();
  $("#vtag").textContent="v"+APP_VERSION;
  if(lastLevel!==null && L.lv>lastLevel){
    if(lastTier!==null && T.t>lastTier) playRankTransition(T,L.lv,R);   // sube de tier
    else levelUp(L.lv,R);                                              // sube de nivel a secas

}
function levelUp(lv,R){
  $("#lvnum").textContent=lv; $("#lvmsg").textContent="RANGO "+R.r+" · "+R.t;
  const o=$("#lvup"); o.classList.add("on");
  buzz([28,50,28,50,90]); beep(660,0.22); setTimeout(()=>beep(990,0.3),200);
  setTimeout(()=>o.classList.remove("on"),2600); o.onclick=()=>o.classList.remove("on");
}

/* ============================================================
   v7 · descanso, avisos, wake lock, PR
   ============================================================ */
/* Compuestos → 150 s · aislamientos → 75 s. La rutina v5 ya codifica la distinción
   en la nota (compuestos 1-3 RIR, aislamientos 0-1), así que se lee de ahí primero. */
const REST_COMPOUND=150, REST_ISO=75;
const COMPOUND_RE=/press|row|pulldown|pull-?up|chin|deadlift|squat|dip|hip thrust|lunge|prensa|remo|jal[oó]n/i;
function restFor(e){
  const r=Number(e&&e.rest);
  if(e&&e.ref&&!(isFinite(r)&&r>=10)){ const src=GENDB.find(x=>x.n===e.ref); if(src&&src.rest) return src.rest; }
  if(isFinite(r)&&r>=10&&r<=900) return Math.round(r);
  if(!e) return REST_ISO;
  if(e.boss) return REST_COMPOUND;
  if(/RIR\s*1\s*-\s*[23]/i.test(e.note||"")) return REST_COMPOUND;
  if(COMPOUND_RE.test(e.n||"")) return REST_COMPOUND;
  return REST_ISO;
}
function setOf(k){ return !S||!S.settings||S.settings[k]!==false; }
function buzz(pat){ if(!setOf("vibrate")||!navigator.vibrate) return; try{navigator.vibrate(pat||[60,60,150])}catch(e){} }
let AC=null;
function beep(freq,dur){
  if(!setOf("sound")) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=AC||new Ctx(); if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime, D=dur||0.3;
    o.type="sine"; o.frequency.setValueAtTime(freq||880,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+D);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+D+0.02);
  }catch(e){}
}

/* ---- timer de descanso ---- */
const rest={end:0,total:0,iv:null,label:""};
const restRunning=()=>rest.iv!==null;
function startRest(secs,label){
  if(!setOf("timer")||!secs) return;
  rest.end=Date.now()+secs*1000; rest.total=secs; rest.label=label||"";
  const bar=$("#restbar"); if(!bar) return;
  bar.classList.remove("hide"); $("#rbname").textContent=label||"DESCANSO";
  if(rest.iv) clearInterval(rest.iv);
  rest.iv=setInterval(tickRest,200); tickRest();
}
function tickRest(){
  const bar=$("#restbar"); if(!bar) return;
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  $("#rbtime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#rbfill").style.width=(rest.total?Math.max(0,left/rest.total*100):0)+"%";
  bar.classList.toggle("low",left<=10);
  if(left<=0) stopRest(true);
}
function stopRest(fire){
  if(rest.iv){ clearInterval(rest.iv); rest.iv=null; }
  const bar=$("#restbar"); if(bar){ bar.classList.add("hide"); bar.classList.remove("low"); }
  if(fire){ buzz([90,70,90,70,180]); beep(880,0.28); setTimeout(()=>beep(1180,0.22),170);
            toast("⏱ DESCANSO TERMINADO · " + (rest.label||"")); }
}

/* ---- wake lock ---- */
let wakeLock=null;
function sessionActive(){
  if(!S||!S.routine||!S.routine.days.length) return false;
  const d=S.routine.days[(S.active||1)-1]; if(!d) return false;
  const any=(d.cardio&&S.checked["c_"+d.uid])||d.ex.some(e=>S.checked[e.uid]);
  return !!any && !questDone(d);
}
function wakeDot(on){ const el=$("#wakedot"); if(el) el.classList.toggle("hide",!on); }
async function acquireWake(){
  if(!setOf("wake")||wakeLock||!("wakeLock" in navigator)) return;   // fallback silencioso
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{wakeLock=null;wakeDot(false);});
    wakeDot(true);
  }catch(e){ wakeLock=null; }
}
function releaseWake(){
  if(wakeLock){ try{wakeLock.release()}catch(e){} wakeLock=null; }
  wakeDot(false);
}
function syncWake(){ if(sessionActive()) acquireWake(); else releaseWake(); }

const _tecCache={};
function tecnicaDe(nombre,ref){
  let clave=nombre;
  let g=GENTEC[nombre]||GENTEC[TEC_ALIAS[nombre]||""];
  if(!g&&ref&&GENTEC[ref]){ g=GENTEC[ref]; clave=ref; }
  if(!g&&!EXDB[nombre]){
    /* último recurso: emparejado difuso, para que una rutina escrita a mano
       también reciba ficha sin obligar al usuario a usar nuestros nombres */
    if(_tecCache[nombre]===undefined){
      const m=emparejar(nombre,GENDB);
      _tecCache[nombre]=(m&&GENTEC[m.ex.n])?m.ex.n:null;
    }
    if(_tecCache[nombre]){ g=GENTEC[_tecCache[nombre]]; clave=_tecCache[nombre]; }
  }
  if(g){
    const src=GENDB.find(x=>x.n===clave)||GENDB.find(x=>x.n===TEC_ALIAS[nombre]);
    const cab=src?(MUS_ES[src.m]||src.m).toUpperCase()+
      (src.syn&&src.syn.length?" · "+src.syn.map(y=>MUS_ES[y[0]]||y[0]).join(", "):"")+
      " · "+src.eq.join(", "):"TÉCNICA";
    return {cab:cab,p:g.p,clave:g.clave,error:g.error,
            attr:"Fichas de ARISE · varias adaptadas de exercises-dataset (MIT) · Hasan Emir Yıldırım"};
  }
  const e=EXDB[nombre];
  if(e) return {p:(e.p||[]).filter(x=>!/^Repite (el n|para el n)/i.test(x)),cab:(e.t||"").toUpperCase()+(e.s&&e.s.length?" · "+e.s.join(", "):"")+" · "+e.eq,
                clave:"",error:"",attr:"Técnica: exercises-dataset (MIT) · Hasan Emir Yıldırım"};
  return null;
}

function prevOf(id){
  const p=S.prev&&S.prev[id];
  if(p&&p.w) return p;
  const lw=S.lastWeights&&S.lastWeights[id];
  if(lw) return {w:String(lw),r:"",d:""};
  return null;
}

/* ============================================================
   GRÁFICAS — SVG inline, sin librerías (la CSP es script-src 'self')
   ------------------------------------------------------------
   Paleta de datos: NO se reusan los tokens neón de la UI (--cy/--gd) como
   marcas. CHART_A y CHART_B pasan los seis checks del validador contra la
   superficie #0c1222: banda de luminosidad, piso de croma, separación CVD
   (ΔE 22.5 protan / 21.3 tritan, muy arriba del piso de 8), piso de visión
   normal y contraste ≥3:1. Si se tocan, hay que revalidarlos.
   --ok / --bad solo se usan cuando el color SIGNIFICA bien/mal, y siempre
   acompañados de leyenda escrita — nunca color solo.
   **Ningún eje doble.** Dos medidas de escala distinta se indexan a la primera
   lectura = 100 y comparten un solo eje.
   Esto es una app de teléfono: el hover no existe. La capa interactiva es
   <title> nativo por marca (escritorio y lector de pantalla) + etiqueta directa
   en el extremo + la tabla de HISTORIAL. Un tooltip con estado obligaría a
   re-render y aquí eso roba el foco.
   ============================================================ */
const CHART_A="#0d9ed1", CHART_B="#b98a1e";
const CHART_GRID="rgba(42,63,102,.6)", CHART_INK="#8496b8";
const dnum=s=>{const p=String(s||"").split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000;};
const dshort=s=>String(s||"").slice(8,10)+"/"+String(s||"").slice(5,7);
/* halo=true dibuja el texto con un contorno del color de la superficie por debajo
   (paint-order), para que una etiqueta que cae encima de una línea o un punto siga
   siendo legible sin tener que moverla a un hueco que quizá no existe. */
const txt=(x,y,s,anchor,size,fill,halo)=>'<text x="'+x+'" y="'+y+'" '+(anchor?'text-anchor="'+anchor+'" ':'')+
  'font-size="'+(size||9)+'" fill="'+(fill||CHART_INK)+'" font-family="ui-monospace,monospace"'+
  (halo?' stroke="#0c1222" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"':'')+
  '>'+esc(s)+'</text>';
let progMetric="weight";

function chartLine(series,opts){
  opts=opts||{};
  const W=320,H=opts.h||136,PL=38,PR=12,PT=14,PB=20;
  const fm=opts.fm||(v=>(Math.round(v*10)/10).toFixed(1));
  const vals=[]; series.forEach(s=>s.pts.forEach(p=>vals.push(p.v)));
  if(vals.length<2) return '<div class="muted">Con 2 registros ya se dibuja la tendencia.</div>';
  let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(opts.ref!=null){ mn=Math.min(mn,opts.ref); mx=Math.max(mx,opts.ref); }
  const rg=(mx-mn)||Math.abs(mx)*0.1||1; mn-=rg*0.15; mx+=rg*0.15;
  const n=opts.n||Math.max.apply(null,series.map(s=>s.pts.length));
  const X=i=>PL+(n<2?(W-PL-PR)/2:(i/(n-1))*(W-PL-PR));
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  let g='';
  [0,0.5,1].forEach(f=>{ const v=mn+(mx-mn)*f, y=+Y(v).toFixed(1);   // rejilla sólida, nunca punteada
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="'+CHART_GRID+'" stroke-width="1"/>'+
       txt(PL-5,(y+3.5).toFixed(1),fm(v),"end"); });
  /* La línea de referencia es cromo, no una serie: va en tinta neutra para que
     no se confunda con CHART_B, y anclada a la izquierda porque la derecha es
     donde viven siempre las etiquetas de extremo. */
  let refTxt='';
  if(opts.ref!=null){ const y=+Y(opts.ref).toFixed(1);
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="rgba(132,150,184,.75)" stroke-width="1"/>';
    /* la etiqueta se pinta al final: si va aquí, el primer marcador de la serie
       le cae encima y ni el halo la salva */
    refTxt=txt(PL+4,(y-4).toFixed(1),opts.refLabel||"","start",9,CHART_INK,true); }
  series.forEach(s=>{
    const col=safeColor(s.c), pts=s.pts.slice().sort((a,b)=>a.i-b.i);
    g+='<polyline points="'+pts.map(p=>X(p.i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")+
       '" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p=>{ g+='<circle cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4" fill="'+col+
       '" stroke="#0c1222" stroke-width="1.8"><title>'+esc(s.n+" · "+(p.t||"")+" · "+fm(p.v))+'</title></circle>'; });
    const lp=pts[pts.length-1];                       // etiqueta directa solo en el extremo
    g+=txt((X(lp.i)-6).toFixed(1),(Y(lp.v)-10).toFixed(1),fm(lp.v),"end",10.5,"#a3b4d2",true);
  });
  const p0=series[0].pts[0], pN=series[0].pts[series[0].pts.length-1];
  g+=refTxt+txt(PL,H-5,dshort(p0.t))+txt(W-PR,H-5,dshort(pN.t),"end");
  const leg=series.length>1
    ? '<div class="lgd">'+series.map(s=>'<span><i style="background:'+safeColor(s.c)+'"></i>'+esc(s.n)+'</span>').join("")+'</div>'
    : '';
  return leg+'<svg class="cht" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.alt||"")+'">'+g+'</svg>';
}

function chartBars(items,opts){
  opts=opts||{};
  if(!items.length) return '';
  const W=320,H=opts.h||140,PL=38,PR=12,PT=14,PB=20;
  const fm=opts.fm||(v=>(Math.round(v*100)/100).toFixed(2));
  const vals=items.map(x=>x.v).concat([0]);
  if(opts.band) vals.push(opts.band.lo,opts.band.hi);
  let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  const rg=(mx-mn)||1; mn-=rg*0.18; mx+=rg*0.18;
  /* Un conteo no tiene valores negativos: sin este tope el relleno del eje
     dibuja un "-1 quests" que no existe. */
  if(opts.min!=null&&mn<opts.min) mn=opts.min;
  if(opts.max!=null&&mx>opts.max) mx=opts.max;
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const n=items.length, slot=(W-PL-PR)/n;
  const bw=Math.max(5,Math.min(26,slot-4));   // 4 u ≈ 2px de hueco; el tope evita bloques gruesos
  let g='';
  if(opts.band){ const y1=Y(opts.band.hi), y2=Y(opts.band.lo);
    g+='<rect x="'+PL+'" y="'+y1.toFixed(1)+'" width="'+(W-PL-PR)+'" height="'+Math.max(1,y2-y1).toFixed(1)+
       '" fill="rgba(57,217,138,.14)"/>'; }
  [mn,mx].forEach(v=>{ const y=+Y(v).toFixed(1);
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="'+CHART_GRID+'" stroke-width="1"/>'+
       txt(PL-5,(y+3.5).toFixed(1),fm(v),"end"); });
  const y0=+Y(0).toFixed(1);
  g+='<line x1="'+PL+'" y1="'+y0+'" x2="'+(W-PR)+'" y2="'+y0+'" stroke="'+CHART_GRID+'" stroke-width="1"/>';
  items.forEach((it,i)=>{
    const x=PL+i*slot+(slot-bw)/2, y=Y(it.v);
    g+='<rect x="'+x.toFixed(1)+'" y="'+Math.min(y,y0).toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+Math.max(1.5,Math.abs(y-y0)).toFixed(1)+'" rx="3.5" fill="'+safeColor(it.c)+
       '"><title>'+esc((it.t||"")+" · "+fm(it.v))+'</title></rect>';
    /* etiqueta directa selectiva: el último y los que se salen de la banda */
    if(it.mark||i===n-1) g+=txt((x+bw/2).toFixed(1),(Math.min(y,y0)-5).toFixed(1),fm(it.v),"middle",9.5,"#a3b4d2",true);
  });
  g+=txt(PL,H-5,dshort(items[0].d))+txt(W-PR,H-5,dshort(items[n-1].d),"end");
  return '<svg class="cht" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.alt||"")+'">'+g+'</svg>';
}

function miniSpark(vals,color){
  const v=vals.filter(x=>typeof x==="number"&&isFinite(x));
  if(v.length<2) return '<svg class="msp" viewBox="0 0 74 22"></svg>';
  const mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1;
  const pts=v.map((x,i)=>(2+(i/(v.length-1))*70).toFixed(1)+","+(19-((x-mn)/rg)*16).toFixed(1)).join(" ");
  return '<svg class="msp" viewBox="0 0 74 22" aria-hidden="true"><polyline points="'+pts+
    '" fill="none" stroke="'+safeColor(color)+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function row(k,v,extra){ return '<div class="mrow"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+(extra||"")+'</span></div>'; }

/* Δ de peso normalizado a kg/semana entre mediciones consecutivas.
   Normalizar por días importa: dos mediciones con 10 días en medio no son
   "una semana" y leerlas como tal infla el ritmo. */
function ritmoData(){
  const list=sortedM().filter(m=>typeof m.weight==="number"), out=[];
  for(let i=1;i<list.length;i++){
    const a=list[i-1], b=list[i], dias=dnum(b.date)-dnum(a.date);
    if(!(dias>0)) continue;
    out.push({d:b.date, kg:(b.weight-a.weight)*7/dias, peso:b.weight});
  }
  return out;
}
/* Clasifica el ritmo SIN zonas muertas: toda lectura cae en exactamente una rama.
   Las reglas son las mismas que usa coachRead() — si una cambia, cambian las dos. */
function ritmoPanel(){
  const raw=ritmoData(); if(!raw.length) return '';
  const fase=faseActual();
  const pc=raw[raw.length-1].peso||85;
  let band,titulo,unidad;
  if(fase==="corte"){ band={lo:pc*0.005,hi:pc*0.01}; titulo="RITMO DE CORTE"; unidad="kg perdidos por semana"; }
  else if(fase==="volumen"){ band={lo:0.2,hi:0.4}; titulo="RITMO DE VOLUMEN"; unidad="kg ganados por semana"; }
  else { band={lo:-0.3,hi:0.3}; titulo="RITMO EN MANTENIMIENTO"; unidad="cambio de peso por semana"; }
  const signo=fase==="corte"?-1:1;
  const items=raw.map(r=>{
    const v=r.kg*signo; let c=CHART_INK, mark=false;
    if(v>=band.lo&&v<=band.hi) c="#39d98a";
    else if(v>band.hi||v<Math.min(band.lo,0)-0.3){ c="#ff5f6d"; mark=true; }
    return {v:v,c:c,mark:mark,d:r.d,t:"sem del "+r.d};
  });
  const ult=items.slice(-4), prom=ult.reduce((a,x)=>a+x.v,0)/ult.length;
  const dentro=items.filter(x=>x.c==="#39d98a").length;
  let h='<div class="pnl"><div class="ptit">'+esc(titulo)+'</div>'+
    '<div class="hero">'+esc((Math.round(prom*100)/100).toFixed(2))+' <small>KG/SEM</small></div>'+
    '<div class="muted">Promedio de las últimas '+ult.length+' mediciones. '+
    'La banda verde es '+esc(band.lo.toFixed(2))+'–'+esc(band.hi.toFixed(2))+' kg/sem'+
    (fase==="corte"?' — el 0.5–1% de tu peso, el rango que protege músculo.':'.')+'</div>';
  h+='<div class="lgd"><span><i style="background:#39d98a"></i>EN RANGO</span>'+
     '<span><i style="background:'+CHART_INK+'"></i>LENTO O ESTABLE</span>'+
     '<span><i style="background:#ff5f6d"></i>FUERA DE RANGO</span></div>';
  h+=chartBars(items,{band:band,alt:unidad+", contra la banda objetivo"});
  h+='<div class="note">'+esc(unidad)+' · '+dentro+' de '+items.length+' mediciones dentro de la banda. '+
     'Cada barra es el cambio entre dos mediciones, dividido entre los días reales que pasaron.</div></div>';
  return h;
}

/* Cintura y brazo comparten un solo eje porque van indexados a la primera
   lectura = 100. Con eje doble (cm de cintura vs cm de brazo) la gráfica
   inventaría una correlación que no está en los datos. */
function composicionPanel(){
  const list=sortedM().filter(m=>typeof m.waist==="number"&&typeof m.armR_flex==="number");
  if(list.length<2) return '';
  const w0=list[0].waist, a0=list[0].armR_flex;
  const sc=[{n:"CINTURA",c:CHART_A,pts:list.map((m,i)=>({i:i,v:m.waist/w0*100,t:m.date}))},
            {n:"BRAZO D FUERZA",c:CHART_B,pts:list.map((m,i)=>({i:i,v:m.armR_flex/a0*100,t:m.date}))}];
  const dw=list[list.length-1].waist-w0, da=list[list.length-1].armR_flex-a0;
  let lec;
  if(dw<=-0.5&&da>=-0.8) lec=['ok','Cintura '+dw.toFixed(1)+' cm con el brazo en '+(da>0?"+":"")+da.toFixed(1)+
    ' cm. Estás perdiendo grasa sin pagar músculo.'];
  else if(dw<=-0.5) lec=['','Cintura '+dw.toFixed(1)+' cm, pero el brazo bajó '+Math.abs(da).toFixed(1)+
    ' cm con ella. Es la señal de que falta proteína o sobra déficit.'];
  else lec=['','La cintura lleva '+(dw>0?"+":"")+dw.toFixed(1)+' cm desde el baseline. Todavía poco para leer tendencia.'];
  return '<div class="pnl"><div class="ptit v">GRASA vs MÚSCULO</div>'+
    '<div class="muted">Las dos medidas indexadas a tu primera lectura = 100, en un solo eje. '+
    'Cintura abajo y brazo plano es el mejor escenario del corte.</div>'+
    chartLine(sc,{ref:100,refLabel:"BASELINE",n:list.length,alt:"cintura y brazo indexados al baseline",
                  fm:v=>(Math.round(v*10)/10).toFixed(1)})+
    '<div class="alert '+lec[0]+'">'+lec[1]+'</div></div>';
}

/* weightHistory lleva guardando {peso,fecha} por ejercicio desde la v3.4 y hasta
   la v8.5 no se le mostraba a nadie: solo se usaba para migrar records. */
function fuerzaPanel(){
  const filas=[];
  S.routine.days.forEach(d=>d.ex.forEach(e=>{
    const hs=(S.weightHistory[e.uid]||[]).filter(x=>x&&isFinite(x.w)&&x.w>0);
    if(!hs.length) return;
    filas.push({n:e.n,c:safeColor(d.c),hs:hs,pr:S.allTimeWeights[e.uid]});
  }));
  if(!filas.length) return '<div class="pnl"><div class="ptit g">FUERZA</div>'+
    '<div class="muted">Todavía sin historial de cargas. En cuanto escribas pesos en las quests, cada ejercicio arma su propia curva aquí.</div></div>';
  filas.sort((a,b)=>{const x=a.hs[a.hs.length-1].d,y=b.hs[b.hs.length-1].d; return x<y?1:x>y?-1:0;});
  let h='<div class="pnl"><div class="ptit g">FUERZA · '+filas.length+'</div>'+
    '<div class="muted">Tu carga registrada por ejercicio, del más reciente al más viejo. El número es el PR y el delta va contra tu primer registro.</div>';
  filas.forEach(f=>{
    const v=f.hs.map(x=>x.w), d=v[v.length-1]-v[0];
    h+='<div class="frow"><span class="fn" title="'+esc(f.n)+'">'+esc(f.n)+'</span>'+
       '<span class="fs">'+miniSpark(v,CHART_A)+'</span>'+
       '<span class="fv">'+esc((f.pr!=null?f.pr:v[v.length-1])+" kg")+
       (v.length>1?' <span class="dlt '+(d>0.05?"up":d<-0.05?"dn":"eq")+'">'+(d>0?"+":"")+
         (Math.round(d*10)/10)+'</span>':'')+'</span></div>';
  });
  return h+'<div class="note">El tonelaje real (peso × reps × series) no se puede reconstruir hacia atrás: el historial guarda el peso, no las repeticiones. Eso llega con el modelo de series de la v9.</div></div>';
}

const PROGM=[{k:"weight",l:"PESO",u:"kg"},{k:"waist",l:"CINTURA",u:"cm"},{k:"ratio",l:"CINT/EST",u:""},
  {k:"chest",l:"PECHO",u:"cm"},{k:"shoulders",l:"HOMBROS",u:"cm"},

}

const sortedM=()=>S.measurements.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const fmt=n=>(n===undefined||n===null||n==="")?"—":(Math.round(n*10)/10).toFixed(1);
function delta(cur,prev,inverse){
  if(prev==null||cur==null) return "";
  const d=Math.round((cur-prev)*10)/10;
  if(Math.abs(d)<0.05) return '<span class="dlt eq">±0</span>';
  return '<span class="dlt '+((inverse?d<0:d>0)?"up":"dn")+'">'+(d>0?"+":"")+d.toFixed(1)+'</span>';
}

       '" data-fase="'+f+'">'+esc(FASE_ES[f])+'</span>').join("")+'</div></div>';
  if(last&&base&&list.length>1) h+='<div class="pnl"><div class="ptit v">LECTURA</div>'+coachRead(base,last,prev)+'</div>';

  }
  h+='<div class="pnl"><div class="ptit">HISTORIAL · '+list.length+'</div>';
  if(!list.length) h+='<div class="muted">Sin mediciones.</div>';
  list.slice().reverse().forEach(m=>{
    h+='<div class="entry"><h4><span>SEM '+esc(m.week)+' · '+esc(m.date)+(m.label?' · '+esc(m.label):'')+'</span>'+

       '<span class="chip">brazo I '+fmt(m.armL_flex)+'</span><span class="chip">pant D '+fmt(m.calfR)+'</span>'+
       '<span class="chip">pant I '+fmt(m.calfL)+'</span></div></div>';
  });
  return h+'</div>';
}
/* La lectura depende de la FASE. En corte, "bajaste peso" es la meta;
   en volumen es superávit insuficiente. Leerlo al revés es peor que no leerlo. */
function aplicarEscala(){
  const v=parseFloat((S.settings&&S.settings.ts)||1);
  document.documentElement.style.setProperty("--ts",(v>=1&&v<=1.4)?v:1);
}
function faseActual(){
  const f=S.settings&&S.settings.fase;
  if(f==="corte"||f==="volumen"||f==="mantener") return f;
  const o=S.gen&&S.gen.objetivo;
  return o==="grasa"?"corte":o==="mantener"?"mantener":"volumen";
}
const FASE_ES={corte:"CORTE · bajar grasa",volumen:"VOLUMEN · subir masa",mantener:"MANTENIMIENTO"};

function coachRead(base,last,prev){
  const out=[], fase=faseActual();
  const pc=last.weight?last.weight:(base.weight||80);
  if(prev&&prev.weight!=null&&last.weight!=null){
    const dw=Math.round((last.weight-prev.weight)*100)/100;
    const pct=Math.abs(dw)/pc*100;
    if(fase==="corte"){
      /* Referencia habitual en corte: 0.5–1% del peso corporal por semana.
         Más rápido y sube el riesgo de perder músculo junto con la grasa. */
      const lo=pc*0.005, hi=pc*0.01;
      if(dw>0.3) out.push(['bad','Subiste '+dw.toFixed(1)+' kg en corte. Una semana puede ser agua o sal; '+
        'dos seguidas ya es que el déficit no está donde crees.']);
      else if(dw>=-0.05) out.push(['','Peso estable. Si se repite 2-3 semanas, el déficit se cerró — '+
        'suele ser adherencia o gasto que bajó, no metabolismo roto.']);
      else if(Math.abs(dw)<lo) out.push(['ok','−'+Math.abs(dw).toFixed(1)+' kg. Lento pero en la dirección correcta. '+
        'Bajar despacio protege músculo.']);
      else if(Math.abs(dw)<=hi) out.push(['ok','−'+Math.abs(dw).toFixed(1)+' kg ('+pct.toFixed(1)+'% del peso corporal) — '+
        'justo en el rango que protege masa muscular ('+lo.toFixed(2)+'–'+hi.toFixed(2)+' kg/sem para ti).']);
      else out.push(['bad','−'+Math.abs(dw).toFixed(1)+' kg en una semana ('+pct.toFixed(1)+'%). Arriba de 1% del peso '+
        'corporal sube el riesgo de que parte de lo que pierdes sea músculo. Coméntalo con Fernanda.']);
    } else if(fase==="volumen"){
      if(dw>0.5) out.push(['bad','Subiste '+dw.toFixed(1)+' kg en una semana. Arriba de 0.4 kg/sem el excedente tiende a ser grasa. Avísale a Fernanda antes de que se acumule.']);
      else if(dw>=0.15) out.push(['ok','+'+dw.toFixed(1)+' kg esta semana — dentro del rango ideal de volumen (0.2–0.4 kg/sem).']);
      else if(dw>=-0.05) out.push(['','Peso prácticamente estable. Si se repite 2-3 semanas, el superávit se quedó corto.']);
      else out.push(['bad','Bajaste '+Math.abs(dw).toFixed(1)+' kg. En fase de volumen eso es superávit insuficiente.']);
    } else {
      if(Math.abs(dw)<=0.3) out.push(['ok','Peso estable ('+(dw>0?"+":"")+dw.toFixed(1)+' kg). Es lo que buscas en mantenimiento.']);
      else out.push(['','Movimiento de '+(dw>0?"+":"")+dw.toFixed(1)+' kg. En mantenimiento conviene revisar si fue intencional.']);
    }
  }
  const dwaist=(last.waist!=null&&base.waist!=null)?last.waist-base.waist:null;
  const darm=(last.armR_flex!=null&&base.armR_flex!=null)?last.armR_flex-base.armR_flex:null;
  if(dwaist!=null&&darm!=null){
    if(fase==="corte"){
      /* sin zonas muertas: toda combinación cintura×brazo cae en exactamente una rama */
      if(dwaist<=-0.5){
        if(darm<-0.8) out.push(['','Cintura '+dwaist.toFixed(1)+' cm, pero el brazo también bajó '+
          Math.abs(darm).toFixed(1)+' cm. Vale la pena subir proteína o bajar el ritmo del déficit.']);
        else out.push(['ok','Cintura '+dwaist.toFixed(1)+' cm con el brazo casi intacto ('+
          (darm>0?"+":"")+darm.toFixed(1)+' cm). Estás perdiendo grasa sin pagar músculo — es el mejor escenario del corte.']);
      }
      else if(dwaist>=-0.3) out.push(['','La cintura casi no se ha movido desde el baseline ('+
        (dwaist>0?"+":"")+dwaist.toFixed(1)+' cm). Es la medida que más directamente refleja la grasa que quieres quitar.']);
      else out.push(['','Cintura '+dwaist.toFixed(1)+' cm. Va en la dirección correcta, todavía poco para leer tendencia.']);
    } else {
      if(dwaist>1.5&&darm<=dwaist*0.5) out.push(['bad','Cintura +'+dwaist.toFixed(1)+' cm vs brazo +'+darm.toFixed(1)+
        ' cm. La cintura es el indicador temprano: el superávit se fue de más. Bajar calorías.']);
      else if(darm>0&&dwaist<=0.5) out.push(['ok','Brazo +'+darm.toFixed(1)+' cm con cintura casi sin moverse. Este es el escenario que buscas.']);
    }
  }
  /* cintura/estatura solo si la app conoce la estatura */
  const alt=(S.gen&&S.gen.altura)?+S.gen.altura:0;
  if(alt>100&&last.waist){
    const r=last.waist/alt;
    if(r>0.53&&fase==="volumen") out.push(['','Cintura/estatura '+r.toFixed(3)+' (>0.53). Con ese número, un corte '+
      'antes del volumen suele rendir más. Señal, no veredicto.']);
    else if(r<=0.53) out.push(['ok','Cintura/estatura '+r.toFixed(3)+' — por debajo del umbral de 0.53.']);
  }
  const asym=(last.armR_flex!=null&&last.armL_flex!=null)?Math.abs(last.armR_flex-last.armL_flex):null;
  if(asym!=null&&asym>=1) out.push(['','Diferencia de '+asym.toFixed(1)+' cm entre brazos. Arriba de 1 cm conviene empezar los unilaterales por el lado chico.']);
  if(!out.length) out.push(['','Aún sin suficiente historial para leer tendencia. Con 3 semanas ya se puede.']);
  return out.map(o=>'<div class="alert '+o[0]+'">'+o[1]+'</div>').join("");
}
function sparkBlock(title,vals){
  const v=vals.filter(x=>typeof x==="number"&&!isNaN(x));
  if(v.length<2) return "";
  const mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1,W=300,H=48,P=4;
  const pts=v.map((x,i)=>(P+(i/(v.length-1))*(W-P*2)).toFixed(1)+","+(H-P-((x-mn)/rg)*(H-P*2)).toFixed(1)).join(" ");
  return '<div class="grp">'+title+' · '+v[0].toFixed(1)+' → '+v[v.length-1].toFixed(1)+'</div>'+
    '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><polyline points="'+pts+
    '" fill="none" stroke="#4fd6ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function parseImport(txt){
  let o; try{ o=JSON.parse(txt); }catch(e){ throw new Error("JSON inválido"); }
  let st=null,backups=null;
  if(o&&o._keys){
    const K=o._keys;
    st=K[sKey(profile)]||K["arise:default:state"]||K[LEGACY_STATE]||null;
    backups=K[bKey(profile)]||K["arise:default:backups"]||K[LEGACY_BACKUPS]||null;
    if(!st) for(const k in K){ const v=K[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&("xp" in v||"checked" in v)){ st=v; break; } }
  } else if(o&&(("xp" in o)||("checked" in o))) st=o;
  else if(o&&o.data&&(("xp" in o.data)||("checked" in o.data))) st=o.data;
  if(!st) throw new Error("No encontré un estado válido");
  return {state:st,backups:Array.isArray(backups)?backups:null};
}

/* ============================================================
   v8.3 · IMPORTADOR DE RUTINAS ESCRITAS A MANO
   Un motor de reglas no tiene el criterio de alguien que sabe. Si ya tienes
   una rutina buena, lo correcto es meterla, no que la app se invente otra.
   Soporta dos formatos: un ejercicio por renglón, y tablas copiadas donde
   cada celda cayó en su propia línea (lo que pasa al copiar de un doc).
   ============================================================ */

const NORM = s => String(s||"")
  .toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9\s]/g," ")
  .replace(/\s+/g," ").trim();

/* 4x8-10 · 4 x 8 · 4×10 · 3 series de 12 · 3 sets x 12 · 4 series 8/10 */
const RE_SETS = /(\d{1,2})\s*(?:x|×|\*|series?\s*(?:de\s*|x\s*)?|sets?\s*(?:of\s*|x\s*)?)\s*(\d{1,3})(?:\s*(?:[-–—/a]|\s+a\s+)\s*(\d{1,3}))?/i;
/* al revés: "8-10 reps x 4 series" */
const RE_SETS_INV = /(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*(?:reps?|repeticiones?)\s*(?:x|×|por)\s*(\d{1,2})\s*(?:series?|sets?)/i;
/* sin multiplicador: "3 series" o "12 reps" sueltos */
const RE_SOLO_SERIES = /(\d{1,2})\s*(?:series?|sets?)\b/i;
const RE_RONDAS = /^\s*(\d{1,2})\s*(?:rondas?|vueltas?|rounds?)\b/i;
const RE_RONDAS_ANY = /\b(\d{1,2})\s*(?:rondas?|vueltas?|rounds?)\b/i;
const RE_SOLO_REPS   = /(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*(?:reps?|repeticiones?)\b/i;

const RE_RIR   = /\bRIR\s*[:=]?\s*(\d)(?:\s*[-–]\s*(\d))?/i;
/* "pausa" quedó fuera a propósito: "pausa 1 s arriba" es una indicación de tempo,
   no el descanso entre series, y se estaba comiendo la nota del ejercicio. */
const RE_DESC  = /\b(?:descanso|rest|descansa)\s*[:=]?\s*(\d{1,3})\s*(s|seg|segundos|m|min|minutos|')?/i;
const RE_PESO  = /(\d{1,3}(?:[.,]\d)?)\s*(kg|kgs|lb|lbs|libras)\b/i;
const RE_LADO  = /\b(?:por|cada|x)\s*(?:lado|pierna|brazo)\b|\bunilateral\b|\b\/\s*lado\b/i;

const DIAS_SEMANA = "lunes|martes|miercoles|jueves|viernes|sabado|domingo|monday|tuesday|wednesday|thursday|friday|saturday|sunday";
const RE_DIA_NUM  = new RegExp("^\\s*(?:d[ií]a|day|sesi[oó]n|session|entrenamiento|workout|rutina)\\s*[:#\\-–]?\\s*(\\d{1,2}|[a-f])\\b","i");
const RE_DIA_SEM  = new RegExp("^\\s*(?:"+DIAS_SEMANA+")\\b","i");
const RE_DIA_LETRA= /^\s*([a-f])\s*[\)\.\-–:]\s*\S/i;
const RE_DIA_D    = /^\s*d\s*(\d{1,2})\s*(?:[·:\-–—.)]|\s)\s*\S/i;
const RE_DIA_TIPO = /^\s*(push|pull|legs|piernas?|upper|lower|full\s*body|torso|tren\s+(?:superior|inferior)|pecho|espalda|brazos?|hombros?|gl[uú]teos?)\b/i;

/* ruido típico de PDFs y capturas */
const RE_RUIDO = /^\s*(?:p[aá]g(?:ina)?\.?\s*\d+|\d+\s*\/\s*\d+|www\.|https?:|copyright|©|todos los derechos)/i;
const RE_ENCABEZADO_TABLA = /^\s*(?:ejercicio|exercise|series|sets|reps?|repeticiones|descanso|rest|peso|carga)(?:\s*[|\t,;]\s*(?:ejercicio|exercise|series|sets|reps?|repeticiones|descanso|rest|peso|carga|nota[s]?))+\s*$/i;

function esDia(linea){
  const t=linea.trim();
  if(!t) return false;
  if(RE_DIA_NUM.test(t)||RE_DIA_SEM.test(t)) return true;
  if(RE_DIA_D.test(t)&&!RE_SETS.test(t)) return true;
  if(RE_DIA_LETRA.test(t)&&!RE_SETS.test(t)) return true;
  if(RE_SETS.test(t)) return false;                       // si trae series, es ejercicio
  if(RE_DIA_TIPO.test(t)&&t.length<60) return true;
  /* línea corta en MAYÚSCULAS sin dígitos: casi siempre es un encabezado */
  const letras=t.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,"");
  if(letras.length>=3&&t.length<60&&letras===letras.toUpperCase()&&!/\d/.test(t)) return true;
  return false;
}

function limpiaNombre(s){
  return String(s)
    .replace(/\s*[\/]\s*\d{1,3}(?:\s*[-–—]\s*\d{1,3})?\s*/g," ")   // colas de rangos: "/ 10-15"
    .replace(/^\s*(?:[-–—•*·▪◦]|\d{1,2}\s*[\).\-–:])\s*/,"")   // viñetas y numeración
    .replace(/\b(?:reps?|repeticiones?|series?|sets?)\b/gi," ")   // sobras del patrón de series
    .replace(/[()@]/g," ")                                          // símbolos huérfanos
    .replace(/\s*[|\t;]+\s*$/,"")
    .replace(/^\s*[-–—:·|,]+\s*/,"")
    .replace(/\s*[-–—:·|,]+\s*$/,"")
    .replace(/\s{2,}/g," ")
    .trim();
}

function extraeSeries(linea){
  let ro=RE_RONDAS_ANY.exec(linea);
  if(ro) return {sets:+ro[1], r1:null, r2:null, txt:ro[0].trim()};
  let m=RE_SETS_INV.exec(linea);
  if(m) return {sets:+m[3], r1:+m[1], r2:m[2]?+m[2]:null, txt:m[0]};
  m=RE_SETS.exec(linea);
  if(m){
    const sets=+m[1], r1=+m[2], r2=m[3]?+m[3]:null;
    /* "12x60kg" no es series×reps: si el segundo número es peso, se descarta */
    if(sets>=1&&sets<=12&&r1>=1&&r1<=100) return {sets:sets,r1:r1,r2:r2,txt:m[0]};
  }
  const s=RE_SOLO_SERIES.exec(linea), r=RE_SOLO_REPS.exec(linea);
  if(s||r) return {sets:s?+s[1]:3, r1:r?+r[1]:null, r2:(r&&r[2])?+r[2]:null,
                   txt:[s&&s[0],r&&r[0]].filter(Boolean).join(" ")};
  return null;
}

function parseLinea(linea){
  const orig=linea;
  const ser=extraeSeries(linea);
  if(!ser) return null;

  let resto=linea;
  if(ser.txt) resto=resto.replace(ser.txt,"  ");

  const nota=[];
  const rir=RE_RIR.exec(orig);
  if(rir){ nota.push("RIR "+rir[1]+(rir[2]?"-"+rir[2]:"")); resto=resto.replace(rir[0]," "); }
  let rest=null;
  const de=RE_DESC.exec(orig);
  if(de){ const v=+de[1], u=(de[2]||"s").toLowerCase();
    rest=(u[0]==="m"||u==="'")?v*60:v;
    if(rest<10||rest>900) rest=null;
    resto=resto.replace(de[0]," "); }
  const pe=RE_PESO.exec(resto);
  if(pe){ nota.push(pe[0].trim()); resto=resto.replace(pe[0]," "); }
  const la=RE_LADO.exec(resto);
  if(la){ nota.push("por lado"); resto=resto.replace(la[0]," "); }
  else if(RE_LADO.test(orig)) nota.push("por lado");

  /* paréntesis y lo que va tras un separador fuerte son notas */
  const par=resto.match(/\(([^)]{2,80})\)/);
  if(par){ nota.push(par[1].trim()); resto=resto.replace(par[0]," "); }

  let bossMarcado=false;
  if(/\bBOSS\b/i.test(resto)){ bossMarcado=true; resto=resto.replace(/\bBOSS\b/ig," "); }

  let nombre=limpiaNombre(resto);
  /* si quedó un separador con cola, la cola es nota */
  const corte=nombre.match(/^(.{3,}?)\s*[—·|]\s*(.{2,})$/);
  if(corte){ nombre=corte[1].trim(); nota.push(corte[2].trim()); }
  nombre=limpiaNombre(nombre);
  if(nombre.length<3) return null;

  const reps = ser.r1==null ? "" : (ser.r2?ser.r1+"-"+ser.r2:String(ser.r1));
  return {
    n:nombre,
    s:ser.sets+(reps?"×"+reps:" series"),
    sets:ser.sets, r1:ser.r1, r2:ser.r2,
    note:nota.map(x=>String(x).replace(/^[\s·|—–-]+/,"").replace(/[\s·|—–-]+$/,"")).filter(Boolean).join(" · "),
    rest:rest,
    bossMarcado:bossMarcado,
    orig:orig.trim()
  };
}

const COLORES=["#3b82f6","#f97316","#22c55e","#ef4444","#a855f7","#06b6d4","#ec4899","#f59e0b"];

/* Encabezados de columna que quedan sueltos al copiar una tabla */
const PALABRAS_TABLA=/^\s*(?:#|n[°º]|num(?:ero)?|ejercicios?|exercises?|series\s*[x×]\s*reps?|series|sets|reps?|repeticiones|descanso|rest|peso|carga|nota[s]?|m[uú]sculo|c[oó]mo\s+queda|semana|tempo|rir)\s*$/i;
const NUM_SUELTO=/^\s*~?\d{1,2}\s*$/;

/* ¿la línea es SOLO una celda de series/reps? ("4×6-10", "3×8-12 por lado", "3 rondas") */
function esCeldaSeries(l){
  const t=String(l).trim();
  if(!t||!/^[~\d]/.test(t)) return false;
  if(NUM_SUELTO.test(t)) return false;
  const m=RE_RONDAS.exec(t)||RE_SETS_INV.exec(t)||RE_SETS.exec(t);
  if(!m) return false;
  const letras=t.replace(m[0],"").replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,"");
  return letras.length<=10;
}
function esRelleno(l){
  const t=String(l).trim();
  return !t||NUM_SUELTO.test(t)||PALABRAS_TABLA.test(t);
}

/* Una tabla copiada deja cada celda en su propia línea:
     1 / Weighted Dip torso inclinado BOSS / 4×6-10 / RIR 1-2 · ...
   Sin esto el parser veía nombres sin series y series sin nombre, y tiraba todo. */
function esVertical(lineas){
  let celdas=0;
  lineas.forEach(l=>{ if(esCeldaSeries(l)) celdas++; });
  return celdas>=3;
}

function parseVertical(lineas,opts){
  opts=opts||{};
  const days=[], sueltas=[];
  let actual=null, nDia=0;
  const usado=new Array(lineas.length).fill(false);

  const nuevoDia=(titulo)=>{
    nDia++;
    actual={n:(titulo?limpiaNombre(titulo).toUpperCase().slice(0,60):"")||("DÍA "+nDia),
            c:COLORES[(nDia-1)%COLORES.length], stat:(nDia%2)?"STR":"AGI",
            cardio:opts.cardio||"", ex:[]};
    days.push(actual);
  };

  for(let i=0;i<lineas.length;i++){
    const t=(lineas[i]||"").trim();
    if(!t||usado[i]) continue;
    if(RE_RUIDO.test(t)||PALABRAS_TABLA.test(t)||NUM_SUELTO.test(t)){ usado[i]=true; continue; }

    if(esDia(t)&&!esCeldaSeries(t)){ usado[i]=true; nuevoDia(t); continue; }

    if(esCeldaSeries(t)){
      /* nombre: la línea útil más cercana hacia atrás */
      let j=i-1, nombre=null;
      while(j>=0){
        const p=(lineas[j]||"").trim();
        if(!usado[j]&&p&&!esRelleno(p)&&!esDia(p)&&!esCeldaSeries(p)){ nombre=p; usado[j]=true; break; }
        if(esDia(p)||esCeldaSeries(p)) break;
        j--;
      }
      usado[i]=true;
      if(!nombre){ sueltas.push({linea:t,n:i+1,tipo:"series sin nombre"}); continue; }

      /* nota: la siguiente línea, salvo que sea el nombre del ejercicio siguiente */
      let nota="";
      const n1=(lineas[i+1]||"").trim();
      if(n1&&!esRelleno(n1)&&!esDia(n1)&&!esCeldaSeries(n1)){
        let k=i+2;
        while(k<lineas.length&&esRelleno((lineas[k]||"").trim())) k++;
        const n2=(lineas[k]||"").trim();
        if(!esCeldaSeries(n2)){ nota=n1; usado[i+1]=true; }
      }

      const ex=parseLinea(nombre+" "+t+(nota?" ("+nota.replace(/[()]/g,"")+")":""));
      if(!ex){ sueltas.push({linea:nombre+" "+t,n:i+1,tipo:"no pude leer las series"}); continue; }
      if(!actual) nuevoDia(null);
      ex.boss=ex.bossMarcado||actual.ex.length===0;
      actual.ex.push(ex);
      continue;
    }
  }

  /* nada más se convierte en ejercicio: en modo tabla, la prosa con números
     (p. ej. "mete 3×10-15 de pantorrilla al final") es texto, no una fila */
  lineas.forEach((l,i)=>{
    const t=(l||"").trim();
    if(t&&!usado[i]&&!RE_RUIDO.test(t)&&!esRelleno(t)&&!esDia(t))
      sueltas.push({linea:t,n:i+1,tipo:RE_SETS.test(t)?"texto con números":"texto"});
  });
  sueltas.sort((a,b)=>a.n-b.n);
  return {days:days.filter(d=>d.ex.length),sueltas:sueltas,
          vacios:days.filter(d=>!d.ex.length).map(d=>d.n),vertical:true};
}

function parseRutina(texto,opts){
  opts=opts||{};
  const lineas=String(texto||"").split(/\r?\n/);

  if(esVertical(lineas)){
    const v=parseVertical(lineas,opts);
    return {days:v.days,sueltas:v.sueltas,vacios:v.vacios,vertical:true,
      stats:{dias:v.days.length,
        ejercicios:v.days.reduce((a,d)=>a+d.ex.length,0),
        series:v.days.reduce((a,d)=>a+d.ex.reduce((b,e)=>b+(e.sets||0),0),0),
        lineas:lineas.filter(l=>l.trim()).length,
        sinParsear:v.sueltas.length}};
  }

  const days=[], sueltas=[];
  let actual=null, nDia=0;

  lineas.forEach((raw,idx)=>{
    const t=raw.trim();
    if(!t) return;
    if(RE_RUIDO.test(t)||RE_ENCABEZADO_TABLA.test(t)) return;

    /* filas de tabla: "Press banca | 4 | 8-10" */
    let linea=t;
    if(/[|\t]/.test(t)&&!RE_SETS.test(t)){
      const cel=t.split(/\s*[|\t]\s*/).filter(Boolean);
      if(cel.length>=2){
        const nom=cel[0];
        const nums=cel.slice(1).join(" x ");
        if(/\d/.test(nums)) linea=nom+" "+nums;
      }
    }

    if(esDia(linea)){
      nDia++;
      actual={n:limpiaNombre(linea).toUpperCase().slice(0,60)||("DÍA "+nDia),
              c:COLORES[(nDia-1)%COLORES.length],
              stat:(nDia%2)?"STR":"AGI",
              cardio:opts.cardio||"", ex:[]};
      days.push(actual);
      return;
    }

    const ex=parseLinea(linea);
    if(ex){
      if(!actual){
        nDia++;
        actual={n:"DÍA "+nDia,c:COLORES[0],stat:"STR",cardio:opts.cardio||"",ex:[]};
        days.push(actual);
      }
      ex.boss=ex.bossMarcado||actual.ex.length===0;
      actual.ex.push(ex);
    } else {
      sueltas.push({linea:t,n:idx+1});
    }
  });

  /* días vacíos: el encabezado se detectó pero no traía ejercicios */
  const vacios=days.filter(d=>!d.ex.length).map(d=>d.n);
  const limpios=days.filter(d=>d.ex.length);

  return {
    days:limpios,
    sueltas:sueltas,
    vacios:vacios,
    vertical:false,
    stats:{
      dias:limpios.length,
      ejercicios:limpios.reduce((a,d)=>a+d.ex.length,0),
      series:limpios.reduce((a,d)=>a+d.ex.reduce((b,e)=>b+(e.sets||0),0),0),
      lineas:lineas.filter(l=>l.trim()).length,
      sinParsear:sueltas.length
    }
  };
}

/* Sin esto, "peso muerto rumano" emparejaba con "Peso Muerto Convencional":
   comparten las dos palabras del principio y la que los distingue estaba en otro idioma. */
const SINONIMOS={
  "peso":"deadlift","muerto":"deadlift","rumano":"romanian","rumana":"romanian",
  "sentadilla":"squat","sentadillas":"squat","banca":"bench","banco":"bench",
  "jalon":"pulldown","jalones":"pulldown","polea":"cable","poleas":"cable",
  "dominada":"pullup","dominadas":"pullup","pull":"pullup","up":"pullup",
  "remo":"row","prensa":"press","empuje":"press",
  "mancuerna":"dumbbell","mancuernas":"dumbbell","barra":"barbell",
  "inclinado":"incline","inclinada":"incline","declinado":"decline",
  "femoral":"curl","bicep":"curl","biceps":"curl","tricep":"triceps","tríceps":"triceps",
  "elevacion":"raise","elevaciones":"raise","talones":"calf","pantorrilla":"calf",
  "fondos":"dip","fondo":"dip","aperturas":"fly","cruce":"fly","cruces":"fly",
  "gluteo":"glute","gluteos":"glute","cadera":"hip","empujes":"thrust",
  "abdominal":"core","abdominales":"core","plancha":"plank",
  "hombro":"shoulder","hombros":"shoulder","militar":"overhead",
  "extension":"extension","flexiones":"pushup","lagartijas":"pushup",
  "bulgara":"bulgarian","zancada":"lunge","zancadas":"lunge","split":"bulgarian"
};
function tokens(s){
  return NORM(s).split(" ").filter(w=>w.length>2).map(w=>SINONIMOS[w]||w);
}

/* Calificadores mutuamente excluyentes. Si el nombre escrito y el candidato traen
   uno distinto del MISMO grupo, no son el mismo ejercicio por más palabras que
   compartan. Sin esto, "Press declinado con mancuernas" emparejaba con
   "Press Inclinado con Mancuernas" y heredaba un record que nunca existió. */
const GRUPOS_EXCLUYENTES=[
  ["incline","inclinado","inclinada","decline","declinado","declinada","plano","flat"],
  ["sentado","seated","pie","standing","tumbado","lying","acostado","arrodillado","kneeling"],
  ["barbell","dumbbell","cable","maquina","machine","banda","band","kettlebell","smith"],
  ["ancho","wide","cerrado","close","neutro","neutral","supino","prono"],
  ["romanian","convencional","conventional","sumo","rumano"],
  ["frontal","front","trasera","back","nuca"],
  ["unilateral","bilateral"]
];
const EQUIV={inclinado:"incline",inclinada:"incline",declinado:"decline",declinada:"decline",
  plano:"flat",sentado:"seated",pie:"standing",tumbado:"lying",acostado:"lying",
  arrodillado:"kneeling",ancho:"wide",cerrado:"close",neutro:"neutral",rumano:"romanian",
  convencional:"conventional",frontal:"front",trasera:"back"};
function calificadores(ws){
  const out={};
  ws.forEach(w=>{
    const v=EQUIV[w]||w;
    GRUPOS_EXCLUYENTES.forEach((g,gi)=>{
      if(g.indexOf(w)>=0||g.indexOf(v)>=0) (out[gi]=out[gi]||{})[v]=1;
    });
  });
  return out;
}
function chocan(a,b){
  const ca=calificadores(a), cb=calificadores(b);
  for(const gi in ca){
    if(!cb[gi]) continue;
    const ka=Object.keys(ca[gi]), kb=Object.keys(cb[gi]);
    if(!ka.some(x=>kb.indexOf(x)>=0)) return true;   // mismo grupo, valores distintos
  }
  return false;
}

/* Empareja el nombre escrito a mano con la base, para heredar técnica y descanso.
   Puntaje por palabras compartidas; sin match si no llega al umbral. */
function emparejar(nombre,DB){
  const a=tokens(nombre);
  if(!a.length) return null;
  let mejor=null,mejorP=0;
  const aCrudo=NORM(nombre).split(" ").filter(w=>w.length>2);
  DB.forEach(x=>{
    const b=tokens(x.n);
    if(!b.length) return;
    if(chocan(aCrudo,NORM(x.n).split(" ").filter(w=>w.length>2))) return;
    let hit=0;
    a.forEach(w=>{ if(b.some(y=>y===w||y.indexOf(w)===0||w.indexOf(y)===0)) hit++; });
    const p=hit/Math.max(a.length,b.length);
    if(p>mejorP){ mejorP=p; mejor=x; }
  });
  return mejorP>=0.5?{ex:mejor,score:mejorP}:null;
}

/* ============================================================
   v8 · semáforo de dolor (capa 4)
   Modelo de monitoreo de dolor tipo Silbernagel. Viene de rehabilitación de
   tendinopatía; extenderlo a dolor articular general es una analogía razonable
   y de uso común, pero NO está validado para eso. Se etiqueta como tal.
   ============================================================ */
function zonasActivas(){ return zonasMarcadas(S.pain); }
function diaTocaZona(d){
  const mk=zonasActivas(); if(!mk.length||!d) return null;
  for(let i=0;i<mk.length;i++){
    const hay=d.ex.some(e=>{ const src=GENDB.find(x=>x.n===e.n); return src&&(src.stress[mk[i].zona]||0)>=1; });
    if(hay) return mk[i].zona;
  }
  return null;
}
function semaforo(zona){
  const log=(S.painLog||[]).filter(x=>x.z===zona).slice(-8);
  if(!log.length) return {estado:"sin",txt:"Sin registros todavía."};
  const u=log[log.length-1];
  const base=log.length>1?Math.min.apply(null,log.map(x=>x.man)):u.man;
  const prev=log.length>1?log[log.length-2]:null;
  if(prev&&u.dur>prev.dur+1)
    return {estado:"rojo",txt:"El dolor subió de una sesión a la siguiente ("+prev.dur+" → "+u.dur+
      "). Toca sustituir por la variante de menor carga en esa articulación.",accion:"sustituir"};
  if(u.dur>5||u.man>base+1)
    return {estado:"ambar",txt:"Dolor "+u.dur+"/10 durante"+(u.man>base+1?" y no volvió a tu línea base al día siguiente":"")+
      ". Baja ~10% la carga de ese patrón la próxima sesión.",accion:"bajar"};
  const verdes=log.slice(-3).filter(x=>x.dur<=5&&x.man<=base+1).length;
  if(verdes>=2&&log.length>=2)
    return {estado:"verde",txt:"Verde "+verdes+" sesiones seguidas. Si llegas a 2-3 semanas así, puedes subir carga "+
      "o pasar a la variante de más rango.",accion:"subir"};
  return {estado:"verde",txt:"Dentro de rango ("+u.dur+"/10 durante, "+u.man+"/10 al día siguiente)."};
}
function pedirDolor(zona){
  const dur=prompt("Dolor DURANTE la sesión en "+ZONA_ES[zona].toLowerCase()+" (0-10):","");
  if(dur===null) return;
  const man=prompt("¿Y cómo amaneciste? Dolor a la mañana siguiente (0-10):","");
  if(man===null) return;
  const d=Math.max(0,Math.min(10,parseInt(dur,10)||0));
  const m=Math.max(0,Math.min(10,parseInt(man,10)||0));
  S.painLog=(S.painLog||[]).concat([{d:today(),z:zona,dur:d,man:m}]).slice(-200);
  save(); render();
  const sem=semaforo(zona);
  toast(sem.estado==="rojo"?"🔴 "+ZONA_ES[zona].toUpperCase():
        sem.estado==="ambar"?"🟠 "+ZONA_ES[zona].toUpperCase():"🟢 "+ZONA_ES[zona].toUpperCase());
}
function renderPain(){
  let h='<div class="gtit">SEMÁFORO DE DOLOR</div>';
  h+='<div class="disc">Modelo de monitoreo de dolor adaptado de la rehabilitación de tendinopatía. '+
     'Se usa mucho por analogía en dolor articular, pero <b>no está validado para eso</b>. '+
     'Es una guía para decidir carga, no una medida clínica.</div>';
  const mk=zonasActivas();
  if(!mk.length) h+='<div class="muted">No tienes zonas marcadas. Márcalas en el generador.</div>';
  mk.forEach(m=>{

    h+='<div class="gsec">'+ZONA_ES[m.zona].toUpperCase()+'</div>';

    const log=(S.painLog||[]).filter(x=>x.z===m.zona).slice(-10);

      const pts2=log.map((x,i)=>(P+(i/(log.length-1))*(W-P*2)).toFixed(1)+","+(H-P-(x.man/mx)*(H-P*2)).toFixed(1)).join(" ");
      h+='<div class="grp">DURANTE (cian) · MAÑANA SIGUIENTE (ámbar)</div>'+
         '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+

      h+='<div class="mrow"><span class="k">'+esc(x.d)+'</span><span class="v">'+x.dur+' / '+x.man+'</span></div>';

}

function correrImport(){
  const txt=$("#impTxt")?$("#impTxt").value:impTexto;
  impTexto=txt;
  const card=parseInt(($("#impCardio")||{}).value,10);
  const cardio=(isFinite(card)&&card>0)?(card+" min remadora o escaleras"):"";
  let r;
  try{ r=parseRutina(txt,{cardio:cardio}); }
  catch(err){ toast("NO PUDE LEERLO: "+err.message); return; }
  if(!r.days.length){
    toast("NO ENCONTRÉ NINGÚN EJERCICIO");
    return;
  }
  /* enlaza con la base para heredar descanso y ficha de técnica */
  r.days.forEach(d=>d.ex.forEach(e=>{
    const m=emparejar(e.n,GENDB);
    if(m){ e.match=m.ex.n; e.score=m.score; if(!e.rest) e.rest=m.ex.rest; }
  }));
  impRes=r; renderImpRev();
}

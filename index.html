<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; manifest-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARISE</title>
<style>
:root{
  --bg:#05070f; --panel:#0c1222;
  --line:#1d2b47; --line2:#2a3f66;
  --cy:#4fd6ff; --vi:#8b7cff; --gd:#ffca4f;
  --tx:#e8f0ff; --dim:#7f92b5; --dim2:#54648a;
  --ok:#39d98a; --bad:#ff5f6d;
  --sf:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mn:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sf);
  min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 50% -10%,rgba(79,214,255,.10),transparent 70%),
    radial-gradient(700px 400px at 100% 100%,rgba(139,124,255,.07),transparent 70%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(79,214,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(79,214,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 78%);
}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 14px 120px}

header{padding:18px 0 10px;text-align:center;position:relative}
.brand{font-family:var(--mn);font-size:34px;letter-spacing:.42em;font-weight:700;color:var(--cy);text-indent:.42em;
  text-shadow:0 0 12px rgba(79,214,255,.55),0 0 40px rgba(79,214,255,.22)}
.brand span{color:var(--vi);text-shadow:0 0 12px rgba(139,124,255,.6)}
.sub{font-family:var(--mn);font-size:9.5px;letter-spacing:.34em;color:var(--dim2);margin-top:5px;text-indent:.34em}
.vtag{position:absolute;top:20px;right:2px;font-family:var(--mn);font-size:9px;color:var(--dim2);
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:rgba(12,18,34,.7)}

.hcard{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--panel),rgba(8,12,24,.85));
  padding:14px;margin:6px 0 12px;position:relative;overflow:hidden}
.hrow{display:flex;align-items:center;gap:13px}
.sigil{width:62px;height:62px;flex:0 0 62px;border-radius:12px;border:1px solid var(--line2);
  background:radial-gradient(circle at 50% 40%,rgba(79,214,255,.16),rgba(5,7,15,.9) 70%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:border-color .4s,box-shadow .4s}
.sigil svg{width:40px;height:40px}
.sigil img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
#rankvid{position:fixed;inset:0;z-index:105;display:none;align-items:center;justify-content:center;background:#000}
#rankvid.on{display:flex;animation:fade .3s ease}
#rankvid video{max-width:100%;max-height:100%;height:100%;object-fit:contain;background:#000}
#rankvid button{position:absolute;bottom:24px;right:18px;z-index:2;cursor:pointer;color:#fff;
  font-family:var(--mn);font-size:10px;letter-spacing:.14em;padding:9px 15px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.4);border-radius:7px}
#rankvid button:active{transform:scale(.96)}
.hmeta{flex:1;min-width:0}
.hname{font-family:var(--mn);font-size:12px;letter-spacing:.16em;color:var(--dim)}
.hlvl{display:flex;align-items:baseline;gap:9px;margin-top:1px}
.hlvl b{font-family:var(--mn);font-size:25px;letter-spacing:.05em;color:var(--tx);line-height:1.1}
.rank{font-family:var(--mn);font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:5px;border:1px solid currentColor}
.rtitle{font-size:10.5px;color:var(--dim2);margin-top:3px;font-style:italic}
.bar{height:7px;border-radius:4px;background:#0a1120;border:1px solid var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));
  box-shadow:0 0 12px rgba(79,214,255,.6);transition:width .55s cubic-bezier(.2,.9,.25,1)}
.xprow{display:flex;justify-content:space-between;font-family:var(--mn);font-size:9.5px;color:var(--dim2);margin-top:5px}

nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
nav button{font-family:var(--mn);font-size:9px;letter-spacing:.08em;padding:10px 1px;border-radius:9px;
  border:1px solid var(--line);background:rgba(12,18,34,.75);color:var(--dim);cursor:pointer;transition:.18s}
nav button.on{color:var(--cy);border-color:rgba(79,214,255,.55);background:rgba(79,214,255,.1)}

.days{display:grid;gap:6px;margin-bottom:12px}
.days button{font-family:var(--mn);font-size:11px;font-weight:700;padding:11px 0;border-radius:9px;
  border:1px solid var(--line);background:rgba(12,18,34,.75);color:var(--dim2);cursor:pointer;position:relative;transition:.18s}
.days button.on{color:#fff;border-color:var(--dc);background:color-mix(in srgb,var(--dc) 15%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--dc) 30%,transparent)}
.days button.done::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 7px var(--ok)}

.quest{border:1px solid var(--line);border-radius:14px;background:linear-gradient(170deg,var(--panel),rgba(8,12,24,.8));overflow:hidden}
.qhead{padding:13px 14px;border-bottom:1px solid var(--line);border-left:3px solid var(--dc);position:relative}
.qtag{font-family:var(--mn);font-size:9px;letter-spacing:.28em;color:var(--dc)}
.qname{font-size:16px;font-weight:800;letter-spacing:.03em;margin-top:2px;padding-right:44px}
.qsub{font-family:var(--mn);font-size:9.5px;color:var(--dim2);margin-top:4px;letter-spacing:.1em}
.qprog{position:absolute;right:14px;top:15px;font-family:var(--mn);font-size:11px;color:var(--dim)}

.ex{padding:11px 13px;border-bottom:1px solid rgba(29,43,71,.55);display:flex;gap:11px;align-items:flex-start}
.ex:last-child{border-bottom:none}
.ex.cardio{background:rgba(79,214,255,.045)}
.ex.done .exn{color:var(--dim2);text-decoration:line-through;text-decoration-color:rgba(127,146,181,.5)}
.chk{width:26px;height:26px;flex:0 0 26px;border-radius:7px;border:1.5px solid var(--line2);background:rgba(5,7,15,.6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;margin-top:1px}
.chk.on{background:var(--dc);border-color:var(--dc);box-shadow:0 0 14px color-mix(in srgb,var(--dc) 55%,transparent)}
.chk svg{width:14px;height:14px;stroke:#04070f;stroke-width:3.4;fill:none;opacity:0;transition:.16s}
.chk.on svg{opacity:1}
.exb{flex:1;min-width:0}
.exn{font-size:14px;font-weight:650;line-height:1.28}
.exs{font-family:var(--mn);font-size:10.5px;color:var(--dim);margin-top:3px}
.exnote{font-family:var(--mn);font-size:9.5px;color:var(--dim2);margin-top:3px;line-height:1.45;
  padding-left:7px;border-left:2px solid var(--line2)}
.proto{display:grid;gap:7px}
.proto div{display:flex;gap:8px;align-items:baseline}
.prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(29,43,71,.5)}
.prow:last-child{border-bottom:none}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:0 0 9px}
.prow.on .pdot{background:var(--cy);box-shadow:0 0 9px var(--cy)}
.prow .pn{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.on .pn{color:var(--cy);font-weight:650}
.info{width:24px;height:24px;flex:0 0 24px;border-radius:6px;border:1px solid var(--line2);
  background:rgba(12,18,34,.7);color:var(--dim);font-family:var(--mn);font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:2px;padding:0}
.info.on{color:var(--cy);border-color:rgba(79,214,255,.5);background:rgba(79,214,255,.1)}
.tech{margin-top:9px;border:1px solid var(--line);border-radius:9px;background:rgba(5,7,15,.55);padding:10px 11px}
.tech .tm{font-family:var(--mn);font-size:9px;letter-spacing:.14em;color:var(--cy);margin-bottom:7px}
.tech ol{margin:0;padding-left:17px}
.tech li{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:4px}
.tech .attr{font-family:var(--mn);font-size:8.5px;color:var(--dim2);margin-top:8px}
.proto b{font-family:var(--mn);font-size:8.5px;letter-spacing:.14em;color:var(--dim2);flex:0 0 74px}
.proto span{font-size:12px;color:var(--dim);line-height:1.45}
.boss{display:inline-block;font-family:var(--mn);font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--gd);
  border:1px solid rgba(255,202,79,.5);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:1px;background:rgba(255,202,79,.09)}
.inputs{display:flex;gap:7px;margin-top:8px}
.fld{flex:1;position:relative}
.fld label{position:absolute;top:-6px;left:8px;font-family:var(--mn);font-size:8px;letter-spacing:.14em;
  color:var(--dim2);background:var(--panel);padding:0 4px}
.fld input{width:100%;background:rgba(5,7,15,.65);border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font-family:var(--mn);font-size:13px;padding:8px 9px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(79,214,255,.15)}
.fld input.saved{border-color:var(--ok)!important;box-shadow:0 0 0 2px rgba(57,217,138,.2)!important}
.fld input.pr{border-color:var(--gd)!important;box-shadow:0 0 0 2px rgba(255,202,79,.28)!important}
.prbadge{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-family:var(--mn);font-size:8px;
  font-weight:700;letter-spacing:.1em;color:var(--gd);pointer-events:none}
.last{font-family:var(--mn);font-size:9px;color:var(--dim2);margin-top:5px}

.pnl{border:1px solid var(--line);border-radius:13px;background:linear-gradient(170deg,var(--panel),rgba(8,12,24,.8));padding:14px;margin-bottom:12px}
.ptit{font-family:var(--mn);font-size:10px;letter-spacing:.26em;color:var(--cy);margin-bottom:11px}
.ptit.v{color:var(--vi)}.ptit.g{color:var(--gd)}
.muted{font-size:12.5px;color:var(--dim);line-height:1.55}
.btn{font-family:var(--mn);font-size:11px;letter-spacing:.12em;padding:11px 12px;border-radius:9px;
  border:1px solid var(--line2);background:rgba(79,214,255,.08);color:var(--cy);cursor:pointer;transition:.16s;width:100%}
.btn:active{transform:scale(.985)}
.btn.g{background:rgba(57,217,138,.1);border-color:rgba(57,217,138,.45);color:var(--ok)}
.btn.r{background:rgba(255,95,109,.09);border-color:rgba(255,95,109,.4);color:var(--bad)}
.btn.gh{background:transparent;color:var(--dim)}
.btn.sm{padding:8px 6px;font-size:10px}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.brow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
textarea{width:100%;background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-family:var(--mn);font-size:10.5px;padding:10px;min-height:96px;outline:none;resize:vertical}
.note{font-size:11px;color:var(--dim2);margin-top:8px;line-height:1.5}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mgrid.f{grid-template-columns:1fr}
.mf{position:relative;margin-top:6px}
.mf label{position:absolute;top:-6px;left:8px;font-family:var(--mn);font-size:8px;letter-spacing:.13em;
  color:var(--dim2);background:var(--panel);padding:0 4px}
.mf input{width:100%;background:rgba(5,7,15,.65);border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font-family:var(--mn);font-size:15px;padding:11px 9px;outline:none}
.mf input:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(79,214,255,.15)}
.grp{font-family:var(--mn);font-size:9px;letter-spacing:.22em;color:var(--dim2);margin:14px 0 2px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(29,43,71,.5)}
.mrow:last-child{border-bottom:none}
.mrow .k{font-size:12.5px;color:var(--dim);padding-right:8px}
.mrow .v{font-family:var(--mn);font-size:13.5px;white-space:nowrap}
.dlt{font-family:var(--mn);font-size:10.5px;margin-left:7px}
.up{color:var(--ok)}.dn{color:var(--bad)}.eq{color:var(--dim2)}
.alert{border:1px solid rgba(255,202,79,.4);background:rgba(255,202,79,.08);border-radius:10px;padding:11px 12px;
  font-size:12.5px;color:#ffe0a3;line-height:1.5;margin-bottom:11px}
.alert.bad{border-color:rgba(255,95,109,.4);background:rgba(255,95,109,.08);color:#ffc2c7}
.alert.ok{border-color:rgba(57,217,138,.4);background:rgba(57,217,138,.08);color:#b6f2d4}
.entry{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;background:rgba(5,7,15,.4)}
.entry h4{margin:0 0 7px;font-family:var(--mn);font-size:11px;letter-spacing:.14em;color:var(--cy);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{font-family:var(--mn);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 7px}
.spark{width:100%;height:52px;display:block;margin-top:6px}

/* ---------- editor ---------- */
.dayed{border:1px solid var(--line);border-left:3px solid var(--dc);border-radius:11px;padding:12px;margin-bottom:10px;background:rgba(5,7,15,.42)}
.dhead{display:flex;gap:6px;align-items:center;margin-bottom:9px}
.dhead .num{font-family:var(--mn);font-size:10px;color:var(--dc);letter-spacing:.14em;flex:0 0 auto}
.mini{width:28px;height:28px;flex:0 0 28px;border-radius:7px;border:1px solid var(--line2);background:rgba(12,18,34,.8);
  color:var(--dim);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mini:active{transform:scale(.92)}
.mini.dz{color:var(--bad);border-color:rgba(255,95,109,.35)}
.mini.on{color:var(--gd);border-color:rgba(255,202,79,.55);background:rgba(255,202,79,.12)}
.ein{width:100%;background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:7px;color:var(--tx);
  font-family:var(--sf);font-size:13.5px;padding:8px 9px;outline:none}
.ein:focus{border-color:var(--cy)}
.ein.sm{font-family:var(--mn);font-size:11px;color:var(--dim);padding:7px 9px}
.ein.saved{border-color:var(--ok)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
.exed{display:flex;gap:6px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(29,43,71,.45)}
.exed:last-child{border-bottom:none}
.exed .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.exed .side{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.selbox{background:rgba(5,7,15,.7);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font-family:var(--mn);font-size:11px;padding:8px;outline:none}

#lvup{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,10,.93);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#lvup.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lvbox{text-align:center;padding:26px;animation:pop .65s cubic-bezier(.15,1.2,.35,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.lvbox .t1{font-family:var(--mn);font-size:11px;letter-spacing:.5em;color:var(--cy);text-indent:.5em}
.lvbox .t2{font-family:var(--mn);font-size:54px;font-weight:800;color:#fff;margin:8px 0;
  text-shadow:0 0 22px rgba(79,214,255,.85),0 0 60px rgba(139,124,255,.5)}
.lvbox .t3{font-size:14px;color:var(--dim);letter-spacing:.1em}
.rings{position:absolute;width:300px;height:300px;pointer-events:none}
.rings i{position:absolute;inset:0;border:1px solid rgba(79,214,255,.4);border-radius:50%;animation:rip 2.1s ease-out infinite}
.rings i:nth-child(2){animation-delay:.6s}.rings i:nth-child(3){animation-delay:1.2s}
@keyframes rip{from{transform:scale(.35);opacity:.85}to{transform:scale(1.35);opacity:0}}

/* ---------- timer de descanso ---------- */
#restbar{position:relative;border:1px solid rgba(79,214,255,.45);border-radius:12px;
  background:linear-gradient(160deg,rgba(12,24,42,.97),rgba(8,12,24,.95));
  padding:10px 12px;margin:0 0 12px;display:flex;align-items:center;gap:10px;overflow:hidden;
  box-shadow:0 0 22px rgba(79,214,255,.15)}
#restbar.hide{display:none}
#restbar>i{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cy),var(--vi));
  box-shadow:0 0 10px rgba(79,214,255,.7);transition:width .22s linear}
#restbar.low{border-color:rgba(255,202,79,.6)}
#restbar.low>i{background:linear-gradient(90deg,var(--gd),#ff8a4f)}
.rbl{flex:1;min-width:0}
#rbname{display:block;font-family:var(--mn);font-size:9px;letter-spacing:.16em;color:var(--dim2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rbtime{font-family:var(--mn);font-size:23px;font-weight:700;color:var(--cy);letter-spacing:.04em;line-height:1.15}
#restbar.low #rbtime{color:var(--gd)}
.rbb{font-family:var(--mn);font-size:10px;letter-spacing:.1em;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line2);background:rgba(79,214,255,.08);color:var(--cy);cursor:pointer;flex:0 0 auto}
.rbb.gh{background:transparent;color:var(--dim)}
.rbb:active{transform:scale(.94)}
#wakedot{position:absolute;top:22px;left:2px;font-family:var(--mn);font-size:8px;letter-spacing:.1em;
  color:var(--ok);border:1px solid rgba(57,217,138,.4);border-radius:4px;padding:2px 5px;
  background:rgba(57,217,138,.08)}
#wakedot.hide{display:none}

/* ---------- pop de PR ---------- */
#prpop{position:fixed;left:50%;top:22%;transform:translate(-50%,-14px) scale(.86);z-index:130;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .38s cubic-bezier(.15,1.35,.4,1);
  text-align:center;max-width:90vw}
#prpop.on{opacity:1;transform:translate(-50%,0) scale(1)}
#prpop .box{border:1px solid rgba(255,202,79,.65);border-radius:16px;padding:18px 26px;
  background:linear-gradient(160deg,rgba(38,28,6,.97),rgba(12,9,2,.96));
  box-shadow:0 0 50px rgba(255,202,79,.4),0 14px 44px rgba(0,0,0,.65)}
#prpop .t1{font-family:var(--mn);font-size:10px;letter-spacing:.44em;color:var(--gd);text-indent:.44em}
#prpop .t2{font-family:var(--mn);font-size:38px;font-weight:800;color:#fff;margin:6px 0 2px;
  text-shadow:0 0 20px rgba(255,202,79,.9)}
#prpop .t3{font-size:12.5px;color:#ffe0a3;max-width:250px;margin:0 auto;line-height:1.35}
#prpop .rays{position:absolute;inset:-30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,202,79,.22),transparent 68%);animation:prb .9s ease-out}
@keyframes prb{from{transform:scale(.4);opacity:1}to{transform:scale(1.25);opacity:0}}

/* ---------- última carga ---------- */
.prev{font-family:var(--mn);font-size:9.5px;color:var(--gd);margin-top:5px;opacity:.85}
.restchip{font-family:var(--mn);font-size:8px;letter-spacing:.1em;color:var(--dim2);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}

};
function priorRecord(map,name){
  if(map[name]!==undefined) return map[name];
  const alts=ALIAS[name]||[];
  for(let i=0;i<alts.length;i++) if(map[alts[i]]!==undefined) return map[alts[i]];

}

/* ---------- etapa 2: derivar ---------- */
const MEV={novato:8,intermedio:9,avanzado:11};
const MAV=20;
const PISO_DEFICIT=10;          // piso duro en objetivo grasa

function nivelDe(anios){ const a=+anios||0; return a<1?"novato":a<4?"intermedio":"avanzado"; }
function factorEdad(edad){
  const e=+edad||30;
  if(e<40) return 1.0;
  if(e<50) return 0.95;
  if(e<60) return 0.90;
  return 0.85;
}
function derivar(inp){
  const nivel=nivelDe(inp.anios);
  const alturaCm=(+inp.altura||0)>3?(+inp.altura):((+inp.altura||0)*100);
  const ratio=(inp.cintura&&alturaCm)?(+inp.cintura)/alturaCm:null;
  const avisos=[];
  if(ratio!==null&&ratio>0.53&&inp.objetivo==="masa"){
    avisos.push({tipo:"objetivo",nivel:"pregunta",
      txt:"Tu índice cintura/estatura es "+ratio.toFixed(3)+" (>0.53). ¿Seguro que el objetivo es masa? "+
          "Puede convenir un corte primero. Es una señal, no un veredicto: el índice no distingue grasa "+
          "visceral de estructura ancha. Coméntalo con quien te lleva la dieta."});
  }
  if(factorEdad(inp.edad)<1){
    avisos.push({tipo:"edad",nivel:"info",
      txt:"Ajuste conservador de recuperación por edad (×"+factorEdad(inp.edad).toFixed(2)+"). "+
          "No es capacidad reducida: la evidencia no muestra que la edad baje sustancialmente la respuesta "+
          "hipertrófica. Es margen, y se puede subir si te recuperas bien."});
  }
  return {nivel,ratio,alturaCm,factorEdad:factorEdad(inp.edad),avisos};
}

/* ---------- etapa 3: presupuesto de series ---------- */
function presupuesto(inp,der){
  const base=MEV[der.nivel];
  const fe=der.factorEdad;
  const prio=(inp.prioridad||[]).slice(0,2);
  const obj=inp.objetivo||"masa";
  const target={};
  MUS_AUDIT.forEach(m=>{
    let v=base*fe;
    if(prio.indexOf(m)>=0) v*=1.35;
    else if(prio.length) v*=0.80;                 // mantenimiento para que cuadre
    if(obj==="grasa") v=Math.max(v,PISO_DEFICIT); // piso duro, no negociable
    target[m]=Math.round(Math.min(v,MAV)*10)/10;
  });
  return {porMusculo:target,mev:base,mav:MAV,piso:obj==="grasa"?PISO_DEFICIT:null,prio:prio,objetivo:obj};
}

/* tiempo real de una serie, con su descanso */
function segSerie(ex){ return (ex.reps[1]*3+15)+ex.rest; }
const SEG_TRANSICION=45;

function segSesion(dia){
  let s=0;
  dia.ex.forEach(e=>{ s+=e.sets*segSerie(e.src)+SEG_TRANSICION; });
  return s;
}
function presupuestoSesionSeg(inp){
  const min=+inp.minutos||60, cardio=+inp.cardio||0;
  return Math.max(300,(min-cardio)*60);
}

/* ---------- módulo de dolor: capas 1-3 ---------- */
function bloqueoDuro(dolor){
  const f=(dolor&&dolor.banderas)||{};
  const activas=BANDERAS.filter(b=>f[b.k]).map(b=>b.t);
  return activas.length?activas:null;
}
/* severidad → stress máximo tolerado en esa zona */
function maxStress(sev){ return sev>=3?1:2; }

function zonasMarcadas(dolor){
  const z=(dolor&&dolor.zonas)||{};
  return ZONAS.filter(k=>z[k]&&+z[k].sev>0).map(k=>({zona:k,sev:+z[k].sev}));
}
function pasaDolor(ex,marcadas){
  for(let i=0;i<marcadas.length;i++){
    const m=marcadas[i];
    if((ex.stress[m.zona]||0)>maxStress(m.sev)) return false;
  }
  return true;
}

/* ---------- etapa 5: selección ---------- */
function tieneEquipo(ex,eq){
  if(!eq||!eq.length) return true;
  return ex.eq.every(e=>eq.indexOf(e)>=0);
}
function excluido(ex,inp){
  const ex_ids=(inp.excluir||[]);
  if(ex_ids.indexOf(ex.id)>=0) return true;
  const tagsNo=(inp.excluirTags||[]);
  return ex.tags.some(t=>tagsNo.indexOf(t)>=0);
}

function candidatos(DB,inp,marcadas){
  return DB.filter(ex=>tieneEquipo(ex,inp.equipo)&&!excluido(ex,inp)&&pasaDolor(ex,marcadas));
}

/* sustituto para un ejercicio que no pasa el filtro de dolor:
   mismo patrón y mismo músculo primario, el de menor stress en la zona.
   Nunca elimina el patrón. */
function sustituir(DB,ex,inp,marcadas){
  const mismo=DB.filter(c=>c.pat===ex.pat&&c.m===ex.m&&c.id!==ex.id&&
                        tieneEquipo(c,inp.equipo)&&!excluido(c,inp)&&pasaDolor(c,marcadas));
  if(mismo.length) return ordenarPorStress(mismo,marcadas)[0];
  const patron=DB.filter(c=>c.pat===ex.pat&&c.id!==ex.id&&
                        tieneEquipo(c,inp.equipo)&&!excluido(c,inp)&&pasaDolor(c,marcadas));
  if(patron.length) return ordenarPorStress(patron,marcadas)[0];
  return null;
}
function ordenarPorStress(list,marcadas){
  return list.slice().sort((a,b)=>{
    const sa=marcadas.reduce((s,m)=>s+(a.stress[m.zona]||0),0);
    const sb=marcadas.reduce((s,m)=>s+(b.stress[m.zona]||0),0);
    if(sa!==sb) return sa-sb;
    return (b.estirada?1:0)-(a.estirada?1:0);
  });
}

function aporte(ex,sets){
  const o={}; o[ex.m]=sets;
  ex.syn.forEach(s=>{ o[s[0]]=(o[s[0]]||0)+sets*s[1]; });
  return o;
}

function seleccionar(DB,inp,der,pre,marcadas){
  const dias=SPLITS[inp.dias]||SPLITS[4];
  const cands=candidatos(DB,inp,marcadas);
  const deficit={}; MUS_AUDIT.forEach(m=>deficit[m]=pre.porMusculo[m]);
  const usados={};
  const out=[];

  dias.forEach((plantilla,di)=>{
    const dia={n:plantilla.n,c:plantilla.c,stat:plantilla.stat,ex:[]};
    const enSesion={};
    plantilla.pats.forEach((pat,pi)=>{
      const pool=cands.filter(c=>{
        if(c.pat!==pat) return false;
        if(dia.ex.some(x=>x.src.id===c.id)) return false;
        const setsM=(enSesion[c.m]||0);
        if(setsM>=10) return false;                       // máx ~10 series/músculo/sesión
        if(pi===0&&c.tipo!=="compuesto") return false;    // el BOSS es compuesto
        return true;
      });
      if(!pool.length) return;
      pool.sort((a,b)=>{
        const da=(deficit[a.m]||0)-(usados[a.id]||0)*2;
        const db_=(deficit[b.m]||0)-(usados[b.id]||0)*2;
        if(Math.abs(da-db_)>0.01) return db_-da;
        if(a.estirada!==b.estirada) return (b.estirada?1:0)-(a.estirada?1:0);
        return marcadas.reduce((s,m)=>s+(a.stress[m.zona]||0),0)-
               marcadas.reduce((s,m)=>s+(b.stress[m.zona]||0),0);
      });
      const pick=pool[0];
      const sets=pi===0?4:3;
      dia.ex.push({src:pick,sets:sets,boss:pi===0});
      usados[pick.id]=(usados[pick.id]||0)+1;
      enSesion[pick.m]=(enSesion[pick.m]||0)+sets;
      const ap=aporte(pick,sets);
      for(const m in ap) if(deficit[m]!==undefined) deficit[m]-=ap[m];
    });
    out.push(dia);
  });

  /* regla (e): accesorio compensatorio por zona marcada */
  marcadas.forEach(m=>{
    const musc=COMPENSA[m.zona]; if(!musc) return;
    const ya=out.some(d=>d.ex.some(x=>x.src.m===musc));
    if(ya) return;
    const acc=cands.filter(c=>c.m===musc);
    if(!acc.length) return;
    const dia=out.reduce((a,b)=>segSesion(a)<=segSesion(b)?a:b);
    dia.ex.push({src:ordenarPorStress(acc,marcadas)[0],sets:3,boss:false,compensa:m.zona});
  });
  return out;
}

/* ---------- volumen fraccional ---------- */
function volumen(dias){
  const v={}; MUS_AUDIT.forEach(m=>v[m]=0);
  dias.forEach(d=>d.ex.forEach(e=>{
    const ap=aporte(e.src,e.sets);
    for(const m in ap) if(v[m]!==undefined) v[m]+=ap[m];
  }));
  for(const m in v) v[m]=Math.round(v[m]*10)/10;
  return v;
}

/* ---------- auditoría + reasignación ---------- */
function auditar(dias,pre,inp){
  const vol=volumen(dias);
  const capSeg=presupuestoSesionSeg(inp);
  const sesiones=dias.map(d=>({n:d.n,seg:segSesion(d),cap:capSeg,ok:segSesion(d)<=capSeg,
                               series:d.ex.reduce((a,e)=>a+e.sets,0)}));
  const musculos=MUS_AUDIT.map(m=>{
    const t=pre.porMusculo[m], v=vol[m];
    let estado="ok";
    if(v<t-1.5) estado="bajo"; else if(v>MAV) estado="alto";
    return {m:m,label:MUS_ES[m],vol:v,target:t,mav:MAV,estado:estado};
  });
  return {musculos:musculos,sesiones:sesiones,
          ok:musculos.every(x=>x.estado==="ok")&&sesiones.every(s=>s.ok),
          volTotal:Math.round(dias.reduce((a,d)=>a+d.ex.reduce((b,e)=>b+e.sets,0),0))};
}

function reasignar(dias,pre,inp,DB,marcadas){
  const capSeg=presupuestoSesionSeg(inp);
  const relDef=()=>{ const v=volumen(dias),o={};
    MUS_AUDIT.forEach(m=>o[m]=(pre.porMusculo[m]-v[m])/Math.max(1,pre.porMusculo[m])); return o; };
  const patCount=d=>{ const c={}; d.ex.forEach(e=>c[e.src.pat]=(c[e.src.pat]||0)+1); return c; };

  for(let iter=0;iter<60;iter++){
    let cambio=false;

    /* 1. el tiempo manda: recorta del músculo MENOS deficitario, no del último de la lista.
       Nunca borra el único ejercicio de un patrón: eso dejaría el patrón sin cubrir
       (así es como el core se quedaba en 0). */
    dias.forEach(d=>{
      let guard=0;
      while(segSesion(d)>capSeg&&guard++<40){
        const rd=relDef();
        const cand=d.ex.filter(e=>!e.boss&&!e.compensa);
        if(!cand.length) break;
        cand.sort((a,b)=>(rd[a.src.m]||0)-(rd[b.src.m]||0));   // menos deficitario primero
        const victima=cand.find(e=>e.sets>2)||cand[0];
        if(victima.sets>2){ victima.sets--; }
        else{
          const pc=patCount(d);
          const noUnico=cand.filter(e=>pc[e.src.pat]>1);
          if(noUnico.length){
            noUnico.sort((a,b)=>(rd[a.src.m]||0)-(rd[b.src.m]||0));
            d.ex.splice(d.ex.indexOf(noUnico[0]),1);
          } else if(d.ex.length>3){
            /* el tiempo manda sobre la cobertura de patrones: si no cabe, un patrón se cae */
            d.ex.splice(d.ex.indexOf(victima),1);
          } else if(victima.sets>1){ victima.sets--; }
          else {
            const boss=d.ex.find(e=>e.boss);
            if(boss&&boss.sets>2){ boss.sets--; }
            else if(d.ex.length>1){ d.ex.splice(d.ex.indexOf(victima),1); }
            else if(boss&&boss.sets>1){ boss.sets--; }
            else break;
          }
        }
        cambio=true;
      }
    });

    /* 2. rellena mientras quede tiempo, recorriendo TODOS los déficits
       (antes cortaba tras el primero y el recorte le ganaba siempre) */
    const rd=relDef();
    const sub=MUS_AUDIT.filter(m=>rd[m]>0.12).sort((a,b)=>rd[b]-rd[a]);
    for(let i=0;i<sub.length;i++){
      const m=sub[i];
      let hecho=false;
      const orden=dias.slice().sort((a,b)=>segSesion(a)-segSesion(b));
      for(let k=0;k<orden.length&&!hecho;k++){
        const d=orden[k];
        const enSesion=d.ex.filter(e=>e.src.m===m).reduce((a,e)=>a+e.sets,0);
        if(enSesion>=10) continue;
        const cand=d.ex.filter(e=>e.src.m===m&&e.sets<5);
        for(let j=0;j<cand.length&&!hecho;j++){
          cand[j].sets++;
          if(segSesion(d)<=capSeg){ hecho=true; cambio=true; }
          else cand[j].sets--;
        }
      }
      if(hecho) continue;
    }

    /* 3. nada puede pasar de MAV */
    MUS_AUDIT.forEach(m=>{
      let guard=0;
      while(volumen(dias)[m]>MAV&&guard++<20){
        let mayor=null;
        dias.forEach(d=>d.ex.forEach(e=>{
          if(e.src.m===m&&!e.boss&&e.sets>2&&(!mayor||e.sets>mayor.sets)) mayor=e;
        }));
        if(!mayor) break;
        mayor.sets--; cambio=true;
      }
    });
    if(!cambio) break;
  }
  return dias;
}

/* ---------- etapa 6: prescripción ---------- */
function notaDe(ex,marcadas,ajuste){
  const rir=ex.rir[0]===ex.rir[1]?("RIR "+ex.rir[0]):("RIR "+ex.rir[0]+"-"+ex.rir[1]);
  const bits=[rir];
  if(ex.estirada) bits.push("carga en estiramiento");
  if(ajuste&&ajuste.rango) bits.push("rango recortado en el extremo doloroso");
  if(ajuste&&ajuste.sustituido) bits.push("sustituido por "+ZONA_ES[ajuste.zona].toLowerCase());
  if(ex.tags.indexOf("unilateral")>=0) bits.push("por lado");
  return bits.join(" · ");
}
function prescribir(dias,inp,der,marcadas){
  return dias.map((d,i)=>({
    n:d.n, c:d.c, stat:d.stat,
    cardio:(+inp.cardio>0)?((+inp.cardio)+" min remadora o escaleras"):"",
    ex:d.ex.map(e=>{
      const src=e.src;
      /* regla (c): patrón con articulación marcada va a 12-20 @ RIR 1-2 */
      const tocado=marcadas.some(m=>(src.stress[m.zona]||0)>=1);
      const reps=tocado?[12,20]:src.reps;
      const rirX=tocado?{rir:[1,2]}:{};
      const conRir=Object.assign({},src,rirX);
      return {
        n:src.n,
        s:e.sets+"×"+(reps[0]===reps[1]?reps[0]:reps[0]+"-"+reps[1]),
        boss:!!e.boss,
        note:notaDe(conRir,marcadas,tocado?{rango:true}:null)+(e.compensa?" · accesorio compensatorio":""),
        rest:src.rest,
        _id:src.id, _m:src.m, _sets:e.sets
      };
    })
  }));
}

function rutinaPats(dias){ const o=[]; dias.forEach(d=>d.ex.forEach(e=>{if(o.indexOf(e.src.pat)<0)o.push(e.src.pat)})); return o; }

/* ---------- entrada principal ---------- */
function generar(DB,inp){
  const bloq=bloqueoDuro(inp.dolor);
  if(bloq) return {bloqueo:bloq,rutina:null,audit:null,avisos:[]};

  const der=derivar(inp);
  const pre=presupuesto(inp,der);
  const marcadas=zonasMarcadas(inp.dolor);
  let dias=seleccionar(DB,inp,der,pre,marcadas);
  dias=reasignar(dias,pre,inp,DB,marcadas);
  let audit=auditar(dias,pre,inp);

  const avisos=der.avisos.slice();
  if(marcadas.length){
    avisos.push({tipo:"dolor",nivel:"info",
      txt:"Zonas marcadas: "+marcadas.map(m=>ZONA_ES[m.zona]).join(", ")+
          ". Se sustituyeron ejercicios por variantes de menor carga en esa articulación, "+
          "sin quitar ningún patrón de movimiento ni bajar el volumen del músculo. "+
          "Esto es un filtro de selección de ejercicios, no un diagnóstico."});
  }
  const bajos=audit.musculos.filter(x=>x.estado==="bajo");
  if(bajos.length&&pre.objetivo==="grasa"){
    avisos.push({tipo:"conflicto",nivel:"aviso",
      txt:"CONFLICTO: en déficit el piso es "+PISO_DEFICIT+" series por músculo, porque el error "+
          "clásico es recortar entrenamiento cuando lo que se recorta es comida. Pero con "+inp.minutos+
          " min × "+inp.dias+" días no caben. El generador NO bajó el objetivo para que la auditoría "+
          "saliera limpia: te lo deja en rojo. La salida es más días o más minutos, no menos series."});
  }
  if(bajos.length){
    avisos.push({tipo:"volumen",nivel:"aviso",
      txt:"El presupuesto de tiempo no da para el volumen objetivo en: "+
          bajos.map(x=>MUS_ES[x.m]+" ("+x.vol+"/"+x.target+")").join(", ")+
          ". No es un error del plan: con "+inp.minutos+" min × "+inp.dias+
          " días no caben más series. Para cerrar el hueco tienes que subir minutos, subir días, "+
          "o bajar la lista de prioridades. Los músculos chicos reciben además volumen indirecto "+
          "que esta cuenta ya incluye a media serie."});
  }
  const patsPlan={},patsReal={};
  (SPLITS[inp.dias]||SPLITS[4]).forEach(p=>p.pats.forEach(x=>patsPlan[x]=1));
  rutinaPats(dias).forEach(x=>patsReal[x]=1);
  const faltan=Object.keys(patsPlan).filter(p=>!patsReal[p]);
  if(faltan.length){
    avisos.push({tipo:"patron",nivel:"aviso",
      txt:"El presupuesto de tiempo dejó fuera estos patrones: "+faltan.join(", ")+
          ". Son los primeros que deberías recuperar si consigues más minutos."});
  }
  audit.musculos.filter(x=>x.estado==="alto").forEach(x=>{
    avisos.push({tipo:"volumen",nivel:"aviso",txt:MUS_ES[x.m]+" queda en "+x.vol+" series, por encima del techo de "+MAV+"."});
  });

  const rutina={
    name:"GENERADA · "+inp.dias+" DÍAS · "+
         (inp.objetivo==="grasa"?"DÉFICIT":inp.objetivo==="mantener"?"MANTENIMIENTO":"HIPERTROFIA"),
    meta:{
      fase:inp.objetivo==="grasa"?"Déficit — el volumen se protege, se recorta comida":"Hipertrofia",
      rir:"Compuestos 1-3 RIR · aislamientos 0-1 RIR",
      descanso:"Compuestos 2-3 min · aislamientos 60-90 s",
      progresion:"Doble progresión: sube reps dentro del rango; al tope en todas las series, sube el peso",
      deload:"Cada 6-8 semanas, o al estancarte 2 semanas, o si molestan las articulaciones",
      recorte:"Si vas corto de tiempo: último ejercicio → penúltimo → nunca el BOSS"
    },
    days:prescribir(dias,inp,der,marcadas)
  };
  return {rutina:rutina,audit:audit,avisos:avisos,derivado:der,presupuesto:pre,bloqueo:null};
}

let profile="default", S=null, dirty=false, saveTimer=null;

/* ---------- saneamiento (frontera de confianza) ---------- */
const COLOR_RE=/^#[0-9a-fA-F]{3,8}$/;
const PROFILE_RE=/^(default|p_[0-9]{1,12})$/;
const SAFEKEY_RE=/^[A-Za-z0-9_]{1,40}$/;
const safeColor=c=>COLOR_RE.test(String(c||""))?String(c):COLORS[0];
const asObj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
const asArr=v=>Array.isArray(v)?v:[];
const asStr=(v,m)=>typeof v==="string"?v.slice(0,m):"";
const asNum=(v,d)=>{const n=typeof v==="number"?v:parseFloat(v);return isFinite(n)?n:d;};

/* Reconstruye un estado entrante campo por campo. Regenera todos los uid:
   mata la inyección en atributos y conserva la integridad referencial. */
/* Frontera de confianza compartida: la usan el import, el restore de respaldo
   y el generador. Una sola ruta de saneamiento, no dos que se desincronizan. */
function sanitizeRoutine(raw,seq,map){
  seq=seq||{n:0}; map=map||Object.create(null);
  const R=asObj(raw), M=asObj(R.meta);
  return {
    name:asStr(R.name,120)||"RUTINA",
    meta:R.meta?{fase:asStr(M.fase,120),rir:asStr(M.rir,200),descanso:asStr(M.descanso,200),
                 progresion:asStr(M.progresion,300),deload:asStr(M.deload,300),recorte:asStr(M.recorte,300)}:null,
    days:asArr(R.days).slice(0,20).map(d=>{ d=asObj(d);
      const du="d_"+(++seq.n);
      if(typeof d.uid==="string") map["c_"+d.uid]="c_"+du;
      return {uid:du, n:asStr(d.n,120)||"DÍA", c:safeColor(d.c),
        stat:STATS.indexOf(d.stat)>=0?d.stat:"STR", cardio:asStr(d.cardio,200),
        ex:asArr(d.ex).slice(0,40).map(e=>{ e=asObj(e);
          const xu="x_"+(++seq.n); if(typeof e.uid==="string") map[e.uid]=xu;
          const o={uid:xu,n:asStr(e.n,120)||"Ejercicio",s:asStr(e.s,60),boss:!!e.boss,note:asStr(e.note,300)};
          const rs=asNum(e.rest,0); if(rs>=10&&rs<=900) o.rest=Math.round(rs);
          return o;
        })};
    })};
}

function sanitizeState(raw){
  const s=asObj(raw), out=blank(), map=Object.create(null), seq={n:0};
  out.schema=asNum(s.schema,1);
  out.week=Math.max(1,Math.round(asNum(s.week,1)));
  out.active=Math.max(1,Math.round(asNum(s.active,1)));
  out.xp=asNum(s.xp,0);
  out.xpBase=(typeof s.xpBase==="number"&&isFinite(s.xpBase))?s.xpBase:null;
  out.weekBonus=!!s.weekBonus;
  out.baselineSeeded=!!s.baselineSeeded;
  const R=sanitizeRoutine(s.routine,seq,map);
  out.routine=R; out.uidSeq=seq.n;
  /* remapea al uid nuevo; si no hay rutina (import legacy) conserva las claves
     con forma segura para que la migración de records por nombre siga funcionando */
  const remap=(src,f)=>{const o={},v=asObj(src);
    for(const k in v){ if(!Object.prototype.hasOwnProperty.call(v,k)) continue;
      const nk=map[k]||(SAFEKEY_RE.test(k)?k:null); if(nk) o[nk]=f(v[k]); }
    return o;};
  out.checked        = remap(s.checked,       v=>!!v);
  out.weights        = remap(s.weights,       v=>asStr(String(v),20));
  out.sets           = remap(s.sets,          v=>asStr(String(v),40));
  out.lastWeights    = remap(s.lastWeights,   v=>asStr(String(v),20));
  out.allTimeWeights = remap(s.allTimeWeights,v=>asNum(v,0));
  out.weightHistory  = remap(s.weightHistory, v=>asArr(v).slice(-200)
                        .map(h=>({w:asNum(asObj(h).w,0),d:asStr(asObj(h).d,10)})));
  out.prev = remap(s.prev, v=>({w:asStr(String(asObj(v).w||""),20),
                                r:asStr(String(asObj(v).r||""),40),
                                d:asStr(String(asObj(v).d||""),10)}));
  const sgen=asObj(s.gen);
  out.gen = Object.keys(sgen).length?{
    edad:asNum(sgen.edad,30), sexo:asStr(sgen.sexo,10), peso:asNum(sgen.peso,0),
    altura:asNum(sgen.altura,0), anios:asNum(sgen.anios,0), dias:asNum(sgen.dias,4),
    minutos:asNum(sgen.minutos,60), cardio:asNum(sgen.cardio,10),
    objetivo:["masa","grasa","mantener"].indexOf(sgen.objetivo)>=0?sgen.objetivo:"masa",
    cintura:asNum(sgen.cintura,0),
    equipo:asArr(sgen.equipo).filter(x=>typeof x==="string").slice(0,20),
    prioridad:asArr(sgen.prioridad).filter(x=>MUS_AUDIT.indexOf(x)>=0).slice(0,2),
    excluirTags:asArr(sgen.excluirTags).filter(x=>typeof x==="string").slice(0,20)
  }:null;
  out.proposal=null;                       // una propuesta nunca sobrevive a un import
  const sp=asObj(s.pain), spz=asObj(sp.zonas), spb=asObj(sp.banderas);
  out.pain={zonas:{},banderas:{}};
  ZONAS.forEach(z=>{ const sev=Math.round(asNum(asObj(spz[z]).sev,0));
    if(sev>=1&&sev<=4) out.pain.zonas[z]={sev:sev}; });
  BANDERAS.forEach(b=>{ if(spb[b.k]) out.pain.banderas[b.k]=true; });
  out.painLog=asArr(s.painLog).slice(-200).map(x=>{ x=asObj(x);
    return {d:asStr(x.d,10), z:ZONAS.indexOf(x.z)>=0?x.z:"", dur:asNum(x.dur,0), man:asNum(x.man,0)};
  }).filter(x=>x.z&&/^\d{4}-\d{2}-\d{2}$/.test(x.d));
  const sg=asObj(s.settings);
  out.settings={timer:sg.timer!==false,sound:sg.sound!==false,
                vibrate:sg.vibrate!==false,wake:sg.wake!==false};
  if(["corte","volumen","mantener"].indexOf(sg.fase)>=0) out.settings.fase=sg.fase;
  out.measurements = asArr(s.measurements).slice(0,500).map(m=>{ m=asObj(m);
      const o={date:asStr(m.date,10),week:Math.round(asNum(m.week,0))};
      const lb=asStr(m.label,80); if(lb) o.label=lb;
      MFIELDS.forEach(f=>{const n=asNum(m[f.k],null); if(n!==null) o[f.k]=n;});
      return o;
    }).filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date));
  return out;
}

/* ---------- registro de perfiles ---------- */
function profiles(){
  let list=readJSON(K_PROFILES);
  if(!Array.isArray(list)||!list.length) list=[{id:"default",name:"Dave"}];
  list=list.filter(p=>p&&PROFILE_RE.test(p.id))
           .map(p=>({id:p.id,name:asStr(p.name,40)||p.id}));
  if(!list.length) list=[{id:"default",name:"Dave"}];
  return list;
}
function saveProfiles(l){ writeJSON(K_PROFILES,l); }
function profileName(id){ const p=profiles().find(x=>x.id===id); return p?p.name:id; }
function newProfileId(){
  const used=profiles().map(p=>p.id);
  let n=1; while(used.indexOf("p_"+n)>=0) n++;
  return "p_"+n;
}

function blank(){
  return {schema:SCHEMA,app:APP_VERSION,profile:"default",uidSeq:0,routine:null,
    checked:{},weights:{},sets:{},lastWeights:{},allTimeWeights:{},weightHistory:{},
    measurements:[],photos:[],xp:0,xpBase:0,week:1,active:1,weekBonus:false,
    prev:{}, settings:{timer:true,sound:true,vibrate:true,wake:true},
    gen:null, proposal:null, pain:{zonas:{},banderas:{}}, painLog:[],
    baselineSeeded:false,lastBackup:null};
}
function uid(pfx){ S.uidSeq=(S.uidSeq||0)+1; return pfx+S.uidSeq; }
function buildRoutine(preset){
  return {name:preset.name, meta:preset.meta?Object.assign({},preset.meta):null,
    days:preset.days.map(d=>({
      uid:uid("d_"), n:d.n, c:d.c, stat:d.stat, cardio:d.cardio||"",
      ex:d.ex.map(e=>{const o={uid:uid("x_"),n:e.n,s:e.s,boss:!!e.boss,note:e.note||""};
                      if(e.rest) o.rest=e.rest; return o;})
    }))};
}
const readJSON=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("ERROR AL GUARDAR: "+e.name);return false}};

function upgrade(st){
  st=Object.assign(blank(),st||{});
  const from=st.schema||1;
  if(from<2){ st.allTimeWeights=st.allTimeWeights||{}; st.weightHistory=st.weightHistory||{};
    st.measurements=st.measurements||[]; st.photos=st.photos||[]; }
  if(from<3 || typeof st.xpBase!=="number"){
    st.xpBase=null; // se resuelve más abajo
  }
  st.settings=Object.assign({timer:true,sound:true,vibrate:true,wake:true},asObj(st.settings));
  /* schema 7→8: campos del generador. Puramente aditivo — nada existente cambia de forma. */
  if(!st.gen) st.gen=null;
  if(!st.proposal) st.proposal=null;
  st.pain=Object.assign({zonas:{},banderas:{}},asObj(st.pain));
  st.pain.zonas=asObj(st.pain.zonas); st.pain.banderas=asObj(st.pain.banderas);
  if(!Array.isArray(st.painLog)) st.painLog=[];
  st.prev=asObj(st.prev);
  if(from<7){   // arrastra la carga de la semana pasada al formato nuevo {peso, reps}
    const lw=asObj(st.lastWeights);
    for(const k in lw) if(Object.prototype.hasOwnProperty.call(lw,k) && lw[k] && !st.prev[k])
      st.prev[k]={w:String(lw[k]),r:"",d:""};
  }
  if(!st.baselineSeeded && (!st.measurements||!st.measurements.length)){
    st.measurements=[Object.assign({},BASELINE)]; st.baselineSeeded=true;
  }
  const prevS=S; S=st; // uid() necesita S
  if(from<4 || !st.routine || !st.routine.days || !st.routine.days.length){
    // XP viejo se calculaba con los ids d<i>_<j>; consolidarlo antes de cambiar de rutina
    const oldXP = (typeof st.xp==="number"?st.xp:0);
    st.xpBase = oldXP;
    // rescatar records por NOMBRE de ejercicio antes de tirar los ids viejos
    const byName={};
    LEGACY_IDS.forEach(d=>d.ex.forEach((nm,j)=>{
      const oid=d.id+"_"+(j+1);
      if(st.allTimeWeights&&st.allTimeWeights[oid]!==undefined) byName[nm]={best:st.allTimeWeights[oid],hist:(st.weightHistory||{})[oid]};
    }));
    st.routine=buildRoutine(PRESET_UL5);
    const nAT={},nWH={};
    st.routine.days.forEach(d=>d.ex.forEach(e=>{
      const m=priorRecord(byName,e.n); if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; }
    }));
    st.allTimeWeights=nAT; st.weightHistory=nWH;
    st.checked={}; st.weights={}; st.sets={}; st.lastWeights={};
    st.active=1;
    window.__routineReset=(from<4);
  }
  if(typeof st.xpBase!=="number"||st.xpBase===null) st.xpBase=Math.max(0,(st.xp||0)-weekXP(st.checked||{},st.routine));
  st.schema=SCHEMA; st.app=APP_VERSION; st.profile=profile;
  if(prevS===null){} // no-op
  return st;
}
function backup(label,data){
  const list=readJSON(bKey(profile))||[];
  list.unshift({t:Date.now(),label:label,schema:data.schema||1,app:data.app||"?",data:JSON.parse(JSON.stringify(data))});
  writeJSON(bKey(profile),list.slice(0,MAX_BACKUPS));
}
function load(){
  const list=profiles(); saveProfiles(list);
  const want=localStorage.getItem(K_ACTIVE);
  profile=(want&&PROFILE_RE.test(want)&&list.some(p=>p.id===want))?want:list[0].id;
  localStorage.setItem(K_ACTIVE,profile);
  let raw=readJSON(sKey(profile));
  if(!raw){
    const legacy=readJSON(LEGACY_STATE);
    if(legacy){
      const lb=readJSON(LEGACY_BACKUPS);
      if(lb&&lb.length) writeJSON(bKey(profile),lb.slice(0,MAX_BACKUPS));
      S=blank(); backup("auto pre-v4.0 (migración)",legacy);
      raw=legacy; window.__migrated=true;
    }
  }
  if(raw && (raw.schema||1)<SCHEMA){ S=blank(); backup("auto pre-schema"+SCHEMA,raw); }
  S=upgrade(raw||blank());
  save();
}
function save(){
  S.app=APP_VERSION; S.schema=SCHEMA; S.profile=profile;
  if(S.routine) S.xp=totalXP();   // xp es derivado: recalcularlo siempre antes de persistir
  dirty = !writeJSON(sKey(profile),S);   // si el guardado falla, sigue sucio
}
function queueSave(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(()=>{saveTimer=null;save();},300); }
function flushNow(){ if(dirty||saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(); } }

/* ============================================================
   XP / niveles
   ============================================================ */
function weekXP(ch,rt){
  rt=rt||(S&&S.routine); if(!rt||!rt.days) return 0;
  let xp=0;
  rt.days.forEach(d=>{
    let all=true;
    if(d.cardio){ if(ch["c_"+d.uid]) xp+=XP_EXERCISE; else all=false; }
    d.ex.forEach(e=>{ if(ch[e.uid]) xp+=(e.boss?XP_BOSS:XP_EXERCISE); else all=false; });
    if(all && (d.ex.length||d.cardio)) xp+=XP_QUEST_CLEAR;
  });
  return xp;
}
const totalXP=()=>(S.xpBase||0)+weekXP(S.checked);
function levelFrom(xp){
  let lv=1,need=BASE_NEED,rem=xp;
  while(rem>=Math.round(need)){ rem-=Math.round(need); lv++; need*=NEED_MULT; if(lv>200)break; }
  return {lv:lv,cur:rem,need:Math.round(need)};
}
const rankOf=lv=>RANKS.find(r=>lv>=r.lv)||RANKS[RANKS.length-1];
function questDone(d){
  if(d.cardio && !S.checked["c_"+d.uid]) return false;
  if(!d.ex.length && !d.cardio) return false;
  return d.ex.every(e=>S.checked[e.uid]);
}

/* Pinta el avatar del tier. Si el PNG no carga (assets/ no subido, offline la primera vez),
   cae al sigilo hexagonal de v6 en vez de dejar un ícono roto. */
function paintAvatar(R){
  const T=tierOf(R.r), sig=$("#sigil");
  if(sig.dataset.tier!==String(T.t)){
    sig.dataset.tier=String(T.t); delete sig.dataset.fallback;
    sig.innerHTML="";
    const img=document.createElement("img");
    img.alt=T.label; img.loading="lazy";
    img.onerror=()=>{ sig.dataset.fallback="1"; sig.innerHTML=sigilSVG(R.r,safeColor(R.c)); };
    img.src=T.img;
    sig.appendChild(img);
  } else if(sig.dataset.fallback==="1"){
    sig.innerHTML=sigilSVG(R.r,safeColor(R.c));      // el rango cambió dentro del mismo tier
  }
  sig.style.borderColor=safeColor(R.c);
  sig.style.boxShadow="0 0 16px "+safeColor(R.c)+"55, inset 0 0 20px "+safeColor(R.c)+"22";
  return T;
}

/* Video de ascenso de tier. Si el archivo no existe o tarda demasiado,
   cierra solo y sigue con el LEVEL UP normal. */
function canPlayMp4(){
  try{
    const v=document.createElement("video");
    return !!(v.canPlayType('video/mp4; codecs="avc1.42E01E"')||v.canPlayType('video/mp4; codecs="avc1.4D401E"'));
  }catch(e){ return false; }
}
function playRankTransition(T,lv,R){
  const wrap=$("#rankvid"), vid=$("#rankvidEl");
  document.dispatchEvent(new CustomEvent("arise:transition",{detail:{tier:T.t,vid:T.vid||null,lv:lv}}));
  // Sin soporte de H.264 no tiene caso pintar la pantalla en negro para nada
  if(!T.vid||!wrap||!vid||!canPlayMp4()){ levelUp(lv,R); return; }
  let done=false;
  const finish=()=>{
    if(done) return; done=true;
    clearTimeout(vid.__to);
    wrap.classList.remove("on");
    try{ vid.pause(); }catch(e){}
    vid.onended=null; vid.onerror=null; vid.removeAttribute("src");
    levelUp(lv,R);
  };
  vid.onended=finish; vid.onerror=finish;
  $("#rankvidSkip").onclick=finish;
  vid.__to=setTimeout(finish,15000);        // red de seguridad
  vid.src=T.vid; wrap.classList.add("on");
  vid.muted=false;
  try{ vid.currentTime=0; }catch(e){}
  /* Las políticas de autoplay pueden rechazar el play() si no hay gesto reciente.
     Reintentar en silencio antes de rendirse: mejor el video mudo que ningún video. */
  const pr=vid.play();
  if(pr&&pr.catch) pr.catch(()=>{
    vid.muted=true;
    const pr2=vid.play();
    if(pr2&&pr2.catch) pr2.catch(()=>finish());
  });
  buzz([20,40,20,40,120]);
}

/* ============================================================
   v7 · descanso, avisos, wake lock, PR
   ============================================================ */
/* Compuestos → 150 s · aislamientos → 75 s. La rutina v5 ya codifica la distinción
   en la nota (compuestos 1-3 RIR, aislamientos 0-1), así que se lee de ahí primero. */
const REST_COMPOUND=150, REST_ISO=75;
const COMPOUND_RE=/press|row|pulldown|pull-?up|chin|deadlift|squat|dip|hip thrust|lunge|prensa|remo|jal[oó]n/i;
function restFor(e){
  const r=Number(e&&e.rest);
  if(isFinite(r)&&r>=10&&r<=900) return Math.round(r);
  if(!e) return REST_ISO;
  if(e.boss) return REST_COMPOUND;
  if(/RIR\s*1\s*-\s*[23]/i.test(e.note||"")) return REST_COMPOUND;
  if(COMPOUND_RE.test(e.n||"")) return REST_COMPOUND;
  return REST_ISO;
}
function setOf(k){ return !S||!S.settings||S.settings[k]!==false; }
function buzz(pat){ if(!setOf("vibrate")||!navigator.vibrate) return; try{navigator.vibrate(pat||[60,60,150])}catch(e){} }
let AC=null;
function beep(freq,dur){
  if(!setOf("sound")) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=AC||new Ctx(); if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime, D=dur||0.3;
    o.type="sine"; o.frequency.setValueAtTime(freq||880,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+D);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+D+0.02);
  }catch(e){}
}

/* ---- timer de descanso ---- */
const rest={end:0,total:0,iv:null,label:""};
const restRunning=()=>rest.iv!==null;
function startRest(secs,label){
  if(!setOf("timer")||!secs) return;
  rest.end=Date.now()+secs*1000; rest.total=secs; rest.label=label||"";
  const bar=$("#restbar"); if(!bar) return;
  bar.classList.remove("hide"); $("#rbname").textContent=label||"DESCANSO";
  if(rest.iv) clearInterval(rest.iv);
  rest.iv=setInterval(tickRest,200); tickRest();
}
function tickRest(){
  const bar=$("#restbar"); if(!bar) return;
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  $("#rbtime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#rbfill").style.width=(rest.total?Math.max(0,left/rest.total*100):0)+"%";
  bar.classList.toggle("low",left<=10);
  if(left<=0) stopRest(true);
}
function stopRest(fire){
  if(rest.iv){ clearInterval(rest.iv); rest.iv=null; }
  const bar=$("#restbar"); if(bar){ bar.classList.add("hide"); bar.classList.remove("low"); }
  if(fire){ buzz([90,70,90,70,180]); beep(880,0.28); setTimeout(()=>beep(1180,0.22),170);
            toast("⏱ DESCANSO TERMINADO · " + (rest.label||"")); }
}

/* ---- wake lock ---- */
let wakeLock=null;
function sessionActive(){
  if(!S||!S.routine||!S.routine.days.length) return false;
  const d=S.routine.days[(S.active||1)-1]; if(!d) return false;
  const any=(d.cardio&&S.checked["c_"+d.uid])||d.ex.some(e=>S.checked[e.uid]);
  return !!any && !questDone(d);
}
function wakeDot(on){ const el=$("#wakedot"); if(el) el.classList.toggle("hide",!on); }
async function acquireWake(){
  if(!setOf("wake")||wakeLock||!("wakeLock" in navigator)) return;   // fallback silencioso
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{wakeLock=null;wakeDot(false);});
    wakeDot(true);
  }catch(e){ wakeLock=null; }
}
function releaseWake(){
  if(wakeLock){ try{wakeLock.release()}catch(e){} wakeLock=null; }
  wakeDot(false);
}
function syncWake(){ if(sessionActive()) acquireWake(); else releaseWake(); }

function delta(cur,prev,inverse){

  return '<span class="dlt '+((inverse?d<0:d>0)?"up":"dn")+'">'+(d>0?"+":"")+d.toFixed(1)+'</span>';
}

/* La lectura depende de la FASE. En corte, "bajaste peso" es la meta;
   en volumen es superávit insuficiente. Leerlo al revés es peor que no leerlo. */
function faseActual(){
  const f=S.settings&&S.settings.fase;
  if(f==="corte"||f==="volumen"||f==="mantener") return f;
  const o=S.gen&&S.gen.objetivo;
  return o==="grasa"?"corte":o==="mantener"?"mantener":"volumen";
}
const FASE_ES={corte:"CORTE · bajar grasa",volumen:"VOLUMEN · subir masa",mantener:"MANTENIMIENTO"};

function coachRead(base,last,prev){
  const out=[], fase=faseActual();
  const pc=last.weight?last.weight:(base.weight||80);
  if(prev&&prev.weight!=null&&last.weight!=null){
    const dw=Math.round((last.weight-prev.weight)*100)/100;
    const pct=Math.abs(dw)/pc*100;
    if(fase==="corte"){
      /* Referencia habitual en corte: 0.5–1% del peso corporal por semana.
         Más rápido y sube el riesgo de perder músculo junto con la grasa. */
      const lo=pc*0.005, hi=pc*0.01;
      if(dw>0.3) out.push(['bad','Subiste '+dw.toFixed(1)+' kg en corte. Una semana puede ser agua o sal; '+
        'dos seguidas ya es que el déficit no está donde crees.']);
      else if(dw>=-0.05) out.push(['','Peso estable. Si se repite 2-3 semanas, el déficit se cerró — '+
        'suele ser adherencia o gasto que bajó, no metabolismo roto.']);
      else if(Math.abs(dw)<lo) out.push(['ok','−'+Math.abs(dw).toFixed(1)+' kg. Lento pero en la dirección correcta. '+
        'Bajar despacio protege músculo.']);
      else if(Math.abs(dw)<=hi) out.push(['ok','−'+Math.abs(dw).toFixed(1)+' kg ('+pct.toFixed(1)+'% del peso corporal) — '+
        'justo en el rango que protege masa muscular ('+lo.toFixed(2)+'–'+hi.toFixed(2)+' kg/sem para ti).']);
      else out.push(['bad','−'+Math.abs(dw).toFixed(1)+' kg en una semana ('+pct.toFixed(1)+'%). Arriba de 1% del peso '+
        'corporal sube el riesgo de que parte de lo que pierdes sea músculo. Coméntalo con Fernanda.']);
    } else if(fase==="volumen"){
      if(dw>0.5) out.push(['bad','Subiste '+dw.toFixed(1)+' kg en una semana. Arriba de 0.4 kg/sem el excedente tiende a ser grasa. Avísale a Fernanda antes de que se acumule.']);
      else if(dw>=0.15) out.push(['ok','+'+dw.toFixed(1)+' kg esta semana — dentro del rango ideal de volumen (0.2–0.4 kg/sem).']);
      else if(dw>=-0.05) out.push(['','Peso prácticamente estable. Si se repite 2-3 semanas, el superávit se quedó corto.']);
      else out.push(['bad','Bajaste '+Math.abs(dw).toFixed(1)+' kg. En fase de volumen eso es superávit insuficiente.']);
    } else {
      if(Math.abs(dw)<=0.3) out.push(['ok','Peso estable ('+(dw>0?"+":"")+dw.toFixed(1)+' kg). Es lo que buscas en mantenimiento.']);
      else out.push(['','Movimiento de '+(dw>0?"+":"")+dw.toFixed(1)+' kg. En mantenimiento conviene revisar si fue intencional.']);
    }
  }
  const dwaist=(last.waist!=null&&base.waist!=null)?last.waist-base.waist:null;
  const darm=(last.armR_flex!=null&&base.armR_flex!=null)?last.armR_flex-base.armR_flex:null;
  if(dwaist!=null&&darm!=null){
    if(fase==="corte"){
      /* sin zonas muertas: toda combinación cintura×brazo cae en exactamente una rama */
      if(dwaist<=-0.5){
        if(darm<-0.8) out.push(['','Cintura '+dwaist.toFixed(1)+' cm, pero el brazo también bajó '+
          Math.abs(darm).toFixed(1)+' cm. Vale la pena subir proteína o bajar el ritmo del déficit.']);
        else out.push(['ok','Cintura '+dwaist.toFixed(1)+' cm con el brazo casi intacto ('+
          (darm>0?"+":"")+darm.toFixed(1)+' cm). Estás perdiendo grasa sin pagar músculo — es el mejor escenario del corte.']);
      }
      else if(dwaist>=-0.3) out.push(['','La cintura casi no se ha movido desde el baseline ('+
        (dwaist>0?"+":"")+dwaist.toFixed(1)+' cm). Es la medida que más directamente refleja la grasa que quieres quitar.']);
      else out.push(['','Cintura '+dwaist.toFixed(1)+' cm. Va en la dirección correcta, todavía poco para leer tendencia.']);
    } else {
      if(dwaist>1.5&&darm<=dwaist*0.5) out.push(['bad','Cintura +'+dwaist.toFixed(1)+' cm vs brazo +'+darm.toFixed(1)+
        ' cm. La cintura es el indicador temprano: el superávit se fue de más. Bajar calorías.']);
      else if(darm>0&&dwaist<=0.5) out.push(['ok','Brazo +'+darm.toFixed(1)+' cm con cintura casi sin moverse. Este es el escenario que buscas.']);
    }
  }
  /* cintura/estatura solo si la app conoce la estatura */
  const alt=(S.gen&&S.gen.altura)?+S.gen.altura:0;
  if(alt>100&&last.waist){
    const r=last.waist/alt;
    if(r>0.53&&fase==="volumen") out.push(['','Cintura/estatura '+r.toFixed(3)+' (>0.53). Con ese número, un corte '+
      'antes del volumen suele rendir más. Señal, no veredicto.']);
    else if(r<=0.53) out.push(['ok','Cintura/estatura '+r.toFixed(3)+' — por debajo del umbral de 0.53.']);
  }
  const asym=(last.armR_flex!=null&&last.armL_flex!=null)?Math.abs(last.armR_flex-last.armL_flex):null;
  if(asym!=null&&asym>=1) out.push(['','Diferencia de '+asym.toFixed(1)+' cm entre brazos. Arriba de 1 cm conviene empezar los unilaterales por el lado chico.']);
  if(!out.length) out.push(['','Aún sin suficiente historial para leer tendencia. Con 3 semanas ya se puede.']);
  return out.map(o=>'<div class="alert '+o[0]+'">'+o[1]+'</div>').join("");
}
function sparkBlock(title,vals){
  const v=vals.filter(x=>typeof x==="number"&&!isNaN(x));
  if(v.length<2) return "";
  const mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1,W=300,H=48,P=4;
  const pts=v.map((x,i)=>(P+(i/(v.length-1))*(W-P*2)).toFixed(1)+","+(H-P-((x-mn)/rg)*(H-P*2)).toFixed(1)).join(" ");
  return '<div class="grp">'+title+' · '+v[0].toFixed(1)+' → '+v[v.length-1].toFixed(1)+'</div>'+
    '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><polyline points="'+pts+
    '" fill="none" stroke="#4fd6ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function parseImport(txt){
  let o; try{ o=JSON.parse(txt); }catch(e){ throw new Error("JSON inválido"); }
  let st=null,backups=null;
  if(o&&o._keys){
    const K=o._keys;
    st=K[sKey(profile)]||K["arise:default:state"]||K[LEGACY_STATE]||null;
    backups=K[bKey(profile)]||K["arise:default:backups"]||K[LEGACY_BACKUPS]||null;
    if(!st) for(const k in K){ const v=K[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&("xp" in v||"checked" in v)){ st=v; break; } }
  } else if(o&&(("xp" in o)||("checked" in o))) st=o;
  else if(o&&o.data&&(("xp" in o.data)||("checked" in o.data))) st=o.data;
  if(!st) throw new Error("No encontré un estado válido");
  return {state:st,backups:Array.isArray(backups)?backups:null};
}

/* ============================================================
   v8 · semáforo de dolor (capa 4)
   Modelo de monitoreo de dolor tipo Silbernagel. Viene de rehabilitación de
   tendinopatía; extenderlo a dolor articular general es una analogía razonable
   y de uso común, pero NO está validado para eso. Se etiqueta como tal.
   ============================================================ */
function zonasActivas(){ return zonasMarcadas(S.pain); }
function diaTocaZona(d){
  const mk=zonasActivas(); if(!mk.length||!d) return null;
  for(let i=0;i<mk.length;i++){
    const hay=d.ex.some(e=>{ const src=GENDB.find(x=>x.n===e.n); return src&&(src.stress[mk[i].zona]||0)>=1; });
    if(hay) return mk[i].zona;
  }
  return null;
}
function semaforo(zona){
  const log=(S.painLog||[]).filter(x=>x.z===zona).slice(-8);
  if(!log.length) return {estado:"sin",txt:"Sin registros todavía."};
  const u=log[log.length-1];
  const base=log.length>1?Math.min.apply(null,log.map(x=>x.man)):u.man;
  const prev=log.length>1?log[log.length-2]:null;
  if(prev&&u.dur>prev.dur+1)
    return {estado:"rojo",txt:"El dolor subió de una sesión a la siguiente ("+prev.dur+" → "+u.dur+
      "). Toca sustituir por la variante de menor carga en esa articulación.",accion:"sustituir"};
  if(u.dur>5||u.man>base+1)
    return {estado:"ambar",txt:"Dolor "+u.dur+"/10 durante"+(u.man>base+1?" y no volvió a tu línea base al día siguiente":"")+
      ". Baja ~10% la carga de ese patrón la próxima sesión.",accion:"bajar"};
  const verdes=log.slice(-3).filter(x=>x.dur<=5&&x.man<=base+1).length;
  if(verdes>=2&&log.length>=2)
    return {estado:"verde",txt:"Verde "+verdes+" sesiones seguidas. Si llegas a 2-3 semanas así, puedes subir carga "+
      "o pasar a la variante de más rango.",accion:"subir"};
  return {estado:"verde",txt:"Dentro de rango ("+u.dur+"/10 durante, "+u.man+"/10 al día siguiente)."};
}
function pedirDolor(zona){
  const dur=prompt("Dolor DURANTE la sesión en "+ZONA_ES[zona].toLowerCase()+" (0-10):","");
  if(dur===null) return;
  const man=prompt("¿Y cómo amaneciste? Dolor a la mañana siguiente (0-10):","");
  if(man===null) return;
  const d=Math.max(0,Math.min(10,parseInt(dur,10)||0));
  const m=Math.max(0,Math.min(10,parseInt(man,10)||0));
  S.painLog=(S.painLog||[]).concat([{d:today(),z:zona,dur:d,man:m}]).slice(-200);
  save(); render();
  const sem=semaforo(zona);
  toast(sem.estado==="rojo"?"🔴 "+ZONA_ES[zona].toUpperCase():
        sem.estado==="ambar"?"🟠 "+ZONA_ES[zona].toUpperCase():"🟢 "+ZONA_ES[zona].toUpperCase());
}

  let h='<div class="gtit">SEMÁFORO DE DOLOR</div>';

     'Se usa mucho por analogía en dolor articular, pero <b>no está validado para eso</b>. '+
     'Es una guía para decidir carga, no una medida clínica.</div>';
  const mk=zonasActivas();
  if(!mk.length) h+='<div class="muted">No tienes zonas marcadas. Márcalas en el generador.</div>';
  mk.forEach(m=>{
    const sem=semaforo(m.zona);
    const col=sem.estado==="rojo"?"bad":sem.estado==="ambar"?"":"ok";
    h+='<div class="gsec">'+ZONA_ES[m.zona].toUpperCase()+'</div>';
    h+='<div class="alert '+col+'">'+esc(sem.txt)+'</div>';
    const log=(S.painLog||[]).filter(x=>x.z===m.zona).slice(-10);
    if(log.length>1){
      const W=300,H=48,P=4,mx=10;
      const pts=log.map((x,i)=>(P+(i/(log.length-1))*(W-P*2)).toFixed(1)+","+(H-P-(x.dur/mx)*(H-P*2)).toFixed(1)).join(" ");
      const pts2=log.map((x,i)=>(P+(i/(log.length-1))*(W-P*2)).toFixed(1)+","+(H-P-(x.man/mx)*(H-P*2)).toFixed(1)).join(" ");
      h+='<div class="grp">DURANTE (cian) · MAÑANA SIGUIENTE (ámbar)</div>'+
         '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
         '<polyline points="'+pts+'" fill="none" stroke="#4fd6ff" stroke-width="2"/>'+
         '<polyline points="'+pts2+'" fill="none" stroke="#ffca4f" stroke-width="2"/></svg>';
    }
    log.slice().reverse().forEach(x=>{
      h+='<div class="mrow"><span class="k">'+esc(x.d)+'</span><span class="v">'+x.dur+' / '+x.man+'</span></div>';
    });
  });
  h+='<div style="height:20px"></div>';
  $("#genBody").innerHTML=h;
  $("#genBar").innerHTML='<button class="btn gh" id="genCancel">CERRAR</button>';
}

function aplicarPropuesta(){
  const pr=S.proposal; if(!pr||!pr.rutina) return;
  if(!confirm("¿Reemplazar tu rutina actual por la generada?\n\nSe respalda antes. El XP se conserva "+
    "y los records migran cuando el nombre del ejercicio coincide.")) return;
  flushNow(); backup("pre-generador",S);
  const byName={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{
    if(S.allTimeWeights[e.uid]!==undefined) byName[e.n]={best:S.allTimeWeights[e.uid],hist:S.weightHistory[e.uid]};
  }));
  S.xpBase=(S.xpBase||0)+weekXP(S.checked);
  /* misma frontera de confianza que el import: se reconstruye y se regeneran los uid */
  const limpia=sanitizeRoutine(pr.rutina);
  S.routine=limpia;
  const nAT={},nWH={};
  S.routine.days.forEach(d=>d.ex.forEach(e=>{ const m=priorRecord(byName,e.n);
    if(m){ nAT[e.uid]=m.best; if(m.hist) nWH[e.uid]=m.hist; } }));
  S.allTimeWeights=nAT; S.weightHistory=nWH;
  S.checked={}; S.weights={}; S.sets={}; S.lastWeights={}; S.active=1;
  S.proposal=null; S.xp=totalXP();
  save(); closeGen(); toast("RUTINA APLICADA · "+S.routine.days.length+" DÍAS");
}

document.addEventListener("click",e=>{
  const t=e.target;
  const nav=t.closest("nav button");        if(nav){ flushNow(); TAB=nav.dataset.t; render(); return; }
  const go=t.closest("[data-go]");          if(go){ flushNow(); TAB=go.dataset.go; render(); return; }
  const dayb=t.closest(".days button");     if(dayb){ flushNow(); S.active=+dayb.dataset.d; save(); render(); syncWake(); return; }

  const chk=t.closest("[data-chk]");
  if(chk){ flushNow(); const id=chk.dataset.chk;
    const nowOn=!S.checked[id];
    if(nowOn) S.checked[id]=true; else delete S.checked[id];
    save(); render(); buzz([12]);
    if(nowOn){
      const f=findEx(id);                       // null si es el cardio
      if(f) startRest(restFor(f.e),f.e.n); else stopRest(false);
      acquireWake();
    }
    syncWake();
    return; }

  const tech=t.closest("[data-tech]");
  if(tech){ const k=tech.dataset.tech; if(openTech[k]) delete openTech[k]; else openTech[k]=1; render(); return; }

  /* ---- generador ---- */
  if(t.id==="openGen"){ flushNow(); openGen(); return; }
  if(t.id==="openPain"){ flushNow(); $("#gen").classList.add("on"); $("#genBar").classList.add("on");
    document.body.style.overflow="hidden"; renderPain(); return; }
  if(t.id==="genCancel"){ closeGen(); return; }
  if(t.id==="genBack"){ S.proposal=null; save(); renderGen(); return; }
  if(t.id==="genApply"){ aplicarPropuesta(); return; }
  if(t.id==="genRun"){
    const inp=Object.assign({},genForm,{dolor:genForm.pain});
    S.gen={edad:inp.edad,sexo:inp.sexo,peso:inp.peso,altura:inp.altura,anios:inp.anios,dias:+inp.dias,
           minutos:inp.minutos,cardio:inp.cardio,objetivo:inp.objetivo,cintura:inp.cintura,
           equipo:inp.equipo.slice(),prioridad:inp.prioridad.slice(),excluirTags:inp.excluirTags.slice()};
    S.pain=JSON.parse(JSON.stringify(genForm.pain));
    let res;
    try{ res=generar(GENDB,inp); }
    catch(err){ toast("ERROR AL GENERAR: "+err.message); return; }
    S.proposal=res.bloqueo?null:{rutina:res.rutina,audit:res.audit,avisos:res.avisos};
    save(); renderPropuesta(res);
    return;
  }
  const geq=t.closest("[data-geq]");
  if(geq&&genForm){ const k=geq.dataset.geq, i=genForm.equipo.indexOf(k);
    if(i>=0) genForm.equipo.splice(i,1); else genForm.equipo.push(k); renderGen(); return; }
  const gpr=t.closest("[data-gpr]");
  if(gpr&&genForm){ const k=gpr.dataset.gpr, i=genForm.prioridad.indexOf(k);
    if(i>=0) genForm.prioridad.splice(i,1);
    else { if(genForm.prioridad.length>=2){ toast("MÁXIMO 2 PRIORIDADES"); return; } genForm.prioridad.push(k); }
    renderGen(); return; }
  const gtag=t.closest("[data-gtag]");
  if(gtag&&genForm){ const k=gtag.dataset.gtag, i=genForm.excluirTags.indexOf(k);
    if(i>=0) genForm.excluirTags.splice(i,1); else genForm.excluirTags.push(k); renderGen(); return; }
  const gz=t.closest("[data-gz]");
  if(gz&&genForm){ const z=gz.dataset.gz, v=+gz.dataset.sev;
    if(v===0) delete genForm.pain.zonas[z]; else genForm.pain.zonas[z]={sev:v};
    renderGen(); return; }
  const gfl=t.closest("[data-gfl]");
  if(gfl&&genForm){ const k=gfl.dataset.gfl;
    if(genForm.pain.banderas[k]) delete genForm.pain.banderas[k]; else genForm.pain.banderas[k]=true;
    renderGen(); return; }
  const pchk=t.closest("[data-paincheck]");
  if(pchk){ pedirDolor(pchk.dataset.paincheck); return; }

  if(t.id==="rbAdd"){ if(restRunning()){ rest.end+=30000; rest.total+=30; tickRest(); toast("+30 s"); } return; }
  if(t.id==="rbSkip"){ stopRest(false); toast("DESCANSO SALTADO"); return; }

  const fs2=t.closest("[data-fase]");
  if(fs2){ S.settings.fase=fs2.dataset.fase; save(); render(); toast("FASE: "+FASE_ES[fs2.dataset.fase]); return; }

  const tg=t.closest("[data-set]");
  if(tg){ const k=tg.dataset.set;
    S.settings[k]=!setOf(k); save(); render();
    if(k==="wake") syncWake();
    if(k==="timer"&&!S.settings.timer) stopRest(false);
    if(k==="sound"&&S.settings.sound) beep(880,0.14);
    if(k==="vibrate"&&S.settings.vibrate) buzz([40]);
    return; }

  if(t.id==="closeWeek"){ closeWeek(); return; }
  if(t.id==="saveM"){ saveMeasurement(); return; }

  const del=t.closest("[data-del]");
  if(del){ const d=del.dataset.del;
    if(confirm("¿Borrar la medición del "+d+"?")){ S.measurements=S.measurements.filter(m=>m.date!==d); save(); render(); toast("MEDICIÓN BORRADA"); }
    return; }

  /* ---- editor de rutina ---- */
  const dmv=t.closest("[data-dmv]");
  if(dmv){ flushNow(); const ds=S.routine.days, i=ds.findIndex(d=>d.uid===dmv.dataset.dmv), j=i+ +dmv.dataset.dir;
    if(j>=0&&j<ds.length){ const cur=ds[S.active-1]; ds.splice(j,0,ds.splice(i,1)[0]);
      S.active=ds.indexOf(cur)+1||1; save(); render(); } return; }
  const ddel=t.closest("[data-ddel]");
  if(ddel){ const d=findDay(ddel.dataset.ddel); if(!d) return;
    if(!confirm('¿Borrar el día "'+d.n+'" y sus '+d.ex.length+' ejercicios?\n\nLos records all-time se conservan.')) return;
    purge("c_"+d.uid); d.ex.forEach(e=>purge(e.uid));
    S.routine.days=S.routine.days.filter(x=>x.uid!==d.uid);
    if(S.active>S.routine.days.length) S.active=Math.max(1,S.routine.days.length);
    save(); render(); toast("DÍA ELIMINADO"); return; }
  if(t.id==="addDay"){ flushNow();
    S.routine.days.push({uid:uid("d_"),n:"NUEVO DÍA",c:COLORS[S.routine.days.length%COLORS.length],
      stat:"STR",cardio:CARDIO_DEF,ex:[]});
    save(); render(); toast("DÍA AGREGADO"); return; }

  const sw=t.closest("[data-dc]");
  if(sw){ const d=findDay(sw.dataset.dc); if(d){ d.c=sw.dataset.col; save(); render(); } return; }

  const eadd=t.closest("[data-eadd]");
  if(eadd){ flushNow(); const d=findDay(eadd.dataset.eadd); if(!d) return;
    d.ex.push({uid:uid("x_"),n:"Nuevo ejercicio",s:"3×10",boss:false,note:""}); save(); render(); return; }
  const emv=t.closest("[data-emv]");
  if(emv){ flushNow(); const f=findEx(emv.dataset.emv); if(!f) return;
    const i=f.d.ex.indexOf(f.e), j=i+ +emv.dataset.dir;
    if(j>=0&&j<f.d.ex.length){ f.d.ex.splice(j,0,f.d.ex.splice(i,1)[0]); save(); render(); } return; }
  const edel=t.closest("[data-edel]");
  if(edel){ const f=findEx(edel.dataset.edel); if(!f) return;
    if(!confirm('¿Borrar "'+f.e.n+'"?')) return;
    purge(f.e.uid); f.d.ex=f.d.ex.filter(x=>x.uid!==f.e.uid); save(); render(); return; }
  const eb=t.closest("[data-eboss]");
  if(eb){ const f=findEx(eb.dataset.eboss); if(f){ f.e.boss=!f.e.boss; save(); render(); } return; }

  const pr=t.closest("[data-preset]");
  if(pr){ loadPreset(pr.dataset.preset); return; }
});

/* ---- inputs ---- */
document.addEventListener("input",e=>{
  const el=e.target, d=el.dataset; if(!d) return;
  let hit=true;
  if(d.w!==undefined) S.weights[d.w]=el.value;
  else if(d.s!==undefined) S.sets[d.s]=el.value;
  else if(d.rn!==undefined) S.routine.name=el.value;
  else if(d.dn!==undefined){ const x=findDay(d.dn); if(x) x.n=el.value; }
  else if(d.dcard!==undefined){ const x=findDay(d.dcard); if(x) x.cardio=el.value; }
  else if(d.ds!==undefined){ const x=findDay(d.ds); if(x) x.stat=el.value; }
  else if(d.en!==undefined){ const f=findEx(d.en); if(f) f.e.n=el.value; }
  else if(d.es!==undefined){ const f=findEx(d.es); if(f) f.e.s=el.value; }
  else if(d.g!==undefined&&genForm){ genForm[d.g]=el.value; hit=false; }
  else if(d.enote!==undefined){ const f=findEx(d.enote); if(f) f.e.note=el.value; }
  else if(d.erest!==undefined){ const f=findEx(d.erest);
    if(f){ const v=parseInt(el.value,10);
      if(isFinite(v)&&v>=10&&v<=900) f.e.rest=v; else delete f.e.rest; } }
  else hit=false;
  if(hit){ pulse(el); queueSave(); }
});
document.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d&&d.g!==undefined&&genForm){ genForm[d.g]=e.target.value; return; }
  if(d&&d.ds!==undefined){ const x=findDay(d.ds); if(x){ x.stat=e.target.value; save(); } }
});
document.addEventListener("blur",e=>{
  const id=e.target&&e.target.dataset?e.target.dataset.w:null;
  if(id==null) return;
  flushNow();
  const n=parseFloat(String(e.target.value).replace(",","."));
  if(!isNaN(n)&&n>0){
    const best=S.allTimeWeights[id];
    (S.weightHistory[id]=S.weightHistory[id]||[]).push({w:n,d:today()});
    if(S.weightHistory[id].length>200) S.weightHistory[id]=S.weightHistory[id].slice(-200);
    if(best===undefined||n>best){ S.allTimeWeights[id]=n; save();
      e.target.classList.add("pr"); setTimeout(()=>e.target.classList.remove("pr"),1600);
      const f=findEx(id);
      prPop(f?f.e.n:"", n);                      // feedback inmediato, no solo el toast
    } else save();
  }
},true);
function pulse(el){ el.classList.add("saved"); clearTimeout(el.__p); el.__p=setTimeout(()=>el.classList.remove("saved"),650); }
["visibilitychange","pagehide","beforeunload"].forEach(ev=>document.addEventListener(ev,()=>flushNow(),true));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){ releaseWake(); }
  else { if(restRunning()) tickRest(); syncWake(); }
});
